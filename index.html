<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>American Express Mivtza</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['Inter', 'ui-sans-serif', 'system-ui'],
              body: ['Inter', 'ui-sans-serif', 'system-ui'],
            },
            boxShadow: {
              luxury: '0 28px 90px rgba(0,0,0,.22)',
              glow: '0 0 36px rgba(112,190,255,.22)',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        --bg: #f8f3e7;
        --bg-2: #ffffff;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-solid: #ffffff;
        --text: #282520;
        --muted: #756e63;
        --line: rgba(121, 96, 46, 0.2);
        --accent: #c89c3b;
        --accent-2: #f1d38b;
        --accent-soft: rgba(200, 156, 59, 0.16);
        --card-gradient: linear-gradient(135deg, #fff7df 0%, #e6bf5f 46%, #fff3c6 100%);
        --luxury-border: linear-gradient(135deg, rgba(246,215,136,.9), rgba(164,117,24,.68), rgba(255,244,204,.92));
      }

      [data-theme='Platinum'] {
        --bg: #eef2f6;
        --bg-2: #ffffff;
        --panel: rgba(255, 255, 255, 0.72);
        --panel-solid: #fbfdff;
        --text: #17202a;
        --muted: #607080;
        --line: rgba(90, 111, 132, 0.22);
        --accent: #6f8498;
        --accent-2: #94d9ff;
        --accent-soft: rgba(101, 190, 255, 0.16);
        --card-gradient: linear-gradient(135deg, #f8fbff 0%, #bdc7d1 28%, #ffffff 48%, #8797a7 100%);
        --luxury-border: linear-gradient(135deg, rgba(255,255,255,.95), rgba(101,190,255,.66), rgba(113,126,140,.72));
      }

      [data-theme='Black'] {
        --bg: #050506;
        --bg-2: #111214;
        --panel: rgba(15, 16, 18, 0.82);
        --panel-solid: #0d0e10;
        --text: #f6f3ea;
        --muted: #aaa69c;
        --line: rgba(255, 255, 255, 0.14);
        --accent: #d7d1c4;
        --accent-2: #ffffff;
        --accent-soft: rgba(255, 255, 255, 0.1);
        --card-gradient: linear-gradient(135deg, #050506 0%, #191b1f 42%, #050506 100%);
        --luxury-border: linear-gradient(120deg, #ffffff, #45484f, #f7f2df, #18191d, #ffffff);
      }

      body {
        background:
          radial-gradient(circle at top left, var(--accent-soft), transparent 30rem),
          linear-gradient(140deg, var(--bg), var(--bg-2));
        color: var(--text);
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui;
      }

      .glass-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        backdrop-filter: blur(18px);
      }

      .lux-card {
        position: relative;
        background: var(--card-gradient);
        border: 1px solid transparent;
        color: var(--text);
      }

      .lux-card::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: var(--luxury-border);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      [data-theme='Black'] .lux-card::before {
        background-size: 280% 280%;
        animation: card-border 5s linear infinite;
      }

      @keyframes card-border {
        0% { background-position: 0% 50%; }
        100% { background-position: 280% 50%; }
      }

      .focus-ring:focus {
        outline: 3px solid color-mix(in srgb, var(--accent-2), transparent 50%);
        outline-offset: 3px;
      }

      .app-button {
        background: var(--text);
        color: var(--bg-2);
      }

      [data-theme='Black'] .app-button {
        background: #f6f3ea;
        color: #050506;
      }

      .accent-text { color: var(--accent); }
      .muted-text { color: var(--muted); }
      .accent-bg { background: var(--accent-soft); }
      .line-border { border-color: var(--line); }

      .nfc-listening {
        position: relative;
        overflow: hidden;
      }

      .nfc-listening::after {
        content: '';
        position: absolute;
        inset: -35%;
        background: radial-gradient(circle, color-mix(in srgb, var(--accent-2), transparent 72%) 0%, transparent 58%);
        animation: nfc-pulse 1.6s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes nfc-pulse {
        0%, 100% { opacity: .32; transform: scale(.82); }
        50% { opacity: .9; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script id="app-source" type="text/plain">
      import React, { useEffect, useMemo, useRef, useState } from 'https://esm.sh/react@18.3.1?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client?dev';
      import {
        Award,
        BadgeCheck,
        CalendarDays,
        Check,
        ChevronRight,
        CreditCard,
        Gauge,
        KeyRound,
        Lock,
        LogOut,
        PencilLine,
        Plus,
        RefreshCw,
        Save,
        ScanLine,
        Settings,
        ShieldCheck,
        Smartphone,
        Sparkles,
        Users,
        WalletCards,
        X,
      } from 'https://esm.sh/lucide-react@0.468.0?deps=react@18.3.1';
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

      // Canonical Supabase table name for camper roster records.
      // Change this in ONE place if your schema uses a different table name.
      const CAMPER_TABLE = 'camper_profiles';

      const dailyFields = {
        learn_maamar: 'Maamar',
        learn_chumash: 'Chumash',
        learn_tanya: 'Tanya',
        learn_rambam: 'Rambam',
        learn_hayom_yom: 'Hayom Yom',
        hanhaga_negel_vasser: 'Negel Vasser',
        hanhaga_mikvah: 'Mikvah',
        hanhaga_brochos: 'Brochos & Krias Shema',
        hanhaga_tehillim: 'Tehillim',
        hanhaga_bentching: 'Bentching',
        hanhaga_bendel: 'Bendel',
      };

      const learningKeys = ['learn_maamar', 'learn_chumash', 'learn_tanya', 'learn_rambam', 'learn_hayom_yom'];
      const hanhagaKeys = [
        'hanhaga_negel_vasser',
        'hanhaga_mikvah',
        'hanhaga_brochos',
        'hanhaga_tehillim',
        'hanhaga_bentching',
        'hanhaga_bendel',
      ];
      const blankEntry = Object.fromEntries([...learningKeys, ...hanhagaKeys].map((key) => [key, false]));
      const today = () => new Date().toISOString().slice(0, 10);

      function getStoredConfig() {
        return {
          url: localStorage.getItem('mivtza_supabase_url') || '',
          anon: localStorage.getItem('mivtza_supabase_anon') || '',
          adminCode: localStorage.getItem('mivtza_admin_code') || '',
        };
      }

      function useSupabase() {
        const [config, setConfig] = useState(getStoredConfig);
        const client = useMemo(() => {
          if (!config.url || !config.anon) return null;
          return createClient(config.url, config.anon);
        }, [config.url, config.anon]);

        const saveConfig = (next) => {
          localStorage.setItem('mivtza_supabase_url', next.url.trim());
          localStorage.setItem('mivtza_supabase_anon', next.anon.trim());
          localStorage.setItem('mivtza_admin_code', next.adminCode.trim());
          setConfig(getStoredConfig());
        };

        return { client, config, saveConfig };
      }

      function classNames(...parts) {
        return parts.filter(Boolean).join(' ');
      }

      // Supabase can hand back a JSON/object value for a column we expect to be
      // a plain string or number (e.g. a jsonb column, or a row shape that
      // doesn't match what the UI assumes). Rendering an object directly as a
      // React child throws "Objects are not valid as a React child" (error
      // #31) and blanks the whole page. This guards every spot that renders a
      // raw Supabase field so a stray object degrades gracefully instead of
      // crashing.
      function displayValue(value) {
        if (value === null || value === undefined) return '';
        if (typeof value === 'object') {
          try {
            return JSON.stringify(value);
          } catch (stringifyError) {
            return String(value);
          }
        }
        return value;
      }

      function normalizeStatus(status) {
        if (!status) return 'Gold';
        const cleaned = String(status).trim().toLowerCase();
        if (cleaned === 'black') return 'Black';
        if (cleaned === 'platinum') return 'Platinum';
        return 'Gold';
      }

      function getWeight(config, field) {
        const candidates = [
          field,
          `${field}_points`,
          field.replace('learn_', 'points_'),
          field.replace('hanhaga_', 'points_'),
        ];
        for (const candidate of candidates) {
          const value = Number(config?.[candidate]);
          if (Number.isFinite(value) && value > 0) return value;
        }
        return learningKeys.includes(field) ? 10 : 0;
      }

      function calculateScore(entry, config) {
        const learningTotal = learningKeys.reduce((sum, key) => sum + (entry[key] ? getWeight(config, key) : 0), 0);
        const hanhagaCount = hanhagaKeys.filter((key) => entry[key]).length;
        return Math.round(learningTotal * (1 + hanhagaCount * 0.05));
      }

      function IconButton({ icon: Icon, label, className = '', ...props }) {
        return (
          <button
            title={label}
            aria-label={label}
            className={classNames('focus-ring inline-flex h-11 w-11 items-center justify-center rounded border line-border transition hover:scale-[1.02]', className)}
            {...props}
          >
            <Icon size={19} />
          </button>
        );
      }

      function TextInput({ icon: Icon, className = '', ...props }) {
        return (
          <label className={classNames('glass-panel flex items-center gap-3 rounded px-3 py-2', className)}>
            {Icon && <Icon size={18} className="muted-text shrink-0" />}
            <input
              className="focus-ring min-w-0 flex-1 bg-transparent py-2 text-sm font-semibold outline-none placeholder:font-medium"
              {...props}
            />
          </label>
        );
      }

      function Shell({ children, status = 'Gold', admin = false, onLogout }) {
        useEffect(() => {
          document.documentElement.dataset.theme = normalizeStatus(status);
        }, [status]);

        return (
          <main className="min-h-screen px-4 py-5 sm:px-6 lg:px-8">
            <div className="mx-auto flex max-w-7xl items-center justify-between pb-5">
              <div className="flex items-center gap-3">
                <div className="lux-card flex h-11 w-16 items-center justify-center rounded shadow-glow">
                  <CreditCard size={24} />
                </div>
                <div>
                  <p className="text-sm font-extrabold uppercase tracking-[0.16em]">American Express Mivtza</p>
                  <p className="muted-text text-xs font-semibold">Learn. Do. Earn. Grow.</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                {admin && <a className="glass-panel rounded px-4 py-2 text-sm font-bold" href="./index.html">Check-In</a>}
                {!admin && <a className="glass-panel rounded px-4 py-2 text-sm font-bold" href="./index.html?admin=1">Admin</a>}
                {onLogout && <IconButton icon={LogOut} label="Log out" onClick={onLogout} />}
              </div>
            </div>
            {children}
          </main>
        );
      }

      function SetupPanel({ config, saveConfig, embedded = false }) {
        const [draft, setDraft] = useState(config);
        const body = (
          <>
            {!embedded && (
              <div className="mb-4 flex items-center gap-3">
                <Settings className="accent-text" />
                <div>
                  <h2 className="text-lg font-extrabold">Backend Connection</h2>
                  <p className="muted-text text-sm">Add the Supabase project URL and anon key for this device.</p>
                </div>
              </div>
            )}
            <div className="grid gap-3">
              <TextInput icon={Gauge} placeholder="Supabase URL" value={draft.url} onChange={(event) => setDraft({ ...draft, url: event.target.value })} />
              <TextInput icon={KeyRound} placeholder="Supabase anon key" value={draft.anon} onChange={(event) => setDraft({ ...draft, anon: event.target.value })} />
              <TextInput icon={Lock} placeholder="Optional admin passcode" value={draft.adminCode} onChange={(event) => setDraft({ ...draft, adminCode: event.target.value })} />
              <button className="app-button focus-ring mt-2 inline-flex items-center justify-center gap-2 rounded px-5 py-3 font-extrabold" onClick={() => saveConfig(draft)}>
                <Save size={18} /> Save Connection
              </button>
            </div>
          </>
        );
        if (embedded) return body;
        return (
          <div className="mx-auto grid max-w-3xl gap-4">
            <div className="glass-panel rounded-lg p-5 shadow-luxury">
              {body}
            </div>
          </div>
        );
      }

      function LoginScreen({ client, config, saveConfig, onCamper }) {
        const [scan, setScan] = useState('');
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState('');
        const [nfcListening, setNfcListening] = useState(false);
        const [nfcMessage, setNfcMessage] = useState('');
        const inputRef = useRef(null);
        const ndefRef = useRef(null);

        useEffect(() => {
          inputRef.current?.focus();
          const id = window.setInterval(() => inputRef.current?.focus(), 1200);
          return () => window.clearInterval(id);
        }, []);

        const fetchCamper = async (nfcId) => {
          if (!client) return;
          setBusy(true);
          setError('');
          setNfcMessage('');
          const { data, error: fetchError } = await client
            .from(CAMPER_TABLE)
            .select('*')
            .eq('nfc_id', nfcId.trim())
            .maybeSingle();
          setBusy(false);
          setScan('');
          if (fetchError) {
            setError(fetchError.message);
            return;
          }
          if (!data) {
            setError('No camper found for that card.');
            return;
          }
          onCamper(data);
        };

        const explainNfcError = (scanError) => {
          if (!('NDEFReader' in window)) {
            return 'This device or browser does not expose Web NFC. Use Android Chrome on a device with NFC, or scan with the USB reader.';
          }
          if (!window.isSecureContext) {
            return 'Web NFC requires a secure page. Host this file over HTTPS, such as GitHub Pages, or use the keyboard scanner locally.';
          }
          if (scanError?.name === 'NotAllowedError') {
            return 'NFC permission was denied. Allow NFC access in Chrome and try again.';
          }
          if (scanError?.name === 'NotReadableError') {
            return 'NFC is unavailable right now. Make sure NFC is turned on in Android system settings, then try again.';
          }
          if (scanError?.name === 'NotSupportedError') {
            return 'This Android device does not appear to support Web NFC scanning.';
          }
          return scanError?.message || 'NFC scanning could not start. Check that NFC is enabled and try again.';
        };

        const startPhysicalCardScan = async () => {
          setError('');
          setNfcMessage('');
          if (!client) {
            setError('Supabase connection is not configured on this device.');
            return;
          }
          if (!('NDEFReader' in window) || !window.isSecureContext) {
            const message = explainNfcError();
            setNfcMessage(message);
            window.alert(message);
            return;
          }

          try {
            const ndef = new NDEFReader();
            ndefRef.current = ndef;
            ndef.onreading = (event) => {
              const serialNumber = event.serialNumber;
              if (!serialNumber) {
                const message = 'The NFC tag was read, but Chrome did not provide a hardware serial number.';
                setNfcMessage(message);
                window.alert(message);
                return;
              }
              setNfcListening(false);
              setNfcMessage(`Card detected: ${serialNumber}`);
              fetchCamper(serialNumber);
            };
            ndef.onreadingerror = () => {
              const message = 'NFC tag read failed. Hold the physical card flat against the back of the device and try again.';
              setNfcMessage(message);
              window.alert(message);
            };
            await ndef.scan();
            setNfcListening(true);
            setNfcMessage('Listening for a physical card. Tap the card to the back of this Android device.');
          } catch (scanError) {
            setNfcListening(false);
            const message = explainNfcError(scanError);
            setNfcMessage(message);
            window.alert(message);
          }
        };

        const onKeyDown = (event) => {
          if (event.key === 'Enter' && scan.trim()) fetchCamper(scan);
        };

        return (
          <Shell status="Gold">
            <div className="mx-auto grid min-h-[calc(100vh-7rem)] max-w-5xl place-items-center">
              <section className="grid w-full gap-6 text-center">
                <div>
                  <p className="accent-text text-sm font-extrabold uppercase tracking-[0.28em]">American Express Mivtza</p>
                  <h1 className="mt-2 text-4xl font-extrabold sm:text-6xl">Learn. Do. Earn. Grow.</h1>
                </div>
                <div className="glass-panel mx-auto grid h-56 w-full max-w-xl place-items-center rounded-lg border-dashed shadow-luxury">
                  <div className="lux-card flex h-32 w-52 flex-col items-center justify-center gap-3 rounded-lg">
                    <Sparkles size={34} />
                    <span className="text-xs font-extrabold uppercase tracking-[0.2em]">Graphic Logo</span>
                  </div>
                </div>
                <div className="mx-auto w-full max-w-xl">
                  <label className="glass-panel flex items-center gap-3 rounded-lg px-5 py-4 shadow-glow">
                    <ScanLine className="accent-text" />
                    <input
                      ref={inputRef}
                      value={scan}
                      onChange={(event) => setScan(event.target.value)}
                      onKeyDown={onKeyDown}
                      placeholder="Scan NFC card"
                      className="focus-ring flex-1 bg-transparent text-center text-lg font-bold outline-none placeholder:muted-text"
                    />
                    {busy ? <RefreshCw className="animate-spin" /> : <ChevronRight />}
                  </label>
                  <button
                    type="button"
                    onClick={startPhysicalCardScan}
                    disabled={busy || nfcListening}
                    className={classNames(
                      'lux-card focus-ring mt-4 flex w-full items-center justify-center gap-3 rounded-lg px-5 py-5 text-lg font-extrabold shadow-luxury transition hover:scale-[1.01] disabled:cursor-wait disabled:opacity-90',
                      nfcListening && 'nfc-listening'
                    )}
                  >
                    {nfcListening ? <RefreshCw className="relative z-10 animate-spin" size={24} /> : <Smartphone className="relative z-10" size={24} />}
                    <span className="relative z-10">{nfcListening ? 'Listening for Card' : 'Tap Physical Card'}</span>
                  </button>
                  {nfcMessage && (
                    <p className="accent-bg mt-3 rounded border line-border px-4 py-3 text-sm font-semibold">
                      {nfcMessage}
                    </p>
                  )}
                  {error && <p className="mt-3 rounded border border-red-400/40 bg-red-500/10 px-4 py-3 text-sm font-semibold text-red-600">{error}</p>}
                  {!client && <SetupPanel config={config} saveConfig={saveConfig} />}
                </div>
              </section>
            </div>
          </Shell>
        );
      }

      function Stat({ label, value, icon: Icon }) {
        return (
          <div className="glass-panel rounded-lg p-4">
            <div className="mb-2 flex items-center gap-2 muted-text">
              <Icon size={16} />
              <span className="text-xs font-bold uppercase tracking-[0.12em]">{label}</span>
            </div>
            <p className="text-2xl font-extrabold">{displayValue(value) || displayValue(0)}</p>
          </div>
        );
      }

      function CheckboxTile({ checked, label, onChange }) {
        return (
          <button
            type="button"
            onClick={() => onChange(!checked)}
            className={classNames(
              'focus-ring flex min-h-16 items-center gap-3 rounded-lg border p-4 text-left font-bold transition',
              checked ? 'accent-bg line-border shadow-glow' : 'glass-panel hover:scale-[1.01]'
            )}
          >
            <span className={classNames('flex h-7 w-7 shrink-0 items-center justify-center rounded border line-border', checked && 'app-button')}>
              {checked && <Check size={17} />}
            </span>
            {label}
          </button>
        );
      }

      function CamperDashboard({ client, camper, onLogout }) {
        const [entry, setEntry] = useState(blankEntry);
        const [config, setConfig] = useState(null);
        const [approved, setApproved] = useState(false);
        const [error, setError] = useState('');
        const status = normalizeStatus(camper.card_status);

        useEffect(() => {
          client?.from('mivtza_config').select('*').limit(1).maybeSingle().then(({ data }) => setConfig(data || {}));
        }, [client]);

        const score = calculateScore(entry, config);

        const submit = async () => {
          setError('');
          const { error: insertError } = await client.from('daily_entries').insert({
            camper_id: camper.id,
            entry_date: today(),
            ...entry,
          });
          if (insertError) {
            setError(insertError.message);
            return;
          }
          setApproved(true);
          window.setTimeout(() => {
            setApproved(false);
            onLogout();
          }, 2000);
        };

        return (
          <Shell status={status} onLogout={onLogout}>
            <div className="mx-auto grid max-w-7xl gap-5">
              <section className="lux-card rounded-lg p-5 shadow-luxury">
                <div className="grid gap-4 lg:grid-cols-[1.4fr_.8fr_.8fr_.8fr]">
                  <div>
                    <p className="text-xs font-extrabold uppercase tracking-[0.18em] opacity-70">Cardmember</p>
                    <h1 className="mt-2 text-4xl font-extrabold">{camper.name}</h1>
                  </div>
                  <Stat label="Tier" value={status} icon={WalletCards} />
                  <Stat label="Lifetime" value={camper.total_points} icon={Award} />
                  <Stat label="This Week" value={camper.weekly_points} icon={CalendarDays} />
                </div>
              </section>

              <div className="grid gap-5 lg:grid-cols-[1fr_20rem]">
                <section className="grid gap-5">
                  <div className="glass-panel rounded-lg p-5">
                    <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><Sparkles className="accent-text" /> Learning Points</h2>
                    <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
                      {learningKeys.map((key) => (
                        <CheckboxTile key={key} label={dailyFields[key]} checked={entry[key]} onChange={(value) => setEntry({ ...entry, [key]: value })} />
                      ))}
                    </div>
                  </div>
                  <div className="glass-panel rounded-lg p-5">
                    <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><ShieldCheck className="accent-text" /> Daily Hanhagos</h2>
                    <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
                      {hanhagaKeys.map((key) => (
                        <CheckboxTile key={key} label={dailyFields[key]} checked={entry[key]} onChange={(value) => setEntry({ ...entry, [key]: value })} />
                      ))}
                    </div>
                  </div>
                </section>

                <aside className="glass-panel sticky top-5 h-fit rounded-lg p-5 shadow-luxury">
                  <p className="muted-text text-xs font-extrabold uppercase tracking-[0.16em]">Estimated Daily Score</p>
                  <p className="mt-3 text-6xl font-extrabold">{score}</p>
                  <p className="muted-text mt-3 text-sm font-semibold">Learning total multiplied by 1.00 plus 0.05 for each selected Hanhaga.</p>
                  {error && <p className="mt-4 rounded border border-red-400/40 bg-red-500/10 p-3 text-sm font-semibold text-red-600">{error}</p>}
                  <button className="app-button focus-ring mt-5 flex w-full items-center justify-center gap-2 rounded px-5 py-4 text-lg font-extrabold" onClick={submit}>
                    <BadgeCheck size={22} /> Submit
                  </button>
                </aside>
              </div>
            </div>

            {approved && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/45 p-6">
                <div className="lux-card max-w-md rounded-lg p-8 text-center shadow-luxury">
                  <BadgeCheck className="mx-auto mb-4" size={52} />
                  <h2 className="text-3xl font-extrabold">Transaction Approved</h2>
                  <p className="mt-2 text-lg font-bold">Points Credited</p>
                </div>
              </div>
            )}
          </Shell>
        );
      }

      function AdminGate({ config, children }) {
        const [code, setCode] = useState('');
        const [unlocked, setUnlocked] = useState(!config.adminCode || sessionStorage.getItem('mivtza_admin_unlocked') === '1');
        if (unlocked) return children;
        return (
          <Shell admin status="Platinum">
            <div className="mx-auto grid min-h-[60vh] max-w-md place-items-center">
              <div className="glass-panel w-full rounded-lg p-5 shadow-luxury">
                <Lock className="accent-text mb-3" />
                <h1 className="text-2xl font-extrabold">Admin Access</h1>
                <TextInput className="mt-5" icon={KeyRound} type="password" placeholder="Passcode" value={code} onChange={(event) => setCode(event.target.value)} />
                <button
                  className="app-button focus-ring mt-4 w-full rounded px-5 py-3 font-extrabold"
                  onClick={() => {
                    if (code === config.adminCode) {
                      sessionStorage.setItem('mivtza_admin_unlocked', '1');
                      setUnlocked(true);
                    }
                  }}
                >
                  Unlock
                </button>
              </div>
            </div>
          </Shell>
        );
      }

      function AdminDashboard({ client, config, saveConfig }) {
        const [campers, setCampers] = useState([]);
        const [rules, setRules] = useState({});
        const [loading, setLoading] = useState(true);
        const [message, setMessage] = useState('');
        const [newCamper, setNewCamper] = useState({ name: '', nfc_id: '' });
        const [correction, setCorrection] = useState({ camper_id: '', entry_date: today(), ...blankEntry, manual_points_adjustment: 0 });

        const load = async () => {
          setLoading(true);
          const [{ data: roster }, { data: configRow }] = await Promise.all([
            client.from(CAMPER_TABLE).select('*').order('name'),
            client.from('mivtza_config').select('*').limit(1).maybeSingle(),
          ]);
          setCampers(roster || []);
          setRules(configRow || {});
          setLoading(false);
        };

        useEffect(() => {
          if (client) load();
        }, [client]);

        const vip = campers.filter((camper) => Number(camper.weekly_points) >= Number(rules.vip_event_threshold ?? 700));
        const standard = campers.filter((camper) => Number(camper.weekly_points) >= Number(rules.standard_event_threshold ?? 400) && Number(camper.weekly_points) < Number(rules.vip_event_threshold ?? 700));
        const notEligible = campers.filter((camper) => Number(camper.weekly_points) < Number(rules.standard_event_threshold ?? 400));

        const registerCamper = async () => {
          const { error } = await client.from(CAMPER_TABLE).insert({ name: newCamper.name.trim(), nfc_id: newCamper.nfc_id.trim() });
          setMessage(error ? error.message : 'Camper registered.');
          if (!error) setNewCamper({ name: '', nfc_id: '' });
          load();
        };

        const saveCorrection = async () => {
          const selected = campers.find((camper) => String(camper.id) === String(correction.camper_id));
          if (!selected) return;
          const entryPayload = { camper_id: selected.id, entry_date: correction.entry_date };
          [...learningKeys, ...hanhagaKeys].forEach((key) => (entryPayload[key] = correction[key]));
          const { error: entryError } = await client.from('daily_entries').upsert(entryPayload, { onConflict: 'camper_id,entry_date' });
          const { error: camperError } = await client
            .from(CAMPER_TABLE)
            .update({ manual_points_adjustment: Number(correction.manual_points_adjustment || 0) })
            .eq('id', selected.id);
          setMessage(entryError?.message || camperError?.message || 'Correction saved.');
          load();
        };

        const saveRules = async () => {
          const payload = { ...rules };
          const id = payload.id;
          const query = id ? client.from('mivtza_config').update(payload).eq('id', id) : client.from('mivtza_config').upsert(payload);
          const { error } = await query;
          setMessage(error ? error.message : 'System rules saved.');
          load();
        };

        if (!client) {
          return (
            <Shell admin status="Platinum">
              <SetupPanel config={config} saveConfig={saveConfig} />
            </Shell>
          );
        }

        return (
          <Shell admin status="Platinum">
            <div className="mx-auto grid max-w-7xl gap-5">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h1 className="text-3xl font-extrabold">Private Admin Dashboard</h1>
                  <p className="muted-text font-semibold">Roster, event eligibility, corrections, and global rules.</p>
                </div>
                <IconButton icon={RefreshCw} label="Refresh data" onClick={load} className={loading ? 'animate-spin' : ''} />
              </div>

              {message && (
                <div className="glass-panel flex items-center justify-between rounded-lg p-4 font-semibold">
                  <span>{message}</span>
                  <button onClick={() => setMessage('')}><X size={18} /></button>
                </div>
              )}

              <section className="glass-panel overflow-hidden rounded-lg shadow-luxury">
                <div className="flex items-center gap-2 border-b line-border p-4">
                  <Users className="accent-text" />
                  <h2 className="text-xl font-extrabold">Camper Roster</h2>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full min-w-[850px] text-left text-sm">
                    <thead className="accent-bg">
                      <tr>
                        {['Name', 'NFC ID', 'Card Status', 'Weekly Points', 'Lifetime Points', 'Weekly Event Status'].map((head) => (
                          <th key={head} className="px-4 py-3 font-extrabold">{head}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {campers.map((camper) => (
                        <tr key={camper.id} className="border-t line-border">
                          <td className="px-4 py-3 font-bold">{camper.name}</td>
                          <td className="px-4 py-3">{camper.nfc_id}</td>
                          <td className="px-4 py-3">{displayValue(camper.card_status)}</td>
                          <td className="px-4 py-3">{displayValue(camper.weekly_points)}</td>
                          <td className="px-4 py-3">{displayValue(camper.total_points)}</td>
                          <td className="px-4 py-3">{displayValue(camper.weekly_event_status)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>

              <section className="grid gap-4 lg:grid-cols-3">
                <AccessList title="VIP Event Access" icon={Sparkles} campers={vip} />
                <AccessList title="Standard Event Access" icon={BadgeCheck} campers={standard} />
                <AccessList title="Not Eligible" icon={X} campers={notEligible} />
              </section>

              <section className="grid gap-5 lg:grid-cols-2">
                <div className="glass-panel rounded-lg p-5">
                  <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><Plus className="accent-text" /> Register Camper</h2>
                  <div className="grid gap-3">
                    <TextInput icon={Users} placeholder="Camper name" value={newCamper.name} onChange={(event) => setNewCamper({ ...newCamper, name: event.target.value })} />
                    <TextInput icon={ScanLine} placeholder="Scan NFC card ID" value={newCamper.nfc_id} onChange={(event) => setNewCamper({ ...newCamper, nfc_id: event.target.value })} />
                    <button className="app-button focus-ring rounded px-5 py-3 font-extrabold" onClick={registerCamper}>Register</button>
                  </div>
                </div>

                <div className="glass-panel rounded-lg p-5">
                  <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><Settings className="accent-text" /> Backend Settings</h2>
                  <SetupPanel config={config} saveConfig={saveConfig} embedded />
                </div>
              </section>

              <section className="glass-panel rounded-lg p-5">
                <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><PencilLine className="accent-text" /> Data Correction Panel</h2>
                <div className="grid gap-4 lg:grid-cols-[1fr_12rem_10rem]">
                  <select className="focus-ring rounded border line-border bg-transparent px-3 py-3 font-bold" value={correction.camper_id} onChange={(event) => setCorrection({ ...correction, camper_id: event.target.value })}>
                    <option value="">Select camper</option>
                    {campers.map((camper) => <option key={camper.id} value={camper.id}>{camper.name}</option>)}
                  </select>
                  <input className="focus-ring rounded border line-border bg-transparent px-3 py-3 font-bold" type="date" value={correction.entry_date} onChange={(event) => setCorrection({ ...correction, entry_date: event.target.value })} />
                  <input className="focus-ring rounded border line-border bg-transparent px-3 py-3 font-bold" type="number" placeholder="Manual pts" value={correction.manual_points_adjustment} onChange={(event) => setCorrection({ ...correction, manual_points_adjustment: event.target.value })} />
                </div>
                <div className="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                  {[...learningKeys, ...hanhagaKeys].map((key) => (
                    <CheckboxTile key={key} label={dailyFields[key]} checked={correction[key]} onChange={(value) => setCorrection({ ...correction, [key]: value })} />
                  ))}
                </div>
                <button className="app-button focus-ring mt-4 inline-flex items-center gap-2 rounded px-5 py-3 font-extrabold" onClick={saveCorrection}><Save size={18} /> Save Correction</button>
              </section>

              <section className="glass-panel rounded-lg p-5">
                <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><Gauge className="accent-text" /> System Config Rules</h2>
                <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                  {Object.entries(rules).map(([key, value]) => (
                    <label key={key} className="grid gap-1">
                      <span className="muted-text text-xs font-extrabold uppercase tracking-[0.1em]">{key}</span>
                      <input
                        className="focus-ring rounded border line-border bg-transparent px-3 py-3 font-bold"
                        value={value ?? ''}
                        onChange={(event) => setRules({ ...rules, [key]: event.target.value })}
                      />
                    </label>
                  ))}
                </div>
                <div className="mt-4 flex gap-3">
                  <button className="app-button focus-ring inline-flex items-center gap-2 rounded px-5 py-3 font-extrabold" onClick={saveRules}><Save size={18} /> Save Rules</button>
                </div>
              </section>
            </div>
          </Shell>
        );
      }

      function AccessList({ title, icon: Icon, campers }) {
        return (
          <div className="glass-panel rounded-lg p-5">
            <h2 className="mb-4 flex items-center gap-2 text-lg font-extrabold"><Icon className="accent-text" /> {title}</h2>
            <div className="grid gap-2">
              {campers.length === 0 && <p className="muted-text text-sm font-semibold">No campers in this group.</p>}
              {campers.map((camper) => (
                <div key={camper.id} className="flex items-center justify-between rounded border line-border px-3 py-2">
                  <span className="font-bold">{camper.name}</span>
                  <span className="muted-text text-sm font-semibold">{displayValue(camper.weekly_points)} pts</span>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function App() {
        const { client, config, saveConfig } = useSupabase();
        const [camper, setCamper] = useState(null);
        const isAdmin = window.location.pathname.endsWith('/admin') || window.location.search.includes('admin');

        if (isAdmin) {
          return (
            <AdminGate config={config}>
              <AdminDashboard client={client} config={config} saveConfig={saveConfig} />
            </AdminGate>
          );
        }

        if (camper) return <CamperDashboard client={client} camper={camper} onLogout={() => setCamper(null)} />;
        return <LoginScreen client={client} config={config} saveConfig={saveConfig} onCamper={setCamper} />;
      }

      createRoot(document.getElementById('root')).render(<App />);
    </script>

    <script>
      // The auto "text/babel" script-tag scanner only lets us pass bare preset
      // names (no options), and the React preset's default "automatic" JSX
      // runtime tries to import the bare specifier "react/jsx-runtime", which
      // the browser can't resolve without an import map. So we transform
      // manually here, forcing the classic runtime (React.createElement),
      // and inject the result as a real <script type="module">.
      (function bootstrap() {
        const source = document.getElementById('app-source').textContent;
        const { code } = Babel.transform(source, {
          presets: [['react', { runtime: 'classic' }]],
          sourceType: 'unambiguous',
          filename: 'app.jsx',
        });
        const blob = new Blob([code], { type: 'text/javascript' });
        const script = document.createElement('script');
        script.type = 'module';
        script.src = URL.createObjectURL(blob);
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
