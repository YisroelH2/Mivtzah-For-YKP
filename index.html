    <style>
      :root {
        --bg: #f8f3e7;
        --bg-2: #ffffff;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-solid: #ffffff;
        --text: #282520;
        --muted: #756e63;
        --line: rgba(121, 96, 46, 0.2);
        --accent: #c89c3b;
        --accent-2: #f1d38b;
        --accent-soft: rgba(200, 156, 59, 0.16);
        --card-gradient: linear-gradient(135deg, #fff7df 0%, #e6bf5f 46%, #fff3c6 100%);
        --luxury-border: linear-gradient(135deg, rgba(246,215,136,.9), rgba(164,117,24,.68), rgba(255,244,204,.92));
      }

      [data-theme='Platinum'] {
        --bg: #eef2f6;
        --bg-2: #ffffff;
        --panel: rgba(255, 255, 255, 0.72);
        --panel-solid: #fbfdff;
        --text: #17202a;
        --muted: #607080;
        --line: rgba(90, 111, 132, 0.22);
        --accent: #6f8498;
        --accent-2: #94d9ff;
        --accent-soft: rgba(101, 190, 255, 0.16);
        --card-gradient: linear-gradient(135deg, #f8fbff 0%, #bdc7d1 28%, #ffffff 48%, #8797a7 100%);
        --luxury-border: linear-gradient(135deg, rgba(255,255,255,.95), rgba(101,190,255,.66), rgba(113,126,140,.72));
      }

      [data-theme='Black'] {
        --bg: #050506;
        --bg-2: #111214;
        --panel: rgba(15, 16, 18, 0.82);
        --panel-solid: #0d0e10;
        --text: #f6f3ea;
        --muted: #aaa69c;
        --line: rgba(255, 255, 255, 0.14);
        --accent: #d7d1c4;
        --accent-2: #ffffff;
        --accent-soft: rgba(255, 255, 255, 0.1);
        --card-gradient: linear-gradient(135deg, #050506 0%, #191b1f 42%, #050506 100%);
        --luxury-border: linear-gradient(120deg, #ffffff, #45484f, #f7f2df, #18191d, #ffffff);
      }

      html, body {
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }

      body {
        background:
          radial-gradient(circle at top left, var(--accent-soft), transparent 30rem),
          linear-gradient(140deg, var(--bg), var(--bg-2));
        color: var(--text);
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui;
      }

      #root {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }

      /* Prevent any child element from forcing horizontal scroll on mobile —
         flex/grid children can otherwise ignore their parent's width and push
         the whole page wider than the viewport (e.g. a row that doesn't wrap
         cleanly, or an element with an intrinsic min-width larger than the
         screen). box-sizing ensures padding/border are included in width
         calculations everywhere, and min-width: 0 lets flex children shrink
         below their content size instead of overflowing. */
      * {
        box-sizing: border-box;
      }
      .flex, .grid {
        min-width: 0;
      }

      .glass-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        backdrop-filter: blur(18px);
      }

      .lux-card {
        position: relative;
        background: var(--card-gradient);
        border: 1px solid transparent;
        color: var(--text);
      }

      .lux-card::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: var(--luxury-border);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      [data-theme='Black'] .lux-card::before {
        background-size: 280% 280%;
        animation: card-border 5s linear infinite;
      }

      @keyframes card-border {
        0% { background-position: 0% 50%; }
        100% { background-position: 280% 50%; }
      }

      .focus-ring:focus {
        outline: 3px solid color-mix(in srgb, var(--accent-2), transparent 50%);
        outline-offset: 3px;
      }

      .app-button {
        background: var(--text);
        color: var(--bg-2);
      }

      [data-theme='Black'] .app-button {
        background: #f6f3ea;
        color: #050506;
      }

      .accent-text { color: var(--accent); }
      .muted-text { color: var(--muted); }
      .accent-bg { background: var(--accent-soft); }
      .line-border { border-color: var(--line); }

      .nfc-listening {
        position: relative;
        overflow: hidden;
      }

      .nfc-listening::after {
        content: '';
        position: absolute;
        inset: -35%;
        background: radial-gradient(circle, color-mix(in srgb, var(--accent-2), transparent 72%) 0%, transparent 58%);
        animation: nfc-pulse 1.6s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes nfc-pulse {
        0%, 100% { opacity: .32; transform: scale(.82); }
        50% { opacity: .9; transform: scale(1); }
      }

      /* ── Premium text shimmer ─────────────────────────────────────────────
         Sweeps a metallic highlight across key figures (name, tier, points).
         Uses background-clip:text so the shine rides on top of the letters.
         The card-border animation above is completely untouched.          ── */
      :root          { --sh1: #c89c3b; --sh2: #fff8e0; --sh3: #f1d38b; }
      [data-theme='Platinum'] { --sh1: #8fb8cc; --sh2: #ffffff; --sh3: #c8e8ff; }
      [data-theme='Black']    { --sh1: #b8b4ac; --sh2: #ffffff; --sh3: #e8e4dc; }

      @keyframes shimmer-text {
        0%   { background-position: 160% center; }
        100% { background-position: -160% center; }
      }

      .shimmer-text {
        background: linear-gradient(
          90deg,
          var(--text)  0%,
          var(--text)  28%,
          var(--sh1)   40%,
          var(--sh2)   50%,
          var(--sh1)   60%,
          var(--text)  72%,
          var(--text)  100%
        );
        background-size: 280% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer-text 5s ease-in-out infinite;
      }

      /* ── Loading card glare sweep ─────────────────────────────────────── */
      @keyframes card-sweep {
        0%   { transform: translateX(-220%) skewX(-18deg); }
        100% { transform: translateX(220%)  skewX(-18deg); }
      }
      @keyframes float-card {
        0%, 100% { transform: translateY(0px) scale(1); }
        50%       { transform: translateY(-8px) scale(1.012); }
      }
      @keyframes dot-pulse {
        0%, 80%, 100% { opacity: .25; transform: scale(.8); }
        40%            { opacity: 1;   transform: scale(1); }
      }
      .loading-card {
        animation: float-card 2.4s ease-in-out infinite;
        overflow: hidden;
      }
      .loading-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255,255,255,.22) 48%,
          rgba(255,255,255,.32) 50%,
          rgba(255,255,255,.22) 52%,
          transparent 70%
        );
        animation: card-sweep 1.9s cubic-bezier(.4,0,.2,1) infinite;
        pointer-events: none;
      }
      .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: dot-pulse 1.4s ease-in-out infinite; }
      .dot:nth-child(2) { animation-delay: .2s; }
      .dot:nth-child(3) { animation-delay: .4s; }
      /* ── Elite toast notification ──────────────────────────────────────── */
      @keyframes toast-in  { from { opacity:0; transform:translateY(20px) scale(.96); } to { opacity:1; transform:translateY(0) scale(1); } }
      @keyframes toast-out { from { opacity:1; transform:translateY(0) scale(1); }      to { opacity:0; transform:translateY(12px) scale(.96); } }
      .toast-enter { animation: toast-in  .28s cubic-bezier(.16,1,.3,1) forwards; }
      .toast-leave { animation: toast-out .22s ease-in forwards; }
    </style>

  <body>
    <div id="root"></div>

    <script id="app-source" type="text/plain">
      import React, { useEffect, useMemo, useRef, useState } from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
      import {
        Award,
        BadgeCheck,
        CalendarDays,
        Check,
        ChevronLeft,
        ChevronRight,
        CreditCard,
        Gauge,
        KeyRound,
        Lock,
        LogOut,
        PencilLine,
        Plus,
        RefreshCw,
        Save,
        ScanLine,
        Settings,
        ShieldCheck,
        Smartphone,
        Sparkles,
        Trash2,
        UserCheck,
        Users,
        WalletCards,
        X,
      } from 'https://esm.sh/lucide-react@0.468.0?deps=react@18.3.1';
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

      // camper_profiles is a Supabase VIEW that includes computed columns like
      // weekly_points, total_points, weekly_event_status. Read from it.
      // campers is the underlying base TABLE. All writes (insert/update/delete)
      // go there — you cannot insert into a view.
      const CAMPER_READ_TABLE  = 'camper_profiles';
      const CAMPER_WRITE_TABLE = 'campers';

      const today = () => new Date().toISOString().slice(0, 10);

      // Shifts a 'YYYY-MM-DD' string by `delta` days. Built entirely on UTC
      // arithmetic (Date.UTC + setUTCDate) rather than local-time Date
      // construction — parsing "YYYY-MM-DDT00:00:00" in a timezone ahead of
      // UTC (e.g. Israel) would silently roll the date back a day once
      // converted through toISOString(). Using UTC throughout sidesteps that
      // entirely, regardless of what timezone the device is set to.
      function shiftDate(dateStr, delta) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(Date.UTC(y, m - 1, d));
        dt.setUTCDate(dt.getUTCDate() + delta);
        return dt.toISOString().slice(0, 10);
      }

      // Formats 'YYYY-MM-DD' as "Sunday, Jul 5, 2026" — same UTC-anchored
      // approach so the displayed weekday always matches the stored date
      // regardless of the viewer's local timezone.
      function formatDateHuman(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(Date.UTC(y, m - 1, d));
        return dt.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
      }

      // ── App config defaults (match the Mivtza Amek infographic) ──────────────
      // Config is stored in mivtza_config.config_json in Supabase so any device
      // can read it. The admin panel provides a full structured editor.
      //
      // REQUIRED SQL (run once in Supabase SQL editor):
      //   ALTER TABLE mivtza_config ADD COLUMN IF NOT EXISTS config_json text;
      //   ALTER TABLE daily_entries  ADD COLUMN IF NOT EXISTS entry_data   jsonb;
      //   ALTER TABLE daily_entries  ADD COLUMN IF NOT EXISTS teacher_data jsonb;
      //
      const DEFAULT_CONFIG = {
        learning_items: [
          { db_key: 'learn_maamar',    label: 'Maamar Baal Peh', points: 35 },
          { db_key: 'learn_chumash',   label: 'Chumash',         points: 20 },
          { db_key: 'learn_tanya',     label: 'Tanya',           points: 20 },
          { db_key: 'learn_rambam',    label: 'Rambam',          points: 20 },
          { db_key: 'learn_hayom_yom', label: 'Hayom Yom',       points:  5 },
        ],
        hanhaga_items: [
          { db_key: 'hanhaga_negel_vasser', label: 'Negel Vasser' },
          { db_key: 'hanhaga_mikvah',       label: 'Mikvah' },
          { db_key: 'hanhaga_brochos',      label: 'Brochos & Krias Shema with Hat & Jacket' },
          { db_key: 'hanhaga_tehillim',     label: 'Tehillim in Tefillin' },
          { db_key: 'hanhaga_bentching',    label: "Krias Shema She\'al Hamitah with Hat & Jacket" },
          { db_key: 'hanhaga_bendel',       label: 'Bendel' },
        ],
        hanhaga_bonus_per_item: 5,
        teacher_items: [],
        tier_platinum:             1800,
        tier_black:                3600,
        standard_event_threshold:   400,
        vip_event_threshold:        700,
        week_start_day:              0,   // 0=Sunday 1=Monday … 6=Saturday
      };

      // Known existing columns in daily_entries — anything outside this set
      // is stored in entry_data JSONB so the schema stays stable.
      const KNOWN_ENTRY_COLUMNS = new Set([
        'learn_maamar','learn_chumash','learn_tanya','learn_rambam','learn_hayom_yom',
        'hanhaga_negel_vasser','hanhaga_mikvah','hanhaga_brochos',
        'hanhaga_tehillim','hanhaga_bentching','hanhaga_bendel',
      ]);

      function getBlankEntry(cfg) {
        const entry = {};
        const items = [
          ...(cfg.learning_items || []),
          ...(cfg.hanhaga_items || []),
          ...(cfg.teacher_items || []),
        ];
        items.forEach((item) => { entry[item.db_key] = false; });
        return entry;
      }

      function calculateScore(entry, cfg) {
        const c = cfg || DEFAULT_CONFIG;
        const learningTotal = (c.learning_items || []).reduce(
          (sum, item) => sum + (entry[item.db_key] ? Number(item.points || 0) : 0), 0);
        const hanhagaCount = (c.hanhaga_items || []).filter((item) => entry[item.db_key]).length;
        const teacherTotal = (c.teacher_items || []).reduce(
          (sum, item) => sum + (entry[item.db_key] ? Number(item.points || 0) : 0), 0);
        const bonus = hanhagaCount * Number(c.hanhaga_bonus_per_item ?? 5);
        return learningTotal + bonus + teacherTotal;
      }

      // ── Live two-way sync helpers ────────────────────────────────────────
      // Shared by CamperDashboard and TeacherPortal so "what's already been
      // marked today" and "save my changes" behave identically everywhere.

      // Fetches today's (or any date's) daily_entries row for one camper and
      // merges it into a blank entry object, so checkboxes pre-check to match
      // whatever is already saved — including items stored in the entry_data/
      // teacher_data JSONB columns for custom config items. Also reports
      // whether a row actually existed, so callers can show an "already
      // submitted" style notice.
      async function fetchDailyEntry(camperId, date, cfg) {
        const blank = getBlankEntry(cfg);
        const { data: row } = await supabase
          .from('daily_entries')
          .select('*')
          .eq('camper_id', camperId)
          .eq('entry_date', date)
          .maybeSingle();
        if (!row) return { entry: blank, existed: false };
        const filled = { ...blank };
        Object.keys(filled).forEach((k) => { if (row[k] !== undefined) filled[k] = row[k]; });
        if (row.entry_data)   Object.entries(row.entry_data).forEach(([k, v]) => { filled[k] = v; });
        if (row.teacher_data) Object.entries(row.teacher_data).forEach(([k, v]) => { filled[k] = v; });
        return { entry: filled, existed: true };
      }

      // Whole-day difference between today and a 'YYYY-MM-DD' string, using
      // the same UTC-anchored arithmetic as shiftDate/formatDateHuman so the
      // result never drifts based on the viewer's local timezone.
      // Positive = date is in the past, 0 = today, negative = date is in the future.
      function daysBeforeToday(dateStr) {
        const [ty, tm, td] = today().split('-').map(Number);
        const [y, m, d] = dateStr.split('-').map(Number);
        const t = Date.UTC(ty, tm - 1, td);
        const s = Date.UTC(y, m - 1, d);
        return Math.round((t - s) / 86400000);
      }

      // True if the actual current day (not the date being viewed) is a
      // Sunday — used for the Shabbat lookback exception, since campers don't
      // have a chance to mark Friday/Saturday's hanhagos in real time.
      function isTodaySunday() {
        const [y, m, d] = today().split('-').map(Number);
        return new Date(Date.UTC(y, m - 1, d)).getUTCDay() === 0;
      }

      // Inclusive list of 'YYYY-MM-DD' strings from start to end. Plain string
      // comparison works correctly for this format. Capped at 400 iterations
      // as a safety guard against a malformed/reversed range looping forever.
      function enumerateDateRange(startStr, endStr) {
        const dates = [];
        let cur = startStr;
        let guard = 0;
        while (cur <= endStr && guard < 400) {
          dates.push(cur);
          cur = shiftDate(cur, 1);
          guard++;
        }
        return dates;
      }

      // Saves only the fields the current form actually edits (itemsToUpdate),
      // via upsert — so re-saving updates the existing row instead of
      // duplicating it, and other actors' columns on the same row (e.g. a
      // camper's self-marked hanhagos vs a teacher's learning items) are left
      // untouched since Supabase's upsert only writes the keys you pass.
      //
      // If saving would leave the ENTIRE day's row with nothing marked true
      // anywhere — checked against every configured item, not just the
      // current form's subset — the row is deleted outright instead of left
      // behind as an empty husk. This is what makes unchecking every box and
      // saving actually remove the entry rather than silently no-op.
      async function saveDailyEntry({ camperId, date, itemsToUpdate, entryState, extraJsonField, allConfigItems }) {
        const { data: existingRow } = await supabase
          .from('daily_entries')
          .select('*')
          .eq('camper_id', camperId)
          .eq('entry_date', date)
          .maybeSingle();

        const known = { camper_id: camperId, entry_date: date };
        const extra = {};
        itemsToUpdate.forEach((item) => {
          const val = !!entryState[item.db_key];
          if (KNOWN_ENTRY_COLUMNS.has(item.db_key)) known[item.db_key] = val;
          else extra[item.db_key] = val;
        });
        if (Object.keys(extra).length) known[extraJsonField] = extra;

        // Merge what the row would look like after this save on top of
        // whatever already existed, so the "is everything empty" check
        // considers the FULL row, not just this form's own fields.
        const mergedKnown = { ...(existingRow || {}), ...known };
        const mergedExtra = { ...(existingRow?.entry_data || {}), ...(existingRow?.teacher_data || {}), ...extra };
        const anyTrueAnywhere = (allConfigItems || []).some((item) =>
          KNOWN_ENTRY_COLUMNS.has(item.db_key) ? !!mergedKnown[item.db_key] : !!mergedExtra[item.db_key]
        );

        if (!anyTrueAnywhere) {
          const { error } = await supabase.from('daily_entries').delete().eq('camper_id', camperId).eq('entry_date', date);
          return { error, deleted: true };
        }

        const { error } = await supabase.from('daily_entries').upsert(known, { onConflict: 'camper_id,entry_date' });
        return { error, deleted: false };
      }

      // Legacy aliases so nothing else breaks
      const blankEntry   = getBlankEntry(DEFAULT_CONFIG);
      const learningKeys = DEFAULT_CONFIG.learning_items.map((i) => i.db_key);
      const hanhagaKeys  = DEFAULT_CONFIG.hanhaga_items.map((i) => i.db_key);
      const dailyFields  = Object.fromEntries(
        [...DEFAULT_CONFIG.learning_items, ...DEFAULT_CONFIG.hanhaga_items]
          .map((i) => [i.db_key, i.label])
      );

      // ── Supabase connection (hardcoded — anon key is safe to be public) ──────
      const SUPABASE_URL  = 'https://mgiwefsbvixlnlokplpj.supabase.co';
      const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1naXdlZnNidml4bG5sb2twbHBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMzcxODYsImV4cCI6MjA5NjcxMzE4Nn0.j7kP1moUmcbBFuf3Iz4yZmlLGdjJf-3yBfbu1HXGF78';
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

      // Admin passcode lives only in localStorage — no server involved.
      function getAdminCode() { return localStorage.getItem('mivtza_admin_code') || ''; }
      function saveAdminCode(code) { localStorage.setItem('mivtza_admin_code', code.trim()); }

      // Admin NFC cards — scanning one on the login screen goes straight to the admin portal.
      function getAdminCards() { try { return JSON.parse(localStorage.getItem('mivtza_admin_cards') || '[]'); } catch { return []; } }
      function saveAdminCards(cards) { localStorage.setItem('mivtza_admin_cards', JSON.stringify(cards)); }

      function classNames(...parts) {
        return parts.filter(Boolean).join(' ');
      }

      // Supabase can hand back a JSON/object value for a column we expect to be
      // a plain string or number (e.g. a jsonb column, or a row shape that
      // doesn't match what the UI assumes). Rendering an object directly as a
      // React child throws "Objects are not valid as a React child" (error
      // #31) and blanks the whole page. This guards every spot that renders a
      // raw Supabase field so a stray object degrades gracefully instead of
      // crashing.
      function displayValue(value) {
        if (value === null || value === undefined) return '';
        if (typeof value === 'object') {
          try {
            return JSON.stringify(value);
          } catch (stringifyError) {
            return String(value);
          }
        }
        return value;
      }

      function normalizeStatus(status) {
        if (!status) return 'Gold';
        const cleaned = String(status).trim().toLowerCase();
        if (cleaned === 'black') return 'Black';
        if (cleaned === 'platinum') return 'Platinum';
        return 'Gold';
      }

      // Different scan methods format NFC IDs differently: Web NFC taps return
      // colon-separated hex like "04:6F:47:56:D1:2A:81", a USB keyboard-wedge
      // reader might emit a plain decimal/alphanumeric string, and an admin
      // might type one in by hand with different casing or spacing. Comparing
      // these with an exact, case-sensitive match means a card registered one
      // way will silently fail to look up if scanned a different way. This
      // strips everything but letters/digits and lowercases, so "04:6F:47..."
      // and "046f47..." are treated as the same card.
      function normalizeNfcId(value) {
        return String(value ?? '')
          .toLowerCase()
          .replace(/[^a-z0-9]/g, '');
      }



      function IconButton({ icon: Icon, label, className = '', ...props }) {
        return (
          <button
            title={label}
            aria-label={label}
            className={classNames('focus-ring inline-flex h-11 w-11 items-center justify-center rounded border line-border transition hover:scale-[1.02]', className)}
            {...props}
          >
            <Icon size={19} />
          </button>
        );
      }

          <label className={classNames('glass-panel flex items-center gap-3 rounded px-3 py-2', className)}>

              className="focus-ring min-w-0 flex-1 bg-transparent py-2 text-sm font-semibold outline-none placeholder:font-medium"
              {...props}

      function Shell({ children, status = 'Gold', admin = false, onLogout }) {
        useEffect(() => {
          document.documentElement.dataset.theme = normalizeStatus(status);
        }, [status]);

        return (
          <main className="min-h-screen px-4 py-5 sm:px-6 lg:px-8">
            <div className="mx-auto flex max-w-7xl items-center justify-between pb-5">
              <div className="flex items-center gap-3">
                <div className="lux-card flex h-11 w-16 items-center justify-center rounded shadow-glow">
                  <CreditCard size={24} />
                </div>
                <div>
                  <p className="text-sm font-extrabold uppercase tracking-[0.16em]">Mivtza Amek</p>
                  <p className="muted-text text-xs font-semibold">Learn. Do. Earn. Grow.</p>
                </div>
              </div>
              <div className="flex items-center gap-2">

            </div>
            {children}
            <div className="mx-auto mt-8 max-w-7xl px-1 text-center">
              <p className="muted-text text-[10px] font-semibold tracking-widest opacity-40">V42</p>
              <p className="muted-text mt-1 text-xs font-semibold opacity-60">Copyright 2026 HINENI SYSTEMS</p>
            </div>
          </main>
        );
      }

      // ── Global toast notification system ──────────────────────────────────
      const TOAST_ICONS = {
        error:   { icon: '✕', bg: 'border-red-500/30 bg-red-500/10',    text: 'text-red-400'    },
        warning: { icon: '!', bg: 'border-amber-500/30 bg-amber-500/10', text: 'text-amber-400'  },
        offline: { icon: '⌀', bg: 'border-red-500/30 bg-red-950/60',    text: 'text-red-300'    },
        info:    { icon: '·', bg: 'border-white/10 bg-white/5',          text: 'text-white/80'   },
        success: { icon: '✓', bg: 'border-green-500/30 bg-green-500/10', text: 'text-green-400'  },
      };

      function Toast({ message, type = 'error', onDismiss }) {
        const [leaving, setLeaving] = useState(false);
        const style = TOAST_ICONS[type] || TOAST_ICONS.error;

        const dismiss = () => { setLeaving(true); setTimeout(onDismiss, 220); };
        useEffect(() => {
          if (type === 'success' || type === 'info') {
            const t = setTimeout(dismiss, 4000);
            return () => clearTimeout(t);
          }
        }, []);

        return (
          <div className={`${leaving ? 'toast-leave' : 'toast-enter'} pointer-events-auto flex items-start gap-3 rounded-2xl border px-4 py-3 shadow-luxury backdrop-blur-md ${style.bg}`}
            style={{ maxWidth: 360 }}>
            <span className={`mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full border ${style.bg} ${style.text} text-xs font-black`}>
              {style.icon}
            </span>
            <p className={`flex-1 text-sm font-semibold leading-snug ${style.text}`}>{message}</p>
            <button onClick={dismiss} className={`shrink-0 text-lg leading-none opacity-50 hover:opacity-100 ${style.text}`}>×</button>
          </div>
        );
      }

      function ToastStack({ toasts, remove }) {
        if (!toasts.length) return null;
        return (
          <div className="pointer-events-none fixed bottom-6 inset-x-0 z-[100] flex flex-col items-center gap-2 px-4">
            {toasts.map((t) => <Toast key={t.id} message={t.message} type={t.type} onDismiss={() => remove(t.id)} />)}
          </div>
        );
      }

      function useToast() {
        const [toasts, setToasts] = useState([]);
        const push = (message, type = 'error') => setToasts((prev) => [...prev, { id: Date.now() + Math.random(), message, type }]);
        const remove = (id) => setToasts((prev) => prev.filter((t) => t.id !== id));
        return { toasts, remove, push,
          error:   (m) => push(m, 'error'),
          warning: (m) => push(m, 'warning'),
          success: (m) => push(m, 'success'),
          info:    (m) => push(m, 'info'),
          offline: ()  => push('No internet connection — check your network and try again.', 'offline'),
        };
      }

      function PasscodePanel() {
        const [code, setCode] = useState(getAdminCode);
        const [saved, setSaved] = useState(false);
        return (
          <div className="grid gap-3">
            <TextInput
              icon={Lock}
              type="password"
              placeholder="Set admin passcode (leave blank for no lock)"
              value={code}
              onChange={(e) => { setCode(e.target.value); setSaved(false); }}
            />
            <button
              className="app-button focus-ring inline-flex items-center justify-center gap-2 rounded px-5 py-3 font-extrabold"
              onClick={() => { saveAdminCode(code); setSaved(true); }}
            >
              <Save size={18} /> {saved ? 'Saved ✓' : 'Save Passcode'}
            </button>
          </div>
        );
      }

      // ── Teacher Login Modal (username + password) ──────────────────────────
      // ── Teacher Login — Google Sign-In against an email allowlist ─────────
      // No accounts to create in-app. To let a teacher in, add their Google
      // email to the teacher_profiles table directly in Supabase's Table
      // Editor: email, name, bunk. That's it — no signup flow needed.
      function TeacherLoginModal({ onClose, onAuthed }) {
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState('');
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [isNewAccount, setIsNewAccount] = useState(false);

        const signInWithGoogle = async () => {
          setBusy(true);
          setError('');
          const { error: authError } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + window.location.pathname },
          });
          if (authError) { setBusy(false); setError(authError.message); }
          // On success the browser redirects to Google, then back here —
          // App's session-check effect picks up the logged-in user from there.
        };

        const submitPassword = async () => {
          if (!email.trim() || !password) { setError('Enter email and password.'); return; }
          if (isNewAccount && password.length < 6) { setError('Password must be at least 6 characters.'); return; }
          setBusy(true);
          setError('');
          try {
            // Call these directly on supabase.auth (not through a bare variable) —
            // extracting the method into a variable strips the `this` binding
            // that GoTrueClient needs internally, causing it to throw before
            // ever reaching the network call. That left the button stuck on
            // "Please wait…" forever with no visible error.
            const { error: authError } = isNewAccount
              ? await supabase.auth.signUp({ email: email.trim(), password })
              : await supabase.auth.signInWithPassword({ email: email.trim(), password });

            if (authError) {
              window.alert(authError.message);
              setError(authError.message);
              return;
            }

            const found = await onAuthed();
            if (found) {
              onClose();
            } else {
              const msg = 'Signed in, but this email is not on the teacher list. Ask an admin to add you in Supabase.';
              window.alert(msg);
              setError(msg);
            }
          } catch (err) {
            // Catches any unexpected JS error (network failure, etc.) so the
            // spinner never gets stuck silently again.
            window.alert(err.message || 'Something went wrong. Please try again.');
            setError(err.message || 'Something went wrong. Please try again.');
          } finally {
            setBusy(false);
          }
        };

        return (
          <div className="fixed inset-0 z-50 grid place-items-center bg-black/70 backdrop-blur-md p-6">
            <div className="lux-card w-full max-w-sm rounded-2xl p-7 shadow-luxury">
              <div className="mb-5 flex items-center justify-between">
                <h2 className="text-xl font-extrabold">Teacher / Counselor Login</h2>
                <button onClick={onClose} className="focus-ring rounded p-1"><X size={20} /></button>
              </div>

              <div className="grid gap-3">
                <TextInput icon={Users} type="email" placeholder="Email" value={email}
                  onChange={(e) => setEmail(e.target.value)} />
                <TextInput icon={Lock} type="password" placeholder="Password" value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && submitPassword()} />
                {error && <p className="rounded-lg border border-red-400/40 bg-red-500/10 px-3 py-2 text-xs font-semibold text-red-500">{error}</p>}
                <button onClick={submitPassword} disabled={busy} className="app-button focus-ring flex items-center justify-center gap-2 rounded-lg px-5 py-3 font-extrabold disabled:opacity-70">
                  {busy ? <RefreshCw size={16} className="animate-spin" /> : <BadgeCheck size={16} />}
                  {busy ? 'Please wait…' : (isNewAccount ? 'Create Account & Sign In' : 'Sign In')}
                </button>
                <button onClick={() => { setIsNewAccount((v) => !v); setError(''); }} className="text-xs font-semibold muted-text underline">
                  {isNewAccount ? 'Already have a password? Sign in' : 'First time? Create a password'}
                </button>
              </div>

              <div className="my-4 flex items-center gap-3">
                <div className="h-px flex-1 bg-white/10" />
                <span className="muted-text text-xs font-extrabold">OR</span>
                <div className="h-px flex-1 bg-white/10" />
              </div>

              <button onClick={signInWithGoogle} disabled={busy} className="glass-panel focus-ring flex w-full items-center justify-center gap-3 rounded-lg px-5 py-4 font-extrabold disabled:opacity-70">
                <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.6 18.9 12.5 24 12.5c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5c-7.6 0-14.2 4.3-17.7 10.6l0 .6z"/><path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.5C29.5 35.5 26.9 36.5 24 36.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.7 40 16.3 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.8l6.6 5.5C41.6 36 44.5 30.5 44.5 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
                Sign in with Google
              </button>
            </div>
          </div>
        );
      }

      function LoginScreen({ onCamper, onAdmin, onClub, onTeacherAuthed }) {
        const [scan, setScan] = useState('');
        const [busy, setBusy] = useState(false);
        const [cardNotFound, setCardNotFound] = useState(false);
        const [nfcListening, setNfcListening] = useState(false);
        const [nfcMessage, setNfcMessage] = useState('');
        const [showManual, setShowManual] = useState(false);
        const [showTeacherLogin, setShowTeacherLogin] = useState(false);
        const manualInputRef = useRef(null);
        const ndefRef = useRef(null);
        const scanBufferRef = useRef('');
        const fetchCamperRef = useRef(null);
        const toast = useToast();

        // Global keydown listener captures USB/keyboard-wedge scanner strokes without
        // ever focusing an input — so the mobile soft keyboard never appears at all.
        useEffect(() => {
          if (showManual) return; // manual input handles its own typing
          let timer = null;
          const onKey = (e) => {
            if (showManual || busy) return;
            if (e.key === 'Enter') {
              const buf = scanBufferRef.current.trim();
              scanBufferRef.current = '';
              clearTimeout(timer);
              if (buf && fetchCamperRef.current) fetchCamperRef.current(buf);
            } else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
              scanBufferRef.current += e.key;
              clearTimeout(timer);
              timer = setTimeout(() => { scanBufferRef.current = ''; }, 400);
            }
          };
          document.addEventListener('keydown', onKey);
          return () => { document.removeEventListener('keydown', onKey); clearTimeout(timer); };
        }, [showManual, busy]);

        const fetchCamper = async (nfcId) => {
          if (!navigator.onLine) { toast.offline(); return; }
          setBusy(true);
          setCardNotFound(false);
          try {
            const target = normalizeNfcId(nfcId);

            // Fetch admin/teacher cards + camper roster in one round-trip.
            // This avoids the race condition where state hasn't loaded yet.
            const [{ data: cfgData }, { data: camperData, error: fetchError }] = await Promise.all([
              supabase.from('mivtza_config').select('admin_cards,teacher_cards').limit(1).maybeSingle(),
              supabase.from(CAMPER_READ_TABLE).select('*'),
            ]);
            setBusy(false);
            setScan('');

            // Admin card check
            let adminIds = [];
            try { adminIds = JSON.parse(cfgData?.admin_cards || '[]'); } catch {}
            if (adminIds.some((id) => normalizeNfcId(id) === target)) {
              onAdmin();
              return;
            }

            // Club card check (Chitas, etc.)
            let clubCards = [];
            try { clubCards = JSON.parse(cfgData?.club_cards || '[]'); } catch {}
            const clubMatch = clubCards.find((c) => normalizeNfcId(c.nfc_id || '') === target);
            if (clubMatch) {
              onClub(clubMatch);
              return;
            }

            // Camper lookup
            if (fetchError) { toast.error(`Connection error: ${fetchError.message}`); return; }
            if (!camperData || camperData.length === 0) { toast.error('No campers found — check Supabase connection.'); return; }
            const match = camperData.find((row) => normalizeNfcId(row.nfc_id) === target);
            if (!match) { setCardNotFound(true); return; }
            onCamper(match);
          } catch (err) {
            setBusy(false); setScan('');
            if (!navigator.onLine) toast.offline();
            else toast.error(`Error: ${err.message}`);
          }
        };

        // Keep ref current so the keydown closure always calls the latest version
        useEffect(() => { fetchCamperRef.current = fetchCamper; });

        const startPhysicalCardScan = async () => {
          if (!('NDEFReader' in window) || !window.isSecureContext) {
            toast.warning(!('NDEFReader' in window)
              ? 'Web NFC not available on this browser — use Android Chrome.'
              : 'Web NFC requires HTTPS.');
            return;
          }
          try {
            const ndef = new NDEFReader();
            ndefRef.current = ndef;
            ndef.onreading = (event) => {
              const serialNumber = event.serialNumber;
              if (!serialNumber) { toast.warning('Card read but no serial number returned.'); return; }
              setNfcListening(false);
              fetchCamper(serialNumber);
            };
            ndef.onreadingerror = () => toast.warning('Read failed — hold card flat against the back of the device.');
            await ndef.scan();
            setNfcListening(true);
            setNfcMessage('Ready — hold your card to the back of this device.');
          } catch (scanError) {
            setNfcListening(false);
            const msgs = { NotAllowedError: 'NFC permission denied — allow NFC in Chrome settings.', NotReadableError: 'NFC unavailable — enable NFC in Android settings.' };
            toast.warning(msgs[scanError?.name] || scanError?.message || 'NFC could not start.');
          }
        };

        return (
          <Shell status="Gold">
            <ToastStack toasts={toast.toasts} remove={toast.remove} />

            {/* ── Premium loading overlay ── */}
            {busy && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 backdrop-blur-md">
                <div className="flex flex-col items-center gap-8">
                  <div className="loading-card lux-card relative w-72 rounded-2xl p-10 shadow-luxury">
                    <div className="flex flex-col items-center gap-5">
                      <CreditCard size={52} className="shimmer-text" strokeWidth={1.5} />
                      <p className="shimmer-text text-xl font-extrabold uppercase tracking-[0.2em]">Verifying</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2 text-white/60">
                    <span className="text-sm font-semibold">Finding cardmember profile</span>
                    <span className="flex gap-1.5 ml-1">
                      <span className="dot" />
                      <span className="dot" />
                      <span className="dot" />
                    </span>
                  </div>
                </div>
              </div>
            )}

            {/* ── Card not registered modal ── */}
            {cardNotFound && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/70 backdrop-blur-md p-6">
                <div className="lux-card w-full max-w-sm rounded-2xl p-8 text-center shadow-luxury">
                  <div className="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-red-500/15 border border-red-400/30">
                    <CreditCard size={32} className="text-red-400" strokeWidth={1.5} />
                  </div>
                  <h2 className="text-2xl font-extrabold">Card Not Registered</h2>
                  <p className="muted-text mt-2 text-sm font-semibold leading-relaxed">
                    This card doesn't have a cardmember profile yet.<br />
                    See your counselor to get registered.
                  </p>
                  <button
                    className="app-button focus-ring mt-6 w-full rounded-xl px-5 py-4 font-extrabold"
                    onClick={() => setCardNotFound(false)}
                  >
                    Got It
                  </button>
                </div>
              </div>
            )}

            <div className="mx-auto grid min-h-[calc(100vh-7rem)] max-w-lg place-items-center">
              <section className="grid w-full gap-6 text-center">
                {/* Branding */}
                <div>
                  <p className="accent-text text-sm font-extrabold uppercase tracking-[0.28em]">Mivtza Amek</p>
                  <h1 className="mt-2 text-4xl font-extrabold sm:text-5xl">Learn. Do. Earn. Grow.</h1>
                </div>

                {/* Card image */}
                <div className={classNames('relative overflow-hidden rounded-2xl shadow-luxury transition-all mx-auto w-full max-w-sm', nfcListening && 'nfc-listening')}>

                          Ready to Scan
                        </span>
                      </div>
                    )}
                  </div>

                {/* Status / instruction */}
                <p className="muted-text text-base font-semibold">
                  {nfcListening ? 'Hold your card to the back of this device' : 'Tap "Enable NFC" then hold your card to the back of the device'}
                </p>

                {/* Manual entry — only visible when requested, uses its own ref */}
                {showManual && (
                  <div className="flex gap-2">
                    <input
                      ref={manualInputRef}
                      value={scan}
                      onChange={(e) => setScan(e.target.value)}
                      onKeyDown={(e) => { if (e.key === 'Enter' && scan.trim()) { fetchCamper(scan); setScan(''); } }}
                      autoFocus
                      className="glass-panel focus-ring flex-1 rounded-lg px-5 py-4 text-center text-lg font-bold outline-none shadow-glow"
                      placeholder="Type card ID, press Enter"
                    />
                    {scan && (
                      <button className="app-button focus-ring rounded-lg px-5 py-4 font-extrabold" onClick={() => { fetchCamper(scan); setScan(''); }}>
                        Go
                      </button>
                    )}
                  </div>
                )}

                {/* Utility row */}
                <div className="flex items-center justify-between gap-2">
                  <button
                    onClick={() => setShowTeacherLogin(true)}
                    className="glass-panel focus-ring inline-flex items-center gap-2 rounded px-3 py-2 text-xs font-bold opacity-70"
                  >
                    <Users size={13} /> Teacher Login
                  </button>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => { setShowManual((v) => !v); setTimeout(() => inputRef.current?.focus(), 50); }}
                      className="glass-panel focus-ring inline-flex items-center gap-2 rounded px-3 py-2 text-sm font-bold"
                    >
                      <PencilLine size={15} /> {showManual ? 'Hide' : 'Enter Manually'}
                    </button>
                    {!nfcListening && (
                      <button
                        onClick={startPhysicalCardScan}
                        disabled={busy}
                        className="lux-card focus-ring inline-flex items-center gap-2 rounded px-3 py-2 text-sm font-extrabold shadow-luxury disabled:opacity-70"
                      >
                        <Smartphone size={15} /> Enable NFC
                      </button>
                    )}
                    {nfcListening && (
                      <span className="inline-flex items-center gap-2 rounded px-3 py-2 text-sm font-bold accent-text">
                        <RefreshCw size={14} className="animate-spin" /> NFC Active
                      </span>
                    )}
                  </div>
                </div>

                {showTeacherLogin && (
                  <TeacherLoginModal onClose={() => setShowTeacherLogin(false)} onAuthed={onTeacherAuthed} />
                )}
              </section>
            </div>
          </Shell>
        );
      }

      function Stat({ label, value, icon: Icon }) {
        return (
          <div className="glass-panel rounded-lg p-4">
            <div className="mb-2 flex items-center gap-2 muted-text">
              <Icon size={16} />
              <span className="text-xs font-bold uppercase tracking-[0.12em]">{label}</span>
            </div>
            <p className="text-2xl font-extrabold shimmer-text">{displayValue(value) || displayValue(0)}</p>
          </div>
        );
      }

      function CheckboxTile({ checked, label, onChange, disabled = false }) {
        return (
          <button
            type="button"
            disabled={disabled}
            onClick={() => !disabled && onChange(!checked)}
            className={classNames(
              'focus-ring flex min-h-16 items-center gap-3 rounded-lg border p-4 text-left font-bold transition',
              checked ? 'accent-bg line-border shadow-glow' : 'glass-panel hover:scale-[1.01]',
              disabled && 'cursor-not-allowed opacity-40 hover:scale-100'
            )}
          >
            <span className={classNames('flex h-7 w-7 shrink-0 items-center justify-center rounded border line-border', checked && 'app-button')}>
              {checked && <Check size={17} />}
            </span>
            {label}
          </button>
        );
      }

      class ErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { error: null }; }
        static getDerivedStateFromError(error) { return { error }; }
        render() {
          if (this.state.error) {
            return (
              <div className="mx-auto mt-10 max-w-lg rounded-lg border border-red-400/40 bg-red-500/10 p-6 text-red-600">
                <p className="text-lg font-extrabold">Something went wrong loading this screen.</p>
                <p className="mt-2 break-all text-sm font-semibold">{this.state.error.message}</p>
                <button className="mt-4 rounded border border-red-400/40 px-4 py-2 font-bold" onClick={() => this.setState({ error: null })}>
                  Try Again
                </button>
              </div>
            );
          }
          return this.props.children;
        }
      }

      function CamperDashboard({ camper, onLogout }) {
        const [appConfig, setAppConfig] = useState(DEFAULT_CONFIG);
        const [entry, setEntry] = useState(() => getBlankEntry(DEFAULT_CONFIG));
        const [approved, setApproved] = useState(false);
        const [approvalMessage, setApprovalMessage] = useState({ title: 'Transaction Approved', subtitle: 'Points Credited', tone: 'success' });
        const [alreadySubmitted, setAlreadySubmitted] = useState(false);
        const [date, setDate] = useState(() => shiftDate(today(), -1)); // defaults to yesterday
        const [configLoaded, setConfigLoaded] = useState(false);
        const [loadingEntry, setLoadingEntry] = useState(false);
        // Fail-open default: if the app_config table/row isn't set up yet,
        // don't lock every camper out of backmarking unexpectedly — treat it
        // as effectively unlimited until an admin explicitly sets a limit.
        const [allowedBackDays, setAllowedBackDays] = useState(3650);
        const toast = useToast();
        const status = normalizeStatus(camper.card_status);

        // Snapshot of what was actually saved when this date's entry loaded —
        // kept separate from `entry` (which the camper is actively editing)
        // so submit() can diff "before" vs "after" to pick the right modal
        // message. Doesn't trigger re-renders since it never needs to.
        const originalEntryRef = useRef({});

        // Load app-wide config + the camper backmarking limit once on mount.
        // app_config is a key-value table (columns: id, key, value,
        // description) — not a table with a dedicated column per setting —
        // so we look up the specific row by its key and read .value, rather
        // than selecting a column named 'allowed_back_marking_days' directly.
        useEffect(() => {
          Promise.all([
            supabase.from('mivtza_config').select('config_json').limit(1).maybeSingle(),
            supabase.from('app_config').select('value').eq('key', 'allowed_back_marking_days').maybeSingle(),
          ]).then(([{ data: cfgData }, { data: backData }]) => {
            let cfg = DEFAULT_CONFIG;
            if (cfgData?.config_json) try { cfg = JSON.parse(cfgData.config_json); } catch {}
            setAppConfig(cfg);
            const rawValue = backData?.value;
            if (rawValue !== undefined && rawValue !== null && rawValue !== '' && !isNaN(Number(rawValue))) {
              setAllowedBackDays(Number(rawValue));
            } else {
              console.log('[Mivtza] app_config key "allowed_back_marking_days" not found or not numeric — falling back to a generous default (3650) so campers are not accidentally locked out.');
            }
            setConfigLoaded(true);
          });
        }, []);

        // (Re)load today's — or whichever date is selected — existing entry
        // once config is ready, and again any time the date arrows change it.
        useEffect(() => {
          if (!configLoaded) return;
          let cancelled = false;
          setLoadingEntry(true);
          fetchDailyEntry(camper.id, date, appConfig).then(({ entry: filled, existed }) => {
            if (cancelled) return;
            setEntry(filled);
            originalEntryRef.current = filled; // "before" snapshot for change detection at submit time
            setAlreadySubmitted(existed);
            setLoadingEntry(false);
          });
          return () => { cancelled = true; };
        }, [date, configLoaded]);

        const score = calculateScore(entry, appConfig);

        // ── Role-based date status (campers only — counselors/teachers in
        // TeacherPortal have zero such restrictions by design) ──────────────
        const diff = daysBeforeToday(date);       // >0 past, 0 today, <0 future
        const isToday = diff === 0;
        const isYesterday = diff === 1;
        const isFuture = diff < 0;
        const isPast = diff > 0;

        // Shabbat exception: on Sundays, guarantee at least a 2-day lookback
        // (Friday + Saturday) regardless of the configured limit, since
        // campers can't mark those days in real time over Shabbat.
        const effectiveAllowedBackDays = isTodaySunday() ? Math.max(allowedBackDays, 2) : allowedBackDays;

        const isLocked = isPast && diff > effectiveAllowedBackDays;
        // Today is now categorically locked for campers — they mark
        // yesterday's (or earlier) progress, never same-day, so isToday joins
        // isFuture/isLocked as a blocking condition. Today is still viewable
        // (read-only) via navigation, just never editable or submittable.
        const isBlocked = isFuture || isLocked || isToday; // no editing/saving allowed at all

        // Arrow + calendar-picker boundaries
        const atOldestAllowed = diff >= effectiveAllowedBackDays; // left arrow disabled here
        const atNewestAllowed = diff <= 0;                        // right arrow disabled here (never into the future)
        const minAllowedDate = shiftDate(today(), -effectiveAllowedBackDays);
        const maxAllowedDate = today();

        // Debug visibility into exactly what boundaries are being computed,
        // since "the restriction isn't locking down" is much easier to
        // diagnose with the actual min/max strings visible in the console.
        useEffect(() => {
          if (!configLoaded) return;
          console.log('[Mivtza] date boundary check', {
            today: today(),
            rawAllowedBackDays: allowedBackDays,
            isSunday: isTodaySunday(),
            effectiveAllowedBackDays,
            minAllowedDate,
            maxAllowedDate,
            currentDate: date,
            diff,
            atOldestAllowed,
            atNewestAllowed,
          });
        }, [configLoaded, date, allowedBackDays]);

        // Defense-in-depth: force `date` itself back inside [min, max] any
        // time it, or the bounds, change — not just when the arrows are
        // clicked. This is what actually stops the restriction from being
        // bypassable: even if `date` somehow ends up out of range (a race
        // before config finishes loading, a browser accepting a typed date
        // despite min/max, or the Sunday exception changing effectiveAllowed
        // BackDays), this snaps it back immediately rather than trusting the
        // UI controls alone to keep it in bounds.
        useEffect(() => {
          if (!configLoaded) return;
          if (date < minAllowedDate) {
            console.log('[Mivtza] date was before minAllowedDate — clamping', date, '->', minAllowedDate);
            setDate(minAllowedDate);
          } else if (date > maxAllowedDate) {
            console.log('[Mivtza] date was after maxAllowedDate — clamping', date, '->', maxAllowedDate);
            setDate(maxAllowedDate);
          }
        }, [configLoaded, date, minAllowedDate, maxAllowedDate]);

        const submit = async () => {
          if (isBlocked) return; // defense in depth — button is hidden anyway
          const allConfigItems = [...(appConfig.learning_items||[]), ...(appConfig.hanhaga_items||[]), ...(appConfig.teacher_items||[])];

          // Diff "before" (what was already saved for this date) against
          // "after" (current checkbox state) across only the items a camper
          // can actually edit, to choose the right modal message.
          const before = originalEntryRef.current || {};
          let added = false, removed = false;
          (appConfig.hanhaga_items || []).forEach((item) => {
            const wasTrue = !!before[item.db_key];
            const isTrue = !!entry[item.db_key];
            if (!wasTrue && isTrue) added = true;
            if (wasTrue && !isTrue) removed = true;
          });

          const { error } = await saveDailyEntry({
            camperId: camper.id,
            date,
            itemsToUpdate: appConfig.hanhaga_items || [], // campers only mark hanhagos
            entryState: entry,
            extraJsonField: 'entry_data',
            allConfigItems,
          });
          if (error) { toast.error(error.message); return; }

          if (!added && !removed) {
            setApprovalMessage({ title: 'No Changes Detected', subtitle: 'Your checklist is already up to date', tone: 'neutral' });
          } else if (removed) {
            // Any removal takes precedence over an added item in the same
            // submit — "Changes Saved" reads correctly whether it was a pure
            // uncheck or a mix of both, whereas "Points Credited" would be
            // misleading if something was also taken away.
            setApprovalMessage({ title: 'Update Approved', subtitle: 'Changes Saved', tone: 'success' });
          } else {
            setApprovalMessage({ title: 'Transaction Approved', subtitle: 'Points Credited', tone: 'success' });
          }

          // Refresh the "before" snapshot to match what was just saved, so a
          // second submit in the same visit without further changes correctly
          // reports "No Changes Detected" instead of re-diffing against stale data.
          originalEntryRef.current = { ...entry };

          setApproved(true);
          window.setTimeout(() => { setApproved(false); onLogout(); }, 2000);
        };

        const maxScore = (appConfig.learning_items || []).reduce((s, i) => s + Number(i.points || 0), 0)
          + (appConfig.hanhaga_items || []).length * Number(appConfig.hanhaga_bonus_per_item ?? 5)
          + (appConfig.teacher_items || []).reduce((s, i) => s + Number(i.points || 0), 0);

        return (
          <Shell status={status} onLogout={onLogout}>
            <ToastStack toasts={toast.toasts} remove={toast.remove} />
            <div className="mx-auto grid max-w-7xl gap-5">
              <section className="lux-card rounded-lg p-5 shadow-luxury">
                <div className="grid gap-4 lg:grid-cols-[1.4fr_.8fr_.8fr_.8fr]">
                  <div>
                    <p className="text-xs font-extrabold uppercase tracking-[0.18em] opacity-70">Cardmember</p>
                    <h1 className="mt-2 text-4xl font-extrabold shimmer-text">{camper.name}</h1>
                  </div>
                  <Stat label="Tier" value={status} icon={WalletCards} />
                  <Stat label="Lifetime" value={camper.total_points} icon={Award} />
                  <Stat label="This Week" value={camper.weekly_points} icon={CalendarDays} />
                </div>

                {/* Date navigator — restricted to the allowed backmarking
                    window for campers (with the Sunday Shabbat exception),
                    unlike TeacherPortal's identical-looking navigator below
                    which stays completely unrestricted for counselors. */}
                <div className="mt-4 flex items-center justify-center gap-2 border-t line-border pt-4">
                  <button
                    onClick={() => setDate((d) => shiftDate(d, -1))}
                    disabled={loadingEntry || atOldestAllowed}
                    className="focus-ring flex h-9 w-9 shrink-0 items-center justify-center rounded-full glass-panel transition hover:scale-105 disabled:opacity-30"
                    aria-label="Previous day"
                    title={atOldestAllowed ? 'Earliest allowed date reached' : 'Previous day'}
                  >
                    <ChevronLeft size={18} />
                  </button>

                  <div className="flex min-w-[200px] items-center justify-center gap-2 text-center">
                    <span className="text-sm font-extrabold">{formatDateHuman(date)}</span>
                    {loadingEntry && <RefreshCw size={12} className="muted-text animate-spin shrink-0" />}
                  </div>

                  <button
                    onClick={() => setDate((d) => shiftDate(d, 1))}
                    disabled={loadingEntry || atNewestAllowed}
                    className="focus-ring flex h-9 w-9 shrink-0 items-center justify-center rounded-full glass-panel transition hover:scale-105 disabled:opacity-30"
                    aria-label="Next day"
                    title={atNewestAllowed ? 'Cannot record a future date' : 'Next day'}
                  >
                    <ChevronRight size={18} />
                  </button>

                  <label
                    className="focus-ring relative flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-full glass-panel transition hover:scale-105"
                    title="Jump to a specific date"
                  >
                    <CalendarDays size={15} />
                    <input
                      type="date"
                      value={date}
                      min={minAllowedDate}
                      max={maxAllowedDate}
                      onChange={(e) => {
                        // Native date inputs can still be typed manually even
                        // with min/max set on some browsers/OSes — clamp
                        // defensively so a typed-in out-of-range date can't
                        // slip past the same restriction the arrows enforce.
                        const picked = e.target.value;
                        if (picked < minAllowedDate) setDate(minAllowedDate);
                        else if (picked > maxAllowedDate) setDate(maxAllowedDate);
                        else setDate(picked);
                      }}
                      className="absolute inset-0 cursor-pointer opacity-0"
                    />
                  </label>
                </div>

                {/* Role-based date status notice */}
                <div className="mt-3">
                  {isToday && (
                    <div className="rounded-xl border border-blue-400/40 bg-blue-500/10 px-4 py-2.5 text-center text-sm font-bold text-blue-500">
                      🕐 Today isn't open for marking yet — come back tomorrow. Use the ← arrow to record Yesterday and earlier.
                    </div>
                  )}
                  {isYesterday && !isLocked && (
                    <div className="rounded-xl border border-amber-400/40 bg-amber-500/10 px-4 py-2.5 text-center text-sm font-bold text-amber-600">
                      📝 Catching Up: You are marking what you accomplished YESTERDAY ({formatDateHuman(date)}).
                    </div>
                  )}
                  {isPast && !isYesterday && !isLocked && (
                    <div className="rounded-xl border border-amber-400/40 bg-amber-500/10 px-4 py-2.5 text-center text-sm font-bold text-amber-600">
                      ⏳ Past Record: You are marking what you accomplished on {formatDateHuman(date)}.
                    </div>
                  )}
                  {isLocked && (
                    <div className="rounded-xl border border-red-400/40 bg-red-500/10 px-4 py-2.5 text-center text-sm font-bold text-red-500">
                      🔒 Marking locked for this date by administration.
                    </div>
                  )}
                  {isFuture && (
                    <div className="rounded-xl border border-red-400/40 bg-red-500/10 px-4 py-2.5 text-center text-sm font-bold text-red-500">
                      🚫 Future Date: You cannot record progress for a future date.
                    </div>
                  )}
                </div>
              </section>

              <div className="grid gap-5 lg:grid-cols-[1fr_20rem]">
                <section className="grid gap-5">
                  {/* Hanhagos */}
                  <div className={classNames('glass-panel rounded-lg p-5', isBlocked && 'opacity-70')}>
                    <h2 className="mb-1 flex items-center gap-2 text-xl font-extrabold"><ShieldCheck className="accent-text" /> Daily Hanhagos</h2>
                    <p className="muted-text mb-4 text-xs font-semibold">
                      Each hanhaga = +{appConfig.hanhaga_bonus_per_item ?? 5} bonus pts · Max {(appConfig.hanhaga_items || []).length * Number(appConfig.hanhaga_bonus_per_item ?? 5)} pts
                    </p>
                    {isBlocked && (
                      <div className="mb-4 rounded-xl border border-red-400/40 bg-red-500/10 px-4 py-2.5 text-center text-sm font-bold text-red-500">
                        🔒 This date is locked for editing.
                      </div>
                    )}
                    <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
                      {(appConfig.hanhaga_items || []).map((item) => (
                        <CheckboxTile
                          key={item.db_key}
                          label={item.label}
                          checked={entry[item.db_key] || false}
                          disabled={isBlocked}
                          onChange={(v) => setEntry({ ...entry, [item.db_key]: v })}
                        />
                      ))}
                    </div>
                  </div>

                  {/* Teacher-marked items (read-only for camper — always disabled regardless of date) */}
                  {(appConfig.teacher_items || []).length > 0 && (
                    <div className="glass-panel rounded-lg p-5">
                      <h2 className="mb-1 flex items-center gap-2 text-xl font-extrabold"><BadgeCheck className="accent-text" /> Teacher Credits</h2>
                      <p className="muted-text mb-4 text-xs font-semibold">Your teacher fills these in — they appear here after being marked.</p>
                      <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
                        {(appConfig.teacher_items || []).map((item) => (
                          <CheckboxTile key={item.db_key} label={`${item.label}${item.points ? ` · ${item.points}pts` : ''}`} checked={entry[item.db_key] || false} disabled={true} onChange={() => {}} />
                        ))}
                      </div>
                    </div>
                  )}
                </section>

                <aside className="glass-panel sticky top-5 h-fit rounded-lg p-5 shadow-luxury">
                  <p className="muted-text text-xs font-extrabold uppercase tracking-[0.16em]">Daily Score</p>
                  <p className="mt-3 text-6xl font-extrabold shimmer-text">{score}</p>
                  <p className="muted-text mt-1 text-xs font-semibold">of {maxScore} possible</p>
                  <div className="mt-3 h-1.5 w-full rounded-full bg-white/10 overflow-hidden">
                    <div className="h-full rounded-full accent-bg transition-all" style={{ width: `${maxScore ? Math.min(100, Math.round(score / maxScore * 100)) : 0}%`, background: 'var(--accent)' }} />
                  </div>
                  <p className="muted-text mt-3 text-xs font-semibold">
                    Hanhagos: {(appConfig.hanhaga_items||[]).filter(i=>entry[i.db_key]).length} / {(appConfig.hanhaga_items||[]).length} · Bonus: {(appConfig.hanhaga_items||[]).filter(i=>entry[i.db_key]).length * Number(appConfig.hanhaga_bonus_per_item??5)} pts
                  </p>
                  {alreadySubmitted && !isBlocked && (
                    <div className="mt-4 rounded-xl border border-amber-400/40 bg-amber-500/10 px-4 py-3 text-sm font-semibold text-amber-600">
                      ✓ Already submitted for this date. Submitting again will update your entry.
                    </div>
                  )}
                  <button
                    disabled={isBlocked}
                    className="app-button focus-ring mt-5 flex w-full items-center justify-center gap-2 rounded px-5 py-4 text-lg font-extrabold disabled:cursor-not-allowed disabled:opacity-40"
                    onClick={submit}
                  >
                    <BadgeCheck size={22} /> {isBlocked ? 'Locked' : (alreadySubmitted ? 'Update Submission' : 'Submit')}
                  </button>
                </aside>
              </div>
            </div>

            {approved && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/45 p-6">
                <div className="lux-card max-w-md rounded-lg p-8 text-center shadow-luxury">
                  {approvalMessage.tone === 'neutral' ? (
                    <Check className="muted-text mx-auto mb-4" size={52} />
                  ) : (
                    <BadgeCheck className="mx-auto mb-4" size={52} />
                  )}
                  <h2 className="text-3xl font-extrabold">{approvalMessage.title}</h2>
                  <p className={classNames('mt-2 text-lg font-bold', approvalMessage.tone === 'neutral' && 'muted-text')}>{approvalMessage.subtitle}</p>
                </div>
              </div>
            )}
          </Shell>
        );
      }

      function AdminGate({ children }) {
        const adminCode = getAdminCode();
        const [code, setCode] = useState('');
        const [unlocked, setUnlocked] = useState(!adminCode || sessionStorage.getItem('mivtza_admin_unlocked') === '1');
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [isNewAccount, setIsNewAccount] = useState(false);
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState('');

        // Once signed in as an authenticated Supabase user, re-check on every
        // mount whether that email is on the admin allowlist — lets a
        // returning admin skip straight in without re-entering anything.
        useEffect(() => {
          if (unlocked) return;
          supabase.auth.getSession().then(async ({ data: { session } }) => {
            if (!session?.user?.email) return;
            const { data } = await supabase.from('admin_profiles').select('email').ilike('email', session.user.email).maybeSingle();
            if (data) { sessionStorage.setItem('mivtza_admin_unlocked', '1'); setUnlocked(true); }
          });
        }, []);

        if (unlocked) return children;

        const unlockWithPasscode = () => {
          if (code === adminCode) {
            sessionStorage.setItem('mivtza_admin_unlocked', '1');
            setUnlocked(true);
          } else {
            setError('Incorrect passcode.');
          }
        };

        const submitPassword = async () => {
          if (!email.trim() || !password) { setError('Enter email and password.'); return; }
          if (isNewAccount && password.length < 6) { setError('Password must be at least 6 characters.'); return; }
          setBusy(true);
          setError('');
          try {
            // Call these directly on supabase.auth — extracting the method into
            // a bare variable strips the `this` binding GoTrueClient needs,
            // which throws before the network call ever fires and leaves the
            // button stuck spinning with no visible error.
            const { error: authError } = isNewAccount
              ? await supabase.auth.signUp({ email: email.trim(), password })
              : await supabase.auth.signInWithPassword({ email: email.trim(), password });

            if (authError) {
              window.alert(authError.message);
              setError(authError.message);
              return;
            }

            const { data } = await supabase.from('admin_profiles').select('email').ilike('email', email.trim()).maybeSingle();
            if (data) {
              sessionStorage.setItem('mivtza_admin_unlocked', '1');
              setUnlocked(true);
            } else {
              await supabase.auth.signOut();
              const msg = 'Signed in, but this email is not on the admin list. Add it to admin_profiles in Supabase.';
              window.alert(msg);
              setError(msg);
            }
          } catch (err) {
            window.alert(err.message || 'Something went wrong. Please try again.');
            setError(err.message || 'Something went wrong. Please try again.');

                  <input
                    className="min-w-0 flex-1 bg-transparent text-sm font-semibold outline-none placeholder:font-medium font-mono"

      // ── Bulk Import (bunks + classes from Google Sheets paste) ────────────
      // Names are matched word-order-independent so "Avi Adelist" (bunks sheet)
      // and "Adelist Avi" (classes sheet) both match the same camper.
      function nameKey(name) {
        return String(name || '')
          .toLowerCase()
          .replace(/[^a-z\s]/g, '')
          .split(/\s+/)
          .filter(Boolean)
          .sort()
          .join(' ');
      }

      function BulkImportPanel({ campers, onDone }) {
        const [mode, setMode] = useState('bunks');
        const [raw, setRaw] = useState('');
        const [preview, setPreview] = useState(null);
        const [applying, setApplying] = useState(false);
        const toast = useToast();

        const parse = () => {
          const lines = raw.replace(/\r/g, '').split('\n').filter((l) => l.trim() !== '' || l.includes('\t'));
          if (lines.length === 0) return [];
          const grid = lines.map((l) => l.split('\t'));
          const results = [];

          if (mode === 'bunks') {
            const cols = Math.max(...grid.map((r) => r.length));
            for (let c = 0; c < cols; c += 2) {
              const kevutza = (grid[0]?.[c] || '').trim();
              const bunkhouse = (grid[1]?.[c] || '').trim();
              if (!kevutza) continue;
              const group = bunkhouse ? `${kevutza} (${bunkhouse})` : kevutza;
              for (let r = 3; r < grid.length; r++) {
                const first = (grid[r]?.[c] || '').trim();
                const last = (grid[r]?.[c + 1] || '').trim();
                const fullName = `${first} ${last}`.trim();
                if (fullName) results.push({ fullName, group });
              }
            }
          } else {
            const cols = Math.max(...grid.map((r) => r.length));
            for (let c = 0; c < cols; c++) {
              const rabbi = (grid[0]?.[c] || '').trim();
              if (!rabbi) continue;
              for (let r = 1; r < grid.length; r++) {
                const fullName = (grid[r]?.[c] || '').trim();
                if (fullName && !/^\d+$/.test(fullName)) results.push({ fullName, group: rabbi });
              }
            }
          }
          return results;
        };

        const buildPreview = () => {
          const rows = parse();
          if (rows.length === 0) { toast.error('Nothing parsed — paste the sheet including headers.'); return; }
          const lookup = {};
          campers.forEach((c) => { lookup[nameKey(c.name)] = c; });
          const matched = [], unmatched = [];
          rows.forEach((row) => {
            const hit = lookup[nameKey(row.fullName)];
            if (hit) matched.push({ camper: hit, group: row.group, sheetName: row.fullName });
            else unmatched.push(row);
          });
          setPreview({ matched, unmatched });
        };

        const apply = async () => {
          if (!preview) return;
          setApplying(true);
          const field = mode === 'bunks' ? 'bunk' : 'class';
          let ok = 0, fail = 0, blocked = 0;
          for (const m of preview.matched) {
            // .select() forces Supabase to return the updated row(s) — if
            // Row Level Security is silently blocking the write, this comes
            // back as an empty array with NO error, which is otherwise
            // invisible. Checking the returned row count catches that.
            const { data, error } = await supabase.from(CAMPER_WRITE_TABLE).update({ [field]: m.group }).eq('id', m.camper.id).select();
            if (error) fail++;
            else if (!data || data.length === 0) blocked++;
            else ok++;
          }
          setApplying(false);
          if (blocked > 0) {
            toast.error(`${blocked} update(s) were silently blocked — this means Row Level Security on "${CAMPER_WRITE_TABLE}" doesn't allow writes. Run the RLS fix SQL in Supabase.`);
          } else {
            toast.success(`${ok} campers updated${fail ? `, ${fail} failed` : ''} ✓`);
          }
          setPreview(null);
          setRaw('');
          onDone && onDone();
        };

        return (
          <div className="glass-panel rounded-lg p-5">
            <ToastStack toasts={toast.toasts} remove={toast.remove} />
            <h2 className="mb-1 flex items-center gap-2 text-xl font-extrabold"><Users className="accent-text" /> Bulk Import Bunks & Classes</h2>
            <p className="muted-text mb-4 text-xs font-semibold">Copy your Google Sheet (including the header rows) and paste below. Names match your existing campers automatically — even if first/last name order differs.</p>

            <div className="mb-3 flex gap-2">
              <button onClick={() => { setMode('bunks'); setPreview(null); }} className={`focus-ring rounded px-4 py-2 text-sm font-extrabold ${mode==='bunks' ? 'app-button' : 'glass-panel'}`}>Bunks Sheet</button>
              <button onClick={() => { setMode('classes'); setPreview(null); }} className={`focus-ring rounded px-4 py-2 text-sm font-extrabold ${mode==='classes' ? 'app-button' : 'glass-panel'}`}>Classes Sheet</button>
            </div>

            <p className="muted-text mb-2 text-xs font-semibold">
              {mode === 'bunks'
                ? 'Bunks: Kevutza name in row 1, Bunkhouse in row 2, counselor in row 3, then First name | Last name columns.'
                : 'Classes: Rabbi name in row 1, then "Lastname Firstname" down each column.'}
            </p>

            <textarea
              className="glass-panel focus-ring w-full rounded-lg p-3 text-xs font-mono outline-none"
              rows={6}
              placeholder="Paste your sheet here…"
              value={raw}
              onChange={(e) => { setRaw(e.target.value); setPreview(null); }}
            />

            <div className="mt-3 flex gap-2">
