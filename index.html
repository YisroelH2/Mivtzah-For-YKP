<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mivtza Amek</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#c89c3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AmEx Mivtza" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['Inter', 'ui-sans-serif', 'system-ui'],
              body: ['Inter', 'ui-sans-serif', 'system-ui'],
            },
            boxShadow: {
              luxury: '0 28px 90px rgba(0,0,0,.22)',
              glow: '0 0 36px rgba(112,190,255,.22)',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        --bg: #f8f3e7;
        --bg-2: #ffffff;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-solid: #ffffff;
        --text: #282520;
        --muted: #756e63;
        --line: rgba(121, 96, 46, 0.2);
        --accent: #c89c3b;
        --accent-2: #f1d38b;
        --accent-soft: rgba(200, 156, 59, 0.16);
        --card-gradient: linear-gradient(135deg, #fff7df 0%, #e6bf5f 46%, #fff3c6 100%);
        --luxury-border: linear-gradient(135deg, rgba(246,215,136,.9), rgba(164,117,24,.68), rgba(255,244,204,.92));
      }

      [data-theme='Platinum'] {
        --bg: #eef2f6;
        --bg-2: #ffffff;
        --panel: rgba(255, 255, 255, 0.72);
        --panel-solid: #fbfdff;
        --text: #17202a;
        --muted: #607080;
        --line: rgba(90, 111, 132, 0.22);
        --accent: #6f8498;
        --accent-2: #94d9ff;
        --accent-soft: rgba(101, 190, 255, 0.16);
        --card-gradient: linear-gradient(135deg, #f8fbff 0%, #bdc7d1 28%, #ffffff 48%, #8797a7 100%);
        --luxury-border: linear-gradient(135deg, rgba(255,255,255,.95), rgba(101,190,255,.66), rgba(113,126,140,.72));
      }

      [data-theme='Black'] {
        --bg: #050506;
        --bg-2: #111214;
        --panel: rgba(15, 16, 18, 0.82);
        --panel-solid: #0d0e10;
        --text: #f6f3ea;
        --muted: #aaa69c;
        --line: rgba(255, 255, 255, 0.14);
        --accent: #d7d1c4;
        --accent-2: #ffffff;
        --accent-soft: rgba(255, 255, 255, 0.1);
        --card-gradient: linear-gradient(135deg, #050506 0%, #191b1f 42%, #050506 100%);
        --luxury-border: linear-gradient(120deg, #ffffff, #45484f, #f7f2df, #18191d, #ffffff);
      }

      body {
        background:
          radial-gradient(circle at top left, var(--accent-soft), transparent 30rem),
          linear-gradient(140deg, var(--bg), var(--bg-2));
        color: var(--text);
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui;
      }

      .glass-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        backdrop-filter: blur(18px);
      }

      .lux-card {
        position: relative;
        background: var(--card-gradient);
        border: 1px solid transparent;
        color: var(--text);
      }

      .lux-card::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: var(--luxury-border);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      [data-theme='Black'] .lux-card::before {
        background-size: 280% 280%;
        animation: card-border 5s linear infinite;
      }

      @keyframes card-border {
        0% { background-position: 0% 50%; }
        100% { background-position: 280% 50%; }
      }

      .focus-ring:focus {
        outline: 3px solid color-mix(in srgb, var(--accent-2), transparent 50%);
        outline-offset: 3px;
      }

      .app-button {
        background: var(--text);
        color: var(--bg-2);
      }

      [data-theme='Black'] .app-button {
        background: #f6f3ea;
        color: #050506;
      }

      .accent-text { color: var(--accent); }
      .muted-text { color: var(--muted); }
      .accent-bg { background: var(--accent-soft); }
      .line-border { border-color: var(--line); }

      .nfc-listening {
        position: relative;
        overflow: hidden;
      }

      .nfc-listening::after {
        content: '';
        position: absolute;
        inset: -35%;
        background: radial-gradient(circle, color-mix(in srgb, var(--accent-2), transparent 72%) 0%, transparent 58%);
        animation: nfc-pulse 1.6s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes nfc-pulse {
        0%, 100% { opacity: .32; transform: scale(.82); }
        50% { opacity: .9; transform: scale(1); }
      }

      /* ── Premium text shimmer ─────────────────────────────────────────────
         Sweeps a metallic highlight across key figures (name, tier, points).
         Uses background-clip:text so the shine rides on top of the letters.
         The card-border animation above is completely untouched.          ── */
      :root          { --sh1: #c89c3b; --sh2: #fff8e0; --sh3: #f1d38b; }
      [data-theme='Platinum'] { --sh1: #8fb8cc; --sh2: #ffffff; --sh3: #c8e8ff; }
      [data-theme='Black']    { --sh1: #b8b4ac; --sh2: #ffffff; --sh3: #e8e4dc; }

      @keyframes shimmer-text {
        0%   { background-position: 160% center; }
        100% { background-position: -160% center; }
      }

      .shimmer-text {
        background: linear-gradient(
          90deg,
          var(--text)  0%,
          var(--text)  28%,
          var(--sh1)   40%,
          var(--sh2)   50%,
          var(--sh1)   60%,
          var(--text)  72%,
          var(--text)  100%
        );
        background-size: 280% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer-text 5s ease-in-out infinite;
      }

      /* ── Loading card glare sweep ─────────────────────────────────────── */
      @keyframes card-sweep {
        0%   { transform: translateX(-220%) skewX(-18deg); }
        100% { transform: translateX(220%)  skewX(-18deg); }
      }
      @keyframes float-card {
        0%, 100% { transform: translateY(0px) scale(1); }
        50%       { transform: translateY(-8px) scale(1.012); }
      }
      @keyframes dot-pulse {
        0%, 80%, 100% { opacity: .25; transform: scale(.8); }
        40%            { opacity: 1;   transform: scale(1); }
      }
      .loading-card {
        animation: float-card 2.4s ease-in-out infinite;
        overflow: hidden;
      }
      .loading-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255,255,255,.22) 48%,
          rgba(255,255,255,.32) 50%,
          rgba(255,255,255,.22) 52%,
          transparent 70%
        );
        animation: card-sweep 1.9s cubic-bezier(.4,0,.2,1) infinite;
        pointer-events: none;
      }
      .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: dot-pulse 1.4s ease-in-out infinite; }
      .dot:nth-child(2) { animation-delay: .2s; }
      .dot:nth-child(3) { animation-delay: .4s; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script id="app-source" type="text/plain">
      import React, { useEffect, useMemo, useRef, useState } from 'https://esm.sh/react@18.3.1?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client?dev';
      import {
        Award,
        BadgeCheck,
        CalendarDays,
        Check,
        ChevronRight,
        CreditCard,
        Gauge,
        KeyRound,
        Lock,
        LogOut,
        PencilLine,
        Plus,
        RefreshCw,
        Save,
        ScanLine,
        Settings,
        ShieldCheck,
        Smartphone,
        Sparkles,
        Trash2,
        Users,
        WalletCards,
        X,
      } from 'https://esm.sh/lucide-react@0.468.0?deps=react@18.3.1';
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

      // camper_profiles is a Supabase VIEW that includes computed columns like
      // weekly_points, total_points, weekly_event_status. Read from it.
      // campers is the underlying base TABLE. All writes (insert/update/delete)
      // go there — you cannot insert into a view.
      const CAMPER_READ_TABLE  = 'camper_profiles';
      const CAMPER_WRITE_TABLE = 'campers';

      const dailyFields = {
        learn_maamar: 'Maamar',
        learn_chumash: 'Chumash',
        learn_tanya: 'Tanya',
        learn_rambam: 'Rambam',
        learn_hayom_yom: 'Hayom Yom',
        hanhaga_negel_vasser: 'Negel Vasser',
        hanhaga_mikvah: 'Mikvah',
        hanhaga_brochos: 'Brochos & Krias Shema',
        hanhaga_tehillim: 'Tehillim',
        hanhaga_bentching: 'Bentching',
        hanhaga_bendel: 'Bendel',
      };

      const learningKeys = ['learn_maamar', 'learn_chumash', 'learn_tanya', 'learn_rambam', 'learn_hayom_yom'];
      const hanhagaKeys = [
        'hanhaga_negel_vasser',
        'hanhaga_mikvah',
        'hanhaga_brochos',
        'hanhaga_tehillim',
        'hanhaga_bentching',
        'hanhaga_bendel',
      ];
      const blankEntry = Object.fromEntries([...learningKeys, ...hanhagaKeys].map((key) => [key, false]));
      const today = () => new Date().toISOString().slice(0, 10);

      // ── Supabase connection (hardcoded — anon key is safe to be public) ──────
      const SUPABASE_URL  = 'https://mgiwefsbvixlnlokplpj.supabase.co';
      const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1naXdlZnNidml4bG5sb2twbHBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMzcxODYsImV4cCI6MjA5NjcxMzE4Nn0.j7kP1moUmcbBFuf3Iz4yZmlLGdjJf-3yBfbu1HXGF78';
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

      // Admin passcode lives only in localStorage — no server involved.
      function getAdminCode() { return localStorage.getItem('mivtza_admin_code') || ''; }
      function saveAdminCode(code) { localStorage.setItem('mivtza_admin_code', code.trim()); }

      // Admin NFC cards — scanning one on the login screen goes straight to the admin portal.
      function getAdminCards() { try { return JSON.parse(localStorage.getItem('mivtza_admin_cards') || '[]'); } catch { return []; } }
      function saveAdminCards(cards) { localStorage.setItem('mivtza_admin_cards', JSON.stringify(cards)); }

      function classNames(...parts) {
        return parts.filter(Boolean).join(' ');
      }

      // Supabase can hand back a JSON/object value for a column we expect to be
      // a plain string or number (e.g. a jsonb column, or a row shape that
      // doesn't match what the UI assumes). Rendering an object directly as a
      // React child throws "Objects are not valid as a React child" (error
      // #31) and blanks the whole page. This guards every spot that renders a
      // raw Supabase field so a stray object degrades gracefully instead of
      // crashing.
      function displayValue(value) {
        if (value === null || value === undefined) return '';
        if (typeof value === 'object') {
          try {
            return JSON.stringify(value);
          } catch (stringifyError) {
            return String(value);
          }
        }
        return value;
      }

      function normalizeStatus(status) {
        if (!status) return 'Gold';
        const cleaned = String(status).trim().toLowerCase();
        if (cleaned === 'black') return 'Black';
        if (cleaned === 'platinum') return 'Platinum';
        return 'Gold';
      }

      // Different scan methods format NFC IDs differently: Web NFC taps return
      // colon-separated hex like "04:6F:47:56:D1:2A:81", a USB keyboard-wedge
      // reader might emit a plain decimal/alphanumeric string, and an admin
      // might type one in by hand with different casing or spacing. Comparing
      // these with an exact, case-sensitive match means a card registered one
      // way will silently fail to look up if scanned a different way. This
      // strips everything but letters/digits and lowercases, so "04:6F:47..."
      // and "046f47..." are treated as the same card.
      function normalizeNfcId(value) {
        return String(value ?? '')
          .toLowerCase()
          .replace(/[^a-z0-9]/g, '');
      }

      function getWeight(config, field) {
        const candidates = [
          field,
          `${field}_points`,
          field.replace('learn_', 'points_'),
          field.replace('hanhaga_', 'points_'),
        ];
        for (const candidate of candidates) {
          const value = Number(config?.[candidate]);
          if (Number.isFinite(value) && value > 0) return value;
        }
        return learningKeys.includes(field) ? 10 : 0;
      }

      function calculateScore(entry, config) {
        const learningTotal = learningKeys.reduce((sum, key) => sum + (entry[key] ? getWeight(config, key) : 0), 0);
        const hanhagaCount = hanhagaKeys.filter((key) => entry[key]).length;
        return Math.round(learningTotal * (1 + hanhagaCount * 0.05));
      }

      function IconButton({ icon: Icon, label, className = '', ...props }) {
        return (
          <button
            title={label}
            aria-label={label}
            className={classNames('focus-ring inline-flex h-11 w-11 items-center justify-center rounded border line-border transition hover:scale-[1.02]', className)}
            {...props}
          >
            <Icon size={19} />
          </button>
        );
      }

      function TextInput({ icon: Icon, className = '', ...props }) {
        return (
          <label className={classNames('glass-panel flex items-center gap-3 rounded px-3 py-2', className)}>
            {Icon && <Icon size={18} className="muted-text shrink-0" />}
            <input
              className="focus-ring min-w-0 flex-1 bg-transparent py-2 text-sm font-semibold outline-none placeholder:font-medium"
              {...props}
            />
          </label>
        );
      }

      function Shell({ children, status = 'Gold', admin = false, onLogout }) {
        useEffect(() => {
          document.documentElement.dataset.theme = normalizeStatus(status);
        }, [status]);

        return (
          <main className="min-h-screen px-4 py-5 sm:px-6 lg:px-8">
            <div className="mx-auto flex max-w-7xl items-center justify-between pb-5">
              <div className="flex items-center gap-3">
                <div className="lux-card flex h-11 w-16 items-center justify-center rounded shadow-glow">
                  <CreditCard size={24} />
                </div>
                <div>
                  <p className="text-sm font-extrabold uppercase tracking-[0.16em]">Mivtza Amek</p>
                  <p className="muted-text text-xs font-semibold">Learn. Do. Earn. Grow.</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                {admin && <a className="glass-panel rounded px-4 py-2 text-sm font-bold" href="./index.html">Check-In</a>}
                {onLogout && <IconButton icon={LogOut} label="Log out" onClick={onLogout} />}
              </div>
            </div>
            {children}
          </main>
        );
      }

      function PasscodePanel() {
        const [code, setCode] = useState(getAdminCode);
        const [saved, setSaved] = useState(false);
        return (
          <div className="grid gap-3">
            <TextInput
              icon={Lock}
              type="password"
              placeholder="Set admin passcode (leave blank for no lock)"
              value={code}
              onChange={(e) => { setCode(e.target.value); setSaved(false); }}
            />
            <button
              className="app-button focus-ring inline-flex items-center justify-center gap-2 rounded px-5 py-3 font-extrabold"
              onClick={() => { saveAdminCode(code); setSaved(true); }}
            >
              <Save size={18} /> {saved ? 'Saved ✓' : 'Save Passcode'}
            </button>
          </div>
        );
      }

      function LoginScreen({ onCamper, onAdmin }) {
        const [scan, setScan] = useState('');
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState('');
        const [cardNotFound, setCardNotFound] = useState(false);
        const [nfcListening, setNfcListening] = useState(false);
        const [nfcMessage, setNfcMessage] = useState('');
        const [showManual, setShowManual] = useState(false);
        const manualInputRef = useRef(null);
        const ndefRef = useRef(null);
        const scanBufferRef = useRef('');
        const fetchCamperRef = useRef(null);

        // Global keydown listener captures USB/keyboard-wedge scanner strokes without
        // ever focusing an input — so the mobile soft keyboard never appears at all.
        useEffect(() => {
          if (showManual) return; // manual input handles its own typing
          let timer = null;
          const onKey = (e) => {
            if (showManual || busy) return;
            if (e.key === 'Enter') {
              const buf = scanBufferRef.current.trim();
              scanBufferRef.current = '';
              clearTimeout(timer);
              if (buf && fetchCamperRef.current) fetchCamperRef.current(buf);
            } else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
              scanBufferRef.current += e.key;
              clearTimeout(timer);
              timer = setTimeout(() => { scanBufferRef.current = ''; }, 400);
            }
          };
          document.addEventListener('keydown', onKey);
          return () => { document.removeEventListener('keydown', onKey); clearTimeout(timer); };
        }, [showManual, busy]);

        const fetchCamper = async (nfcId) => {
          setBusy(true);
          setError('');
          setCardNotFound(false);
          setNfcMessage('');
          try {
            const target = normalizeNfcId(nfcId);

            // Admin card — local check, no network, no page reload.
            const adminCards = getAdminCards();
            if (adminCards.some((id) => normalizeNfcId(id) === target)) {
              onAdmin();
              setBusy(false);
              return;
            }

            const { data, error: fetchError } = await supabase.from(CAMPER_READ_TABLE).select('*');
            setBusy(false);
            setScan('');
            if (fetchError) { setError(`Connection error: ${fetchError.message}`); return; }
            if (!data || data.length === 0) { setError('No campers found — check Supabase connection.'); return; }
            const match = data.find((row) => normalizeNfcId(row.nfc_id) === target);
            if (!match) { setCardNotFound(true); return; }
            onCamper(match);
          } catch (err) {
            setBusy(false); setScan('');
            setError(`Error: ${err.message}`);
          }
        };

        // Keep ref current so the keydown closure always calls the latest version
        useEffect(() => { fetchCamperRef.current = fetchCamper; });

        const explainNfcError = (scanError) => {
          if (!('NDEFReader' in window)) return 'Web NFC is not available on this browser. Use Android Chrome.';
          if (!window.isSecureContext) return 'Web NFC requires HTTPS. Open via GitHub Pages.';
          if (scanError?.name === 'NotAllowedError') return 'NFC permission denied. Allow NFC in Chrome settings.';
          if (scanError?.name === 'NotReadableError') return 'NFC unavailable — make sure NFC is on in Android settings.';
          return scanError?.message || 'NFC could not start. Check that NFC is enabled.';
        };

        const startPhysicalCardScan = async () => {
          setError(''); setNfcMessage('');
          if (!('NDEFReader' in window) || !window.isSecureContext) {
            setNfcMessage(explainNfcError()); return;
          }
          try {
            const ndef = new NDEFReader();
            ndefRef.current = ndef;
            ndef.onreading = (event) => {
              const serialNumber = event.serialNumber;
              if (!serialNumber) { setNfcMessage('Card read but no serial returned.'); return; }
              setNfcListening(false);
              fetchCamper(serialNumber);
            };
            ndef.onreadingerror = () => setNfcMessage('Read failed — hold card flat against the back.');
            await ndef.scan();
            setNfcListening(true);
            setNfcMessage('Ready — hold card to the back of this device.');
          } catch (scanError) {
            setNfcListening(false);
            setNfcMessage(explainNfcError(scanError));
          }
        };

        return (
          <Shell status="Gold">

            {/* ── Premium loading overlay ── */}
            {busy && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/75 backdrop-blur-md">
                <div className="flex flex-col items-center gap-8">
                  <div className="loading-card lux-card relative w-72 rounded-2xl p-10 shadow-luxury">
                    <div className="flex flex-col items-center gap-5">
                      <CreditCard size={52} className="shimmer-text" strokeWidth={1.5} />
                      <p className="shimmer-text text-xl font-extrabold uppercase tracking-[0.2em]">Verifying</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2 text-white/60">
                    <span className="text-sm font-semibold">Finding cardmember profile</span>
                    <span className="flex gap-1.5 ml-1">
                      <span className="dot" />
                      <span className="dot" />
                      <span className="dot" />
                    </span>
                  </div>
                </div>
              </div>
            )}

            {/* ── Card not registered modal ── */}
            {cardNotFound && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/70 backdrop-blur-md p-6">
                <div className="lux-card w-full max-w-sm rounded-2xl p-8 text-center shadow-luxury">
                  <div className="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-red-500/15 border border-red-400/30">
                    <CreditCard size={32} className="text-red-400" strokeWidth={1.5} />
                  </div>
                  <h2 className="text-2xl font-extrabold">Card Not Registered</h2>
                  <p className="muted-text mt-2 text-sm font-semibold leading-relaxed">
                    This card doesn't have a cardmember profile yet.<br />
                    See your counselor to get registered.
                  </p>
                  <button
                    className="app-button focus-ring mt-6 w-full rounded-xl px-5 py-4 font-extrabold"
                    onClick={() => setCardNotFound(false)}
                  >
                    Got It
                  </button>
                </div>
              </div>
            )}

            <div className="mx-auto grid min-h-[calc(100vh-7rem)] max-w-lg place-items-center">
              <section className="grid w-full gap-6 text-center">
                {/* Branding */}
                <div>
                  <p className="accent-text text-sm font-extrabold uppercase tracking-[0.28em]">Mivtza Amek</p>
                  <h1 className="mt-2 text-4xl font-extrabold sm:text-5xl">Learn. Do. Earn. Grow.</h1>
                </div>

                {/* Card image */}

                      onChange={(e) => setScan(e.target.value)}
                      onKeyDown={(e) => { if (e.key === 'Enter' && scan.trim()) { fetchCamper(scan); setScan(''); } }}
                      autoFocus
                      className="glass-panel focus-ring flex-1 rounded-lg px-5 py-4 text-center text-lg font-bold outline-none shadow-glow"
                      placeholder="Type card ID, press Enter"
                    />
                    {scan && (
                      <button className="app-button focus-ring rounded-lg px-5 py-4 font-extrabold" onClick={() => { fetchCamper(scan); setScan(''); }}>
                        Go
                      </button>
                    )}
                  </div>
                )}

                {error && (
                  <p className="rounded-xl border border-red-400/40 bg-red-500/10 px-4 py-3 text-sm font-semibold text-red-500">
                    {error}
                  </p>
                )}

                {/* Utility row */}
                <div className="flex items-center justify-end gap-2">
                  <button
                    onClick={() => { setShowManual((v) => !v); setTimeout(() => inputRef.current?.focus(), 50); }}
                    className="glass-panel focus-ring inline-flex items-center gap-2 rounded px-3 py-2 text-sm font-bold"
                  >
                    <PencilLine size={15} /> {showManual ? 'Hide' : 'Enter Manually'}
                  </button>
                  {!nfcListening && (
                    <button
                      onClick={startPhysicalCardScan}
                      disabled={busy}
                      className="lux-card focus-ring inline-flex items-center gap-2 rounded px-3 py-2 text-sm font-extrabold shadow-luxury disabled:opacity-70"
                    >
                      <Smartphone size={15} /> Enable NFC
                    </button>
                  )}
                  {nfcListening && (
                    <span className="inline-flex items-center gap-2 rounded px-3 py-2 text-sm font-bold accent-text">
                      <RefreshCw size={14} className="animate-spin" /> NFC Active
                    </span>
                  )}
                </div>
              </section>
            </div>
          </Shell>
        );
      }

      function Stat({ label, value, icon: Icon }) {
        return (
          <div className="glass-panel rounded-lg p-4">
            <div className="mb-2 flex items-center gap-2 muted-text">
              <Icon size={16} />
              <span className="text-xs font-bold uppercase tracking-[0.12em]">{label}</span>
            </div>
            <p className="text-2xl font-extrabold shimmer-text">{displayValue(value) || displayValue(0)}</p>
          </div>
        );
      }

      function CheckboxTile({ checked, label, onChange }) {
        return (
          <button
            type="button"
            onClick={() => onChange(!checked)}
            className={classNames(
              'focus-ring flex min-h-16 items-center gap-3 rounded-lg border p-4 text-left font-bold transition',
              checked ? 'accent-bg line-border shadow-glow' : 'glass-panel hover:scale-[1.01]'
            )}
          >
            <span className={classNames('flex h-7 w-7 shrink-0 items-center justify-center rounded border line-border', checked && 'app-button')}>
              {checked && <Check size={17} />}
            </span>
            {label}
          </button>
        );
      }

      class ErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { error: null }; }
        static getDerivedStateFromError(error) { return { error }; }
        render() {
          if (this.state.error) {
            return (
              <div className="mx-auto mt-10 max-w-lg rounded-lg border border-red-400/40 bg-red-500/10 p-6 text-red-600">
                <p className="text-lg font-extrabold">Something went wrong loading this screen.</p>
                <p className="mt-2 break-all text-sm font-semibold">{this.state.error.message}</p>
                <button className="mt-4 rounded border border-red-400/40 px-4 py-2 font-bold" onClick={() => this.setState({ error: null })}>
                  Try Again
                </button>
              </div>
            );
          }
          return this.props.children;
        }
      }

      function CamperDashboard({ camper, onLogout }) {
        const [entry, setEntry] = useState(blankEntry);
        const [config, setConfig] = useState(null);
        const [approved, setApproved] = useState(false);
        const [error, setError] = useState('');
        const status = normalizeStatus(camper.card_status);

        useEffect(() => {
          supabase.from('mivtza_config').select('*').limit(1).maybeSingle().then(({ data }) => setConfig(data || {}));
        }, []);

        const score = calculateScore(entry, config);

        const submit = async () => {
          setError('');
          const { error: insertError } = await supabase.from('daily_entries').insert({
            camper_id: camper.id,
            entry_date: today(),
            ...entry,
          });
          if (insertError) {
            setError(insertError.message);
            return;
          }
          setApproved(true);
          window.setTimeout(() => {
            setApproved(false);
            onLogout();
          }, 2000);
        };

        return (
          <Shell status={status} onLogout={onLogout}>
            <div className="mx-auto grid max-w-7xl gap-5">
              <section className="lux-card rounded-lg p-5 shadow-luxury">
                <div className="grid gap-4 lg:grid-cols-[1.4fr_.8fr_.8fr_.8fr]">
                  <div>
                    <p className="text-xs font-extrabold uppercase tracking-[0.18em] opacity-70">Cardmember</p>
                    <h1 className="mt-2 text-4xl font-extrabold shimmer-text">{camper.name}</h1>
                  </div>
                  <Stat label="Tier" value={status} icon={WalletCards} />
                  <Stat label="Lifetime" value={camper.total_points} icon={Award} />
                  <Stat label="This Week" value={camper.weekly_points} icon={CalendarDays} />
                </div>
              </section>

              <div className="grid gap-5 lg:grid-cols-[1fr_20rem]">
                <section className="grid gap-5">
                  <div className="glass-panel rounded-lg p-5">
                    <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><Sparkles className="accent-text" /> Learning Points</h2>
                    <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
                      {learningKeys.map((key) => (
                        <CheckboxTile key={key} label={dailyFields[key]} checked={entry[key]} onChange={(value) => setEntry({ ...entry, [key]: value })} />
                      ))}
                    </div>
                  </div>
                  <div className="glass-panel rounded-lg p-5">
                    <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><ShieldCheck className="accent-text" /> Daily Hanhagos</h2>
                    <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
                      {hanhagaKeys.map((key) => (
                        <CheckboxTile key={key} label={dailyFields[key]} checked={entry[key]} onChange={(value) => setEntry({ ...entry, [key]: value })} />
                      ))}
                    </div>
                  </div>
                </section>

                <aside className="glass-panel sticky top-5 h-fit rounded-lg p-5 shadow-luxury">
                  <p className="muted-text text-xs font-extrabold uppercase tracking-[0.16em]">Estimated Daily Score</p>
                  <p className="mt-3 text-6xl font-extrabold">{score}</p>
                  <p className="muted-text mt-3 text-sm font-semibold">Learning total multiplied by 1.00 plus 0.05 for each selected Hanhaga.</p>
                  {error && <p className="mt-4 rounded border border-red-400/40 bg-red-500/10 p-3 text-sm font-semibold text-red-600">{error}</p>}
                  <button className="app-button focus-ring mt-5 flex w-full items-center justify-center gap-2 rounded px-5 py-4 text-lg font-extrabold" onClick={submit}>
                    <BadgeCheck size={22} /> Submit
                  </button>
                </aside>
              </div>
            </div>

            {approved && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/45 p-6">
                <div className="lux-card max-w-md rounded-lg p-8 text-center shadow-luxury">
                  <BadgeCheck className="mx-auto mb-4" size={52} />
                  <h2 className="text-3xl font-extrabold">Transaction Approved</h2>
                  <p className="mt-2 text-lg font-bold">Points Credited</p>
                </div>
              </div>
            )}
          </Shell>
        );
      }

      function AdminGate({ children }) {
        const adminCode = getAdminCode();
        const [code, setCode] = useState('');
        const [unlocked, setUnlocked] = useState(!adminCode || sessionStorage.getItem('mivtza_admin_unlocked') === '1');
        if (unlocked) return children;
        return (
          <Shell admin status="Platinum">
            <div className="mx-auto grid min-h-[60vh] max-w-md place-items-center">
              <div className="glass-panel w-full rounded-lg p-5 shadow-luxury">
                <Lock className="accent-text mb-3" />
                <h1 className="text-2xl font-extrabold">Admin Access</h1>
                <TextInput className="mt-5" icon={KeyRound} type="password" placeholder="Passcode" value={code} onChange={(event) => setCode(event.target.value)} />
                <button
                  className="app-button focus-ring mt-4 w-full rounded px-5 py-3 font-extrabold"
                  onClick={() => {
                    if (code === adminCode) {
                      sessionStorage.setItem('mivtza_admin_unlocked', '1');
                      setUnlocked(true);
                    }
                  }}
                >
                  Unlock
                </button>
              </div>
            </div>
          </Shell>
        );
      }

      function AdminCardsPanel() {
        const [cards, setCards] = useState(getAdminCards);
        const [newId, setNewId] = useState('');
        const [listening, setListening] = useState(false);
        const ndefRef = useRef(null);

        const persist = (next) => { setCards(next); saveAdminCards(next); };

        const addCard = (rawId) => {
          const id = rawId.trim();
          if (!id) return;
          if (cards.includes(id)) { setNewId(''); return; }
          persist([...cards, id]);
          setNewId('');
        };

        const removeCard = (id) => persist(cards.filter((c) => c !== id));

        const startScan = async () => {
          if (!('NDEFReader' in window) || !window.isSecureContext) return;
          try {
            const ndef = new NDEFReader();
            ndefRef.current = ndef;
            ndef.onreading = (e) => {
              const serial = e.serialNumber;
              setListening(false);
              if (serial) addCard(serial);
            };
            await ndef.scan();
            setListening(true);
          } catch { setListening(false); }
        };

        return (
          <div className="glass-panel rounded-lg p-5">
            <h2 className="mb-1 flex items-center gap-2 text-xl font-extrabold"><KeyRound className="accent-text" /> Admin Cards</h2>
            <p className="muted-text mb-4 text-xs font-semibold">Cards scanned here go straight to the admin portal.</p>
            <div className="flex gap-2 mb-3">
              <label className="glass-panel flex flex-1 items-center gap-2 rounded px-3 py-2">
                <ScanLine size={16} className="muted-text shrink-0" />
                <input
                  className="min-w-0 flex-1 bg-transparent text-sm font-semibold outline-none placeholder:font-medium font-mono"
                  placeholder="Card ID"
                  value={newId}
                  onChange={(e) => setNewId(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && addCard(newId)}
                />
              </label>
              <button onClick={() => addCard(newId)} className="app-button focus-ring rounded px-3 py-2 font-extrabold text-sm"><Plus size={16} /></button>
              <button
                onClick={startScan}
                disabled={listening}
                className="lux-card focus-ring inline-flex items-center gap-1 rounded px-3 py-2 text-sm font-extrabold disabled:opacity-70"
              >
                {listening ? <RefreshCw size={14} className="animate-spin" /> : <Smartphone size={14} />}
                {listening ? 'Tap…' : 'Scan'}
              </button>
            </div>
            <div className="grid gap-2">
              {cards.length === 0 && <p className="muted-text text-sm font-semibold">No admin cards registered yet.</p>}
              {cards.map((id) => (
                <div key={id} className="flex items-center justify-between rounded border line-border px-3 py-2">
                  <span className="font-mono text-xs font-semibold">{id}</span>
                  <button onClick={() => removeCard(id)} className="text-red-500 hover:scale-105"><Trash2 size={15} /></button>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function AdminDashboard() {
        const [campers, setCampers] = useState([]);
        const [rules, setRules] = useState({});
        const [loading, setLoading] = useState(true);
        const [message, setMessage] = useState('');
        const [msgType, setMsgType] = useState('info');
        const [rosterSearch, setRosterSearch] = useState('');

        // Registration state
        const [newCamper, setNewCamper] = useState({ name: '', nfc_id: '' });
        const [regNfcListening, setRegNfcListening] = useState(false);
        const regNdefRef = useRef(null);

        // Inline edit state
        const [editRow, setEditRow] = useState(null);

        const [correction, setCorrection] = useState({ camper_id: '', entry_date: today(), ...blankEntry, manual_points_adjustment: 0 });
        const [correctionSearch, setCorrectionSearch] = useState('');
        const [quickPoints, setQuickPoints] = useState('');

        // Roster NFC scan search
        const [rosterNfcListening, setRosterNfcListening] = useState(false);
        const rosterNdefRef = useRef(null);

        // New config rule
        const [newRuleKey, setNewRuleKey] = useState('');
        const [newRuleVal, setNewRuleVal] = useState('');

        const notify = (text, type = 'info') => { setMessage(text); setMsgType(type); };

        const load = async () => {
          setLoading(true);
          const [{ data: roster }, { data: configRow }] = await Promise.all([
            supabase.from(CAMPER_READ_TABLE).select('*').order('name'),
            supabase.from('mivtza_config').select('*').limit(1).maybeSingle(),
          ]);
          setCampers(roster || []);
          setRules(configRow || {});
          setLoading(false);
        };

        useEffect(() => { load(); }, []);

        const vip = campers.filter((c) => Number(c.weekly_points) >= Number(rules.vip_event_threshold ?? 700));
        const standard = campers.filter((c) => Number(c.weekly_points) >= Number(rules.standard_event_threshold ?? 400) && Number(c.weekly_points) < Number(rules.vip_event_threshold ?? 700));
        const notEligible = campers.filter((c) => Number(c.weekly_points) < Number(rules.standard_event_threshold ?? 400));

        // ── NFC scan for registration ───────────────────────────────────────
        const startRegNfcScan = async () => {
          if (!('NDEFReader' in window) || !window.isSecureContext) {
            notify('Web NFC not available here — type the card ID manually.', 'error');
            return;
          }
          try {
            const ndef = new NDEFReader();
            regNdefRef.current = ndef;
            ndef.onreading = (event) => {
              const serial = event.serialNumber;
              setRegNfcListening(false);
              if (serial) {
                setNewCamper((prev) => ({ ...prev, nfc_id: serial }));
                notify(`Card scanned: ${serial}`);
              } else {
                notify('Card read but no serial number returned.', 'error');
              }
            };
            await ndef.scan();
            setRegNfcListening(true);
            notify('Tap the card to the back of the device…');
          } catch (err) {
            setRegNfcListening(false);
            notify(err.message || 'NFC scan failed.', 'error');
          }
        };

        // ── Register ────────────────────────────────────────────────────────
        const registerCamper = async () => {
          if (!newCamper.name.trim()) { notify('Please enter a camper name.', 'error'); return; }
          if (!newCamper.nfc_id.trim()) { notify('Please enter or scan a card ID.', 'error'); return; }
          const payload = {
            name: newCamper.name.trim(),
            nfc_id: newCamper.nfc_id.trim(),
          };
          try {
            const { error } = await supabase.from(CAMPER_WRITE_TABLE).insert(payload);
            if (error) {
              notify(`Register failed: ${error.message}`, 'error');
            } else {
              setNewCamper({ name: '', nfc_id: '' });
              notify('Camper registered ✓');
              load();
            }
          } catch (networkErr) {
            const isNetworkFail = networkErr instanceof TypeError && networkErr.message.includes('fetch');
            notify(
              isNetworkFail
                ? 'Network error — could not reach Supabase. Check: (1) internet connection, (2) the Supabase URL in Backend Settings is correct and starts with https://, (3) the anon key is correct.'
                : `Unexpected error: ${networkErr.message}`,
              'error'
            );
          }
        };

        // ── Delete ──────────────────────────────────────────────────────────
        const deleteCamper = async (camper) => {
          if (!window.confirm(`Delete "${camper.name}"? This cannot be undone.`)) return;
          const { error } = await supabase.from(CAMPER_WRITE_TABLE).delete().eq('id', camper.id);
          if (error) {
            notify(`Delete failed: ${error.message}`, 'error');
          } else {
            notify(`${camper.name} deleted.`);
            load();
          }
        };

        // ── Inline edit save ────────────────────────────────────────────────
        const saveEdit = async () => {
          if (!editRow) return;
          const { error } = await supabase
            .from(CAMPER_WRITE_TABLE)
            .update({ name: editRow.name, nfc_id: editRow.nfc_id })
            .eq('id', editRow.id);
          if (error) {
            notify(`Save failed: ${error.message}`, 'error');
          } else {
            setEditRow(null);
            notify('Camper updated ✓');
            load();
          }
        };

        // ── Correction ──────────────────────────────────────────────────────
        const saveCorrection = async () => {
          const selected = campers.find((c) => String(c.id) === String(correction.camper_id));
          if (!selected) return;
          const entryPayload = { camper_id: selected.id, entry_date: correction.entry_date };
          [...learningKeys, ...hanhagaKeys].forEach((key) => (entryPayload[key] = correction[key]));
          const { error: entryError } = await supabase.from('daily_entries').upsert(entryPayload, { onConflict: 'camper_id,entry_date' });
          const { error: camperError } = await supabase
            .from(CAMPER_WRITE_TABLE)
            .update({ manual_points_adjustment: Number(correction.manual_points_adjustment || 0) })
            .eq('id', selected.id);
          notify(entryError?.message || camperError?.message || 'Correction saved ✓', (entryError || camperError) ? 'error' : 'info');
          load();
        };

        const saveRules = async () => {
          const payload = { ...rules };
          const id = payload.id;
          const query = id ? supabase.from('mivtza_config').update(payload).eq('id', id) : supabase.from('mivtza_config').upsert(payload);
          const { error } = await query;
          notify(error ? `Save failed: ${error.message}` : 'System rules saved ✓', error ? 'error' : 'info');
          load();
        };

        const addRule = () => {
          const key = newRuleKey.trim();
          if (!key) return;
          setRules({ ...rules, [key]: newRuleVal });
          setNewRuleKey(''); setNewRuleVal('');
        };

        const deleteRule = (key) => {
          const next = { ...rules };
          delete next[key];
          setRules(next);
        };

        const startRosterNfcScan = async () => {
          if (!('NDEFReader' in window) || !window.isSecureContext) {
            notify('Web NFC not available — type in the search box instead.', 'error'); return;
          }
          try {
            const ndef = new NDEFReader();
            rosterNdefRef.current = ndef;
            ndef.onreading = (event) => {
              const serial = event.serialNumber;
              setRosterNfcListening(false);
              if (serial) setRosterSearch(serial);
            };
            await ndef.scan();
            setRosterNfcListening(true);
          } catch (err) {
            setRosterNfcListening(false);
            notify(`NFC error: ${err.message}`, 'error');
          }
        };

        const adjustPoints = async (delta) => {
          const selected = campers.find((c) => String(c.id) === String(correction.camper_id));
          if (!selected) { notify('Select a camper first.', 'error'); return; }
          const pts = Number(quickPoints);
          if (!pts) { notify('Enter a points amount.', 'error'); return; }
          const current = Number(selected.manual_points_adjustment || 0);
          const next = current + (delta * pts);
          const { error } = await supabase.from(CAMPER_WRITE_TABLE).update({ manual_points_adjustment: next }).eq('id', selected.id);
          if (error) { notify(`Failed: ${error.message}`, 'error'); } else { notify(`${delta > 0 ? '+' : ''}${delta * pts} pts applied to ${selected.name} ✓`); load(); }
        };

        const msgClass = msgType === 'error'
          ? 'border-red-400/40 bg-red-500/10 text-red-600'
          : 'glass-panel';

        return (
          <Shell admin status="Platinum">
            <div className="mx-auto grid max-w-7xl gap-5">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h1 className="text-3xl font-extrabold">Private Admin Dashboard</h1>
                  <p className="muted-text font-semibold">Roster, event eligibility, corrections, and global rules.</p>
                </div>
                <IconButton icon={RefreshCw} label="Refresh data" onClick={load} className={loading ? 'animate-spin' : ''} />
              </div>

              {message && (
                <div className={`flex items-center justify-between rounded-lg border p-4 font-semibold ${msgClass}`}>
                  <span>{message}</span>
                  <button onClick={() => setMessage('')}><X size={18} /></button>
                </div>
              )}

              {/* ── Roster ── */}
              <section className="glass-panel overflow-hidden rounded-lg shadow-luxury">
                <div className="flex flex-wrap items-center gap-3 border-b line-border p-4">
                  <Users className="accent-text shrink-0" />
                  <h2 className="text-xl font-extrabold">Camper Roster</h2>
                  <label className="ml-auto flex items-center gap-2 glass-panel rounded px-3 py-2 min-w-[200px]">
                    <ScanLine size={16} className="muted-text shrink-0" />
                    <input
                      className="bg-transparent text-sm font-semibold outline-none w-full placeholder:font-medium"
                      placeholder="Search by name or card ID…"
                      value={rosterSearch}
                      onChange={(e) => setRosterSearch(e.target.value)}
                    />
                    {rosterSearch && <button onClick={() => setRosterSearch('')}><X size={14} /></button>}
                  </label>
                  <button
                    onClick={startRosterNfcScan}
                    disabled={rosterNfcListening}
                    className="lux-card focus-ring inline-flex items-center gap-2 rounded px-3 py-2 text-sm font-extrabold disabled:opacity-70"
                    title="Scan card to find camper"
                  >
                    {rosterNfcListening ? <RefreshCw size={14} className="animate-spin" /> : <Smartphone size={14} />}
                    {rosterNfcListening ? 'Scanning…' : 'Scan to Find'}
                  </button>
                  <span className="muted-text text-xs font-semibold">
                    {campers.filter(c => !rosterSearch || c.name?.toLowerCase().includes(rosterSearch.toLowerCase()) || normalizeNfcId(c.nfc_id).includes(normalizeNfcId(rosterSearch))).length} / {campers.length}
                  </span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full min-w-[900px] text-left text-sm">
                    <thead className="accent-bg">
                      <tr>
                        {['Name', 'NFC ID', 'Card Status', 'Weekly Pts', 'Lifetime Pts', 'Event Status', ''].map((head) => (
                          <th key={head} className="px-4 py-3 font-extrabold">{head}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {campers.filter(c => !rosterSearch || c.name?.toLowerCase().includes(rosterSearch.toLowerCase()) || normalizeNfcId(c.nfc_id).includes(normalizeNfcId(rosterSearch))).map((camper) => {
                        const isEditing = editRow?.id === camper.id;
                        return (
                          <tr key={camper.id} className="border-t line-border">
                            <td className="px-4 py-2">
                              {isEditing
                                ? <input className="w-full rounded border line-border bg-transparent px-2 py-1 font-bold" value={editRow.name} onChange={(e) => setEditRow({ ...editRow, name: e.target.value })} />
                                : <span className="font-bold">{camper.name}</span>}
                            </td>
                            <td className="px-4 py-2">
                              {isEditing
                                ? <input className="w-full rounded border line-border bg-transparent px-2 py-1 font-mono text-xs" value={editRow.nfc_id} onChange={(e) => setEditRow({ ...editRow, nfc_id: e.target.value })} />
                                : <span className="font-mono text-xs">{camper.nfc_id}</span>}
                            </td>
                            <td className="px-4 py-2">
                              {displayValue(camper.card_status)}
                            </td>
                            <td className="px-4 py-2">{displayValue(camper.weekly_points)}</td>
                            <td className="px-4 py-2">{displayValue(camper.total_points)}</td>
                            <td className="px-4 py-2">{displayValue(camper.weekly_event_status)}</td>
                            <td className="px-4 py-2">
                              <div className="flex items-center gap-1">
                                {isEditing ? (
                                  <>
                                    <button onClick={saveEdit} className="focus-ring inline-flex h-8 w-8 items-center justify-center rounded border line-border hover:scale-105" title="Save"><Save size={15} /></button>
                                    <button onClick={() => setEditRow(null)} className="focus-ring inline-flex h-8 w-8 items-center justify-center rounded border line-border hover:scale-105" title="Cancel"><X size={15} /></button>
                                  </>
                                ) : (
                                  <>
                                    <button onClick={() => setEditRow({ ...camper })} className="focus-ring inline-flex h-8 w-8 items-center justify-center rounded border line-border hover:scale-105" title="Edit"><PencilLine size={15} /></button>
                                    <button onClick={() => deleteCamper(camper)} className="focus-ring inline-flex h-8 w-8 items-center justify-center rounded border border-red-400/40 text-red-500 hover:scale-105" title="Delete"><Trash2 size={15} /></button>
                                  </>
                                )}
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </section>

              <section className="grid gap-4 lg:grid-cols-3">
                <AccessList title="VIP Event Access" icon={Sparkles} campers={vip} />
                <AccessList title="Standard Event Access" icon={BadgeCheck} campers={standard} />
                <AccessList title="Not Eligible" icon={X} campers={notEligible} />
              </section>

              <section className="grid gap-5 lg:grid-cols-3">
                {/* ── Register Camper ── */}
                <div className="glass-panel rounded-lg p-5">
                  <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><Plus className="accent-text" /> Register Camper</h2>
                  <div className="grid gap-3">
                    <TextInput icon={Users} placeholder="Camper name" value={newCamper.name} onChange={(e) => setNewCamper({ ...newCamper, name: e.target.value })} />
                    <div className="flex gap-2">
                      <label className="glass-panel flex flex-1 items-center gap-3 rounded px-3 py-2">
                        <ScanLine size={18} className="muted-text shrink-0" />
                        <input
                          className="focus-ring min-w-0 flex-1 bg-transparent py-2 text-sm font-semibold outline-none placeholder:font-medium font-mono"
                          placeholder="Card ID (scan or type)"
                          value={newCamper.nfc_id}
                          onChange={(e) => setNewCamper({ ...newCamper, nfc_id: e.target.value })}
                        />
                      </label>
                      <button
                        onClick={startRegNfcScan}
                        disabled={regNfcListening}
                        className="lux-card focus-ring flex items-center gap-2 rounded px-4 py-2 text-sm font-extrabold disabled:opacity-70"
                        title="Tap card to scan NFC"
                      >
                        {regNfcListening ? <RefreshCw size={16} className="animate-spin" /> : <Smartphone size={16} />}
                        {regNfcListening ? 'Listening…' : 'Tap Card'}
                      </button>
                    </div>
                    <button className="app-button focus-ring rounded px-5 py-3 font-extrabold" onClick={registerCamper}>Register Camper</button>
                  </div>
                </div>

                {/* ── Admin Cards ── */}
                <AdminCardsPanel />

                <div className="glass-panel rounded-lg p-5">
                  <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><Settings className="accent-text" /> Admin Passcode</h2>
                  <PasscodePanel />
                </div>
              </section>

              <section className="glass-panel rounded-lg p-5">
                <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><PencilLine className="accent-text" /> Data Correction Panel</h2>

                {/* Camper search + select */}
                <div className="mb-3 grid gap-3 lg:grid-cols-[1fr_auto]">
                  <div className="grid gap-2">
                    <label className="glass-panel flex items-center gap-2 rounded px-3 py-2">
                      <ScanLine size={16} className="muted-text shrink-0" />
                      <input
                        className="bg-transparent text-sm font-semibold outline-none w-full placeholder:font-medium"
                        placeholder="Filter campers by name…"
                        value={correctionSearch}
                        onChange={(e) => setCorrectionSearch(e.target.value)}
                      />
                      {correctionSearch && <button onClick={() => setCorrectionSearch('')}><X size={14} /></button>}
                    </label>
                    <select
                      className="focus-ring rounded border line-border bg-transparent px-3 py-3 font-bold"
                      value={correction.camper_id}
                      onChange={(e) => setCorrection({ ...correction, camper_id: e.target.value })}
                    >
                      <option value="">Select camper</option>
                      {campers
                        .filter(c => !correctionSearch || c.name?.toLowerCase().includes(correctionSearch.toLowerCase()))
                        .map((c) => <option key={c.id} value={c.id}>{c.name} — {displayValue(c.weekly_points)} pts this week</option>)}
                    </select>
                  </div>
                  <input className="focus-ring rounded border line-border bg-transparent px-3 py-3 font-bold" type="date" value={correction.entry_date} onChange={(e) => setCorrection({ ...correction, entry_date: e.target.value })} />
                </div>

                {/* Quick point adjustment */}
                <div className="mb-4 glass-panel rounded-lg p-4">
                  <p className="muted-text mb-2 text-xs font-extrabold uppercase tracking-[0.1em]">Quick Points Adjustment</p>
                  <div className="flex items-center gap-2">
                    <input
                      className="focus-ring w-32 rounded border line-border bg-transparent px-3 py-2 font-bold text-center"
                      type="number"
                      min="0"
                      placeholder="Points"
                      value={quickPoints}
                      onChange={(e) => setQuickPoints(e.target.value)}
                    />
                    <button className="app-button focus-ring inline-flex items-center gap-1 rounded px-4 py-2 font-extrabold" onClick={() => adjustPoints(1)}>
                      <Plus size={16} /> Add
                    </button>
                    <button className="focus-ring inline-flex items-center gap-1 rounded border border-red-400/40 bg-red-500/10 px-4 py-2 font-extrabold text-red-600" onClick={() => adjustPoints(-1)}>
                      <X size={16} /> Subtract
                    </button>
                    <input className="focus-ring ml-auto w-28 rounded border line-border bg-transparent px-3 py-2 font-bold text-center" type="number" placeholder="Manual pts" value={correction.manual_points_adjustment} onChange={(e) => setCorrection({ ...correction, manual_points_adjustment: e.target.value })} />
                    <span className="muted-text text-xs font-semibold">set total</span>
                  </div>
                </div>

                {/* Daily checkboxes */}
                <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                  {[...learningKeys, ...hanhagaKeys].map((key) => (
                    <CheckboxTile key={key} label={dailyFields[key]} checked={correction[key]} onChange={(value) => setCorrection({ ...correction, [key]: value })} />
                  ))}
                </div>
                <button className="app-button focus-ring mt-4 inline-flex items-center gap-2 rounded px-5 py-3 font-extrabold" onClick={saveCorrection}><Save size={18} /> Save Entry + Manual Pts</button>
              </section>

              <section className="glass-panel rounded-lg p-5">
                <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><Gauge className="accent-text" /> System Config Rules</h2>

                {/* Add new rule */}
                <div className="mb-4 flex flex-wrap gap-2 items-center">
                  <input
                    className="focus-ring flex-1 min-w-[140px] rounded border line-border bg-transparent px-3 py-2 font-bold text-sm"
                    placeholder="Rule name (e.g. points_maamar)"
                    value={newRuleKey}
                    onChange={(e) => setNewRuleKey(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && addRule()}
                  />
                  <input
                    className="focus-ring w-32 rounded border line-border bg-transparent px-3 py-2 font-bold text-sm"
                    placeholder="Value"
                    value={newRuleVal}
                    onChange={(e) => setNewRuleVal(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && addRule()}
                  />
                  <button className="app-button focus-ring inline-flex items-center gap-1 rounded px-4 py-2 font-extrabold text-sm" onClick={addRule}>
                    <Plus size={15} /> Add Rule
                  </button>
                </div>

                {/* Existing rules */}
                <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                  {Object.entries(rules).filter(([k]) => k !== 'id').map(([key, value]) => (
                    <div key={key} className="grid gap-1">
                      <div className="flex items-center justify-between">
                        <span className="muted-text text-xs font-extrabold uppercase tracking-[0.1em]">{key}</span>
                        <button onClick={() => deleteRule(key)} className="text-red-500 hover:scale-110" title="Delete rule"><Trash2 size={12} /></button>
                      </div>
                      <input
                        className="focus-ring rounded border line-border bg-transparent px-3 py-2 font-bold text-sm"
                        value={value ?? ''}
                        onChange={(e) => setRules({ ...rules, [key]: e.target.value })}
                      />
                    </div>
                  ))}
                </div>
                <div className="mt-4 flex gap-3">
                  <button className="app-button focus-ring inline-flex items-center gap-2 rounded px-5 py-3 font-extrabold" onClick={saveRules}><Save size={18} /> Save All Rules</button>
                </div>
              </section>
            </div>
          </Shell>
        );
      }

      function AccessList({ title, icon: Icon, campers }) {
        return (
          <div className="glass-panel rounded-lg p-5">
            <h2 className="mb-4 flex items-center gap-2 text-lg font-extrabold"><Icon className="accent-text" /> {title}</h2>
            <div className="grid gap-2">
              {campers.length === 0 && <p className="muted-text text-sm font-semibold">No campers in this group.</p>}
              {campers.map((camper) => (
                <div key={camper.id} className="flex items-center justify-between rounded border line-border px-3 py-2">
                  <span className="font-bold">{camper.name}</span>
                  <span className="muted-text text-sm font-semibold">{displayValue(camper.weekly_points)} pts</span>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function App() {
        const [camper, setCamper] = useState(null);
        const [adminMode, setAdminMode] = useState(false);
        const isAdmin = adminMode || window.location.pathname.endsWith('/admin') || window.location.search.includes('admin');

        const goAdmin = () => {
          sessionStorage.setItem('mivtza_admin_unlocked', '1');
          setAdminMode(true);
        };

        if (isAdmin) {
          return (
            <AdminGate>
              <AdminDashboard />
            </AdminGate>
          );
        }

        if (camper) return <ErrorBoundary><CamperDashboard camper={camper} onLogout={() => setCamper(null)} /></ErrorBoundary>;
        return <LoginScreen onCamper={setCamper} onAdmin={goAdmin} />;
      }

      createRoot(document.getElementById('root')).render(<App />);
    </script>

    <script>
      // The auto "text/babel" script-tag scanner only lets us pass bare preset
      // names (no options), and the React preset's default "automatic" JSX
      // runtime tries to import the bare specifier "react/jsx-runtime", which
      // the browser can't resolve without an import map. So we transform
      // manually here, forcing the classic runtime (React.createElement),
      // and inject the result as a real <script type="module">.
      (function bootstrap() {
        const source = document.getElementById('app-source').textContent;
        const { code } = Babel.transform(source, {
          presets: [['react', { runtime: 'classic' }]],
          sourceType: 'unambiguous',
          filename: 'app.jsx',
        });
        const blob = new Blob([code], { type: 'text/javascript' });
        const script = document.createElement('script');
        script.type = 'module';
        script.src = URL.createObjectURL(blob);
        document.body.appendChild(script);
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(
            (reg) => console.log('[Mivtza] SW registered, scope:', reg.scope),
            (err) => console.warn('[Mivtza] SW registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
