<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mivtzah Sventzich</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hides the input box but keeps it focusable for the NFC wedge */
        .nfc-invisible { opacity: 0; position: absolute; top: -100px; }
        /* Smooth transitions */
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased overflow-hidden selection:bg-blue-200">

    <!-- 1. LOGIN SCREEN -->
    <div id="view-login" class="view-section flex flex-col items-center justify-center h-screen bg-white">
        <div class="text-center max-w-md p-8">
            <!-- Placeholder for Rebbe Picture -->
            <img src="https://chabad.org/images/new/placeholder.jpg" alt="The Rebbe" class="w-64 h-80 object-cover mx-auto rounded shadow-lg mb-6 border-4 border-gray-200" id="rebbe-img">
            
            <!-- YKP Logo Placeholder -->
            <h1 class="text-3xl font-bold text-blue-900 mb-2 tracking-tight">Yeshivas Kayitz Program</h1>
            <h2 class="text-xl text-gray-500 mb-8 font-medium">Mivtzah Sventzich</h2>
            
            <p class="text-gray-400 text-sm animate-pulse">Tap your card to log in...</p>
            
            <!-- Hidden Input for NFC Wedge -->
            <!-- Keyboard wedges type the ID and automatically press "Enter" -->
            <input type="text" id="nfc-input" class="nfc-invisible" autofocus autocomplete="off">
        </div>
    </div>

    <!-- 2. CAMPER DASHBOARD -->
    <div id="view-camper" class="view-section hidden flex flex-col h-screen bg-gray-50 fade-in">
        <div class="bg-blue-900 text-white p-6 shadow-md flex justify-between items-center rounded-b-2xl">
            <div>
                <h2 class="text-2xl font-bold" id="camper-name-display">Welcome!</h2>
                <p class="text-blue-200 text-sm">Today's Duch</p>
            </div>
            <div class="text-right">
                <p class="text-sm text-blue-200">Total Points</p>
                <p class="text-4xl font-black text-yellow-400" id="camper-points-display">0</p>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-6">
            <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <form id="duch-form" class="space-y-6"></form>
            </div>
        </div>

        <div class="p-6 bg-white border-t border-gray-200">
            <button onclick="submitDuch()" class="w-full max-w-2xl mx-auto block bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg text-xl transition-transform active:scale-95">
                Submit Duch
            </button>
        </div>
    </div>

    <!-- 3. ADMIN DASHBOARD (Accessed via URL #admin) -->
    <div id="view-admin" class="view-section hidden h-screen overflow-y-auto bg-gray-100 p-8 fade-in">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Admin Panel: Mivtzah Sventzich</h1>
                <button onclick="window.location.hash=''" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded">Back to Login</button>
            </div>

            <!-- Dashboard Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- Manage Campers -->
                <div class="col-span-2 bg-white p-6 rounded-lg shadow-sm border">
                    <h2 class="text-xl font-bold mb-4">Campers & Event Eligibility</h2>
                    <div class="mb-4 flex gap-2">
                        <input type="text" id="new-camper-name" placeholder="Camper Name" class="border p-2 rounded w-1/3">
                        <input type="text" id="new-camper-nfc" placeholder="NFC ID (Scan card)" class="border p-2 rounded w-1/3">
                        <button onclick="addCamper()" class="bg-green-600 text-white px-4 py-2 rounded font-bold">Add Camper</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-gray-600 text-sm">
                                    <th class="p-3 border-b">Name</th>
                                    <th class="p-3 border-b">NFC ID</th>
                                    <th class="p-3 border-b">Points</th>
                                    <th class="p-3 border-b">Status</th>
                                    <th class="p-3 border-b">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-campers-list"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Settings & Threshold -->
                <div class="bg-white p-6 rounded-lg shadow-sm border">
                    <h2 class="text-xl font-bold mb-4">Configuration</h2>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Weekly Event Threshold</label>
                    <div class="flex gap-2 mb-6">
                        <input type="number" id="threshold-input" class="border p-2 rounded w-full">
                        <button onclick="saveThreshold()" class="bg-blue-600 text-white px-4 py-2 rounded">Save</button>
                    </div>

                    <h3 class="font-bold text-gray-700 mb-2">Questions & Values</h3>
                    <div id="admin-questions-list" class="space-y-3 mb-4"></div>
                    <button class="text-blue-600 text-sm font-bold" onclick="alert('In this version, questions are edited directly in the code or state object to prevent accidental deletion.')">Edit Questions (Advanced)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP OVERLAY -->
    <div id="success-popup" class="hidden fixed inset-0 bg-blue-900 bg-opacity-90 flex items-center justify-center z-50">
        <div class="text-center fade-in">
            <div class="text-white text-6xl mb-4">✅</div>
            <h2 class="text-4xl font-black text-white tracking-wide">Submitted!</h2>
            <p class="text-blue-200 mt-2 text-xl" id="points-earned-msg"></p>
        </div>
    </div>

    <script>
        // --- 1. STATE MANAGEMENT (localStorage) ---
        const defaultState = {
            campers: [
                { id: "12345", name: "Mendy Cohen", points: 15, history: {} } // history matches YYYY-MM-DD
            ],
            config: {
                threshold: 20,
                questions: [
                    { id: "q1", text: "Learned Chitas", value: 5 },
                    { id: "q2", text: "Davened Shacharis with Minyan", value: 5 },
                    { id: "q3", text: "Said Bentching from a Siddur", value: 3 },
                    { id: "q4", text: "Kept room clean", value: 2 },
                    { id: "q5", text: "Helped another camper", value: 5 },
                    { id: "q6", text: "Learned Tanya outside", value: 5 }
                ]
            }
        };

        let db = JSON.parse(localStorage.getItem('mivtzah_db')) || defaultState;
        let currentCamper = null;
        const today = new Date().toISOString().split('T')[0];

        function saveData() { localStorage.setItem('mivtzah_db', JSON.stringify(db)); }

        // --- 2. ROUTING & UI VIEWS ---
        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            
            if(viewId === 'view-login') {
                currentCamper = null; // Clear state
                const nfcInput = document.getElementById('nfc-input');
                nfcInput.value = '';
                nfcInput.focus();
            } else if (viewId === 'view-admin') {
                renderAdmin();
            }
        }

        window.addEventListener('hashchange', () => {
            if(window.location.hash === '#admin') showView('view-admin');
            else showView('view-login');
        });

        // --- 3. NFC LOGIN LOGIC ---
        const nfcInput = document.getElementById('nfc-input');
        
        // Keep input constantly focused for the scanner
        document.getElementById('view-login').addEventListener('click', () => nfcInput.focus());
        nfcInput.addEventListener('blur', () => {
            if(window.location.hash !== '#admin' && !currentCamper) nfcInput.focus();
        });

        nfcInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const scanId = nfcInput.value.trim();
                const camper = db.campers.find(c => c.id === scanId);
                
                if (camper) {
                    currentCamper = camper;
                    buildCamperDashboard();
                    showView('view-camper');
                } else {
                    alert('Card not recognized. See an admin.');
                    nfcInput.value = '';
                }
            }
        });

        // --- 4. CAMPER DASHBOARD LOGIC ---
        function buildCamperDashboard() {
            document.getElementById('camper-name-display').innerText = `Welcome, ${currentCamper.name}!`;
            document.getElementById('camper-points-display').innerText = currentCamper.points;
            
            const form = document.getElementById('duch-form');
            form.innerHTML = '';

            // Check if already submitted today
            if(currentCamper.history[today]) {
                form.innerHTML = `<div class="text-center p-8 text-gray-500"><p class="text-xl font-bold">You already submitted today's Duch!</p><p>Come back tomorrow.</p></div>`;
                document.querySelector('#view-camper button').style.display = 'none';
                setTimeout(() => window.location.hash = '', 3000); // Auto kick out after 3s
                return;
            }

            document.querySelector('#view-camper button').style.display = 'block';

            db.config.questions.forEach((q, idx) => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between p-3 bg-gray-50 rounded border border-gray-100';
                row.innerHTML = `
                    <label class="text-lg font-medium text-gray-700 flex-1" for="toggle-${idx}">${q.text} <span class="text-sm text-gray-400 ml-2">(+${q.value} pts)</span></label>
                    <input type="checkbox" id="toggle-${idx}" data-val="${q.value}" class="w-8 h-8 text-blue-600 rounded focus:ring-blue-500">
                `;
                form.appendChild(row);
            });
        }

        function submitDuch() {
            if(!currentCamper) return;
            
            const checkboxes = document.querySelectorAll('#duch-form input[type="checkbox"]');
            let pointsEarned = 0;
            let answers = [];

            checkboxes.forEach(cb => {
                answers.push(cb.checked);
                if(cb.checked) pointsEarned += parseInt(cb.getAttribute('data-val'));
            });

            // Update State
            currentCamper.points += pointsEarned;
            currentCamper.history[today] = answers;
            saveData();

            // Show Success UI
            document.getElementById('points-earned-msg').innerText = `You earned ${pointsEarned} points today!`;
            const popup = document.getElementById('success-popup');
            popup.classList.remove('hidden');

            setTimeout(() => {
                popup.classList.add('hidden');
                showView('view-login');
            }, 2500);
        }

        // --- 5. ADMIN LOGIC ---
        function renderAdmin() {
            document.getElementById('threshold-input').value = db.config.threshold;
            
            const tbody = document.getElementById('admin-campers-list');
            tbody.innerHTML = '';
            
            // Sort by points descending
            const sortedCampers = [...db.campers].sort((a,b) => b.points - a.points);

            sortedCampers.forEach(c => {
                const isEligible = c.points >= db.config.threshold;
                const statusHtml = isEligible 
                    ? `<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-bold">Eligible</span>` 
                    : `<span class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-bold">Short ${db.config.threshold - c.points} pts</span>`;

                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 font-medium">${c.name}</td>
                        <td class="p-3 text-sm text-gray-500">${c.id}</td>
                        <td class="p-3 font-bold">${c.points}</td>
                        <td class="p-3">${statusHtml}</td>
                        <td class="p-3">
                            <button onclick="overridePoints('${c.id}')" class="text-blue-600 text-sm mr-2 hover:underline">Edit Points</button>
                            <button onclick="deleteCamper('${c.id}')" class="text-red-600 text-sm hover:underline">Remove</button>
                        </td>
                    </tr>
                `;
            });

            // Render Questions List
            const qList = document.getElementById('admin-questions-list');
            qList.innerHTML = db.config.questions.map(q => 
                `<div class="flex justify-between text-sm border-b pb-1"><span>${q.text}</span> <span class="font-bold text-gray-500">${q.value} pts</span></div>`
            ).join('');
        }

        function addCamper() {
            const name = document.getElementById('new-camper-name').value.trim();
            const id = document.getElementById('new-camper-nfc').value.trim();
            if(!name || !id) return alert("Need name and NFC ID");
            if(db.campers.find(c => c.id === id)) return alert("NFC ID already in use!");
            
            db.campers.push({ id, name, points: 0, history: {} });
            saveData();
            document.getElementById('new-camper-name').value = '';
            document.getElementById('new-camper-nfc').value = '';
            renderAdmin();
        }

        function overridePoints(id) {
            const camper = db.campers.find(c => c.id === id);
            const newPts = prompt(`Enter new total points for ${camper.name}:`, camper.points);
            if(newPts !== null && !isNaN(newPts)) {
                camper.points = parseInt(newPts);
                saveData();
                renderAdmin();
            }
        }

        function deleteCamper(id) {
            if(confirm("Are you sure you want to delete this camper entirely?")) {
                db.campers = db.campers.filter(c => c.id !== id);
                saveData();
                renderAdmin();
            }
        }

        function saveThreshold() {
            db.config.threshold = parseInt(document.getElementById('threshold-input').value);
            saveData();
            renderAdmin();
        }

        // Init
        if(window.location.hash === '#admin') showView('view-admin');
        else showView('view-login');

    </script>
</body>
</html>
