                          <CheckboxTile key={item.db_key} label={`${item.label} · ${item.points}pts`} checked={entry[item.db_key]||false} onChange={(v) => setEntry({...entry, [item.db_key]: v})} />
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Teacher items */}
                  {(appConfig.teacher_items||[]).length > 0 && (
                    <div className="glass-panel rounded-xl p-5">
                      <h3 className="mb-3 flex items-center gap-2 font-extrabold"><BadgeCheck className="accent-text" size={18}/> Teacher Credits</h3>
                      <div className="grid gap-3 sm:grid-cols-2">
                        {(appConfig.teacher_items||[]).map((item) => (
                          <CheckboxTile key={item.db_key} label={`${item.label}${item.points ? ` · ${item.points}pts` : ''}`} checked={entry[item.db_key]||false} onChange={(v) => setEntry({...entry, [item.db_key]: v})} />
                        ))}
                      </div>
                    </div>
                  )}

                  {(appConfig.learning_items||[]).length === 0 && (appConfig.teacher_items||[]).length === 0 && (
                    <p className="glass-panel rounded-xl p-5 text-sm font-semibold muted-text">No learning or teacher items configured. Add them in Admin → App Configuration.</p>
                  )}

                  <div className="grid gap-3 sm:grid-cols-2">
                    <button onClick={() => submit(false)} className="app-button focus-ring flex w-full items-center justify-center gap-2 rounded-xl px-5 py-5 text-lg font-extrabold">
                      {submitted ? <><BadgeCheck size={22}/> Saved!</> : <><Save size={22}/> Save & Next Student</>}
                    </button>
                    <button onClick={() => submit(true)} className="lux-card focus-ring flex w-full items-center justify-center gap-2 rounded-xl px-5 py-5 text-lg font-extrabold shadow-luxury" title="Save this entry and keep this camper open so you can pick another date">
                      {submitted ? <><BadgeCheck size={22}/> Saved!</> : <><PencilLine size={22}/> Save & Keep Editing</>}
                    </button>
                  </div>
                </div>
              )}
            </div>
            )}
          </Shell>
        );
      }

      // ── Club Picker — manual search bar for choosing which club a staff
      // member is about to run a session for. Reads the full roster of
      // clubs an admin has configured (ClubCardsPanel, mivtza_config.
      // club_cards) so any number of clubs — not just Chitas — are
      // searchable and selectable here.
      function ClubPicker({ onBack, onSelect }) {
        const [clubs, setClubs] = useState([]);
        const [loading, setLoading] = useState(true);
        const [search, setSearch] = useState('');

        useEffect(() => {
          supabase.from('mivtza_config').select('club_cards').limit(1).maybeSingle().then(({ data }) => {
            let list = [];
            try { list = JSON.parse(data?.club_cards || '[]'); } catch {}
            setClubs(list);
            setLoading(false);
          });
        }, []);

        const matches = search.trim()
          ? clubs.filter((c) => (c.name || '').toLowerCase().includes(search.trim().toLowerCase()))
          : clubs;

        return (
          <div className="mx-auto max-w-xl">
            <div className="mb-5 flex items-start justify-between gap-3">
              <div>
                <p className="accent-text text-sm font-extrabold uppercase tracking-[0.2em]">Club Scanner</p>
                <h1 className="mt-1 text-3xl font-extrabold">Choose a Club</h1>
                <p className="muted-text mt-1 text-sm font-semibold">Search for the club running a session right now.</p>
              </div>
              <button onClick={onBack} className="glass-panel focus-ring shrink-0 rounded-lg px-3 py-2 text-sm font-bold">
                <ChevronLeft size={16} className="inline -mt-0.5" /> Back
              </button>
            </div>

            <div className="glass-panel rounded-xl p-5">
              <label className="glass-panel flex items-center gap-2 rounded-lg px-4 py-3">
                <ScanLine size={18} className="muted-text shrink-0" />
                <input
                  autoFocus
                  className="min-w-0 flex-1 bg-transparent font-semibold outline-none"
                  placeholder="Type a club name…"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                />
                {search && <button onClick={() => setSearch('')}><X size={14} /></button>}
              </label>

              {loading && <p className="muted-text mt-3 text-sm font-semibold">Loading clubs…</p>}
              {!loading && clubs.length === 0 && (
                <p className="muted-text mt-3 text-sm font-semibold">No clubs registered yet — add one in Admin → Club Portals.</p>
              )}
              {!loading && clubs.length > 0 && matches.length === 0 && (
                <p className="muted-text mt-3 text-sm font-semibold">No matching clubs.</p>
              )}
              {matches.length > 0 && (
                <div className="mt-3 grid max-h-80 gap-2 overflow-y-auto">
                  {matches.map((c) => (
                    <button
                      key={c.name}
                      onClick={() => onSelect(c)}
                      className="glass-panel focus-ring flex items-center justify-between rounded-lg px-4 py-3 text-left hover:scale-[1.01]"
                    >
                      <span className="font-bold">{c.name}</span>
                      <ChevronRight size={16} className="muted-text" />
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      // ── Club Session Portal — session-queue staging workflow ─────────────
      // Reached from inside TeacherPortal (already-authenticated teacher/
      // counselor session via teacher_profiles) rather than a separate NFC
      // operator card. Scanning never writes directly to daily_entries —
      // every tap just looks the camper up and stages them in a local
      // sessionQueue array. Nothing touches the database until the teacher
      // explicitly reviews the queue and hits "Review & Submit Session".
      //
      // By design this session can be run any number of times per day (see
      // submitSession below) so staff can use it as a general quick-marking
      // utility throughout the day, not just once. The `events` insert is an
      // append-only audit log of each session run (staff, items, headcount) —
      // it's never used to gate future sessions. That same shape (an
      // append-only events row per scan/session) is what a future event
      // door-access scanner should reuse: one row per tap/session, no lock.
      //
      // Generalized to accept any `club` (from ClubPicker/ClubCardsPanel)
      // rather than a single hardcoded club — each club runs its own
      // independent session queue, and several clubs' sessions can be run
      // back-to-back (or on different devices) the same day without
      // interfering with one another.
      function ClubSessionPortal({ club, onBack }) {
        const CLUB_NAME = club.name;
        const [checking, setChecking] = useState(true);
        // Every learning item, each carrying its own live `checked` flag for
        // this session — defaults from this club's configured active set,
        // but the teacher can freely toggle any of them right on this screen
        // before/during scanning. This (not the global config) is what
        // actually gets submitted — see submitSession below.
        const [sessionItems, setSessionItems] = useState([]); // [{db_key,label,points,checked}]
        const [allCampers, setAllCampers] = useState([]);
        const [sessionQueue, setSessionQueue] = useState([]);
        const [search, setSearch] = useState('');
        const [scanning, setScanning] = useState(false);
        const [submitting, setSubmitting] = useState(false);
        const toast = useToast();
        const ndefRef = useRef(null);
        // Mirrors sessionQueue as a Set for instant duplicate-tap checks
        // inside the NFC onreading callback, without depending on stale
        // closures over the sessionQueue state array.
        const queueIdsRef = useRef(new Set());

        useEffect(() => {
          (async () => {
            setChecking(true);
            const [{ data: cfgRow }, { data: roster }] = await Promise.all([
              supabase.from('mivtza_config').select('config_json').limit(1).maybeSingle(),
              supabase.from(CAMPER_READ_TABLE).select('id,name,nfc_id'),
            ]);
            setAllCampers(roster || []);

            let cfg = DEFAULT_CONFIG;
            if (cfgRow?.config_json) try { cfg = JSON.parse(cfgRow.config_json); } catch {}

            // This specific club's configured default items (set in Admin →
            // Club Portals) is the starting point for this session's
            // checklist, not a fixed rule — still freely toggleable below.
            const activeKeys = club.items || [];

            setSessionItems(
              (cfg.learning_items || []).map((item) => ({ ...item, checked: activeKeys.includes(item.db_key) }))
            );

            setChecking(false);
          })();
        }, [club]);

        const toggleSessionItem = (dbKey) => {
          setSessionItems((items) => items.map((i) => i.db_key === dbKey ? { ...i, checked: !i.checked } : i));
        };

        const addToQueue = (camper) => {
          if (queueIdsRef.current.has(camper.id)) {
            toast.info(`${camper.name} is already in the queue.`);
            return;
          }
          queueIdsRef.current.add(camper.id);
          setSessionQueue((q) => [...q, camper]);
          toast.success(`✔ ${camper.name} added to session queue successfully!`);
        };

        const removeFromQueue = (camperId) => {
          queueIdsRef.current.delete(camperId);
          setSessionQueue((q) => q.filter((c) => c.id !== camperId));
        };

        // Manual-entry roster search — lets staff check a camper into the
        // active session by typing their name, for whenever a physical NFC
        // tap isn't practical (no card on hand, card not working, etc).
        // Already-queued campers are filtered out of the results.
        const searchMatches = search.trim()
          ? allCampers
              .filter((c) => c.name?.toLowerCase().includes(search.trim().toLowerCase()))
              .filter((c) => !queueIdsRef.current.has(c.id))
              .slice(0, 8)
          : [];

        const startScan = async () => {
          if (scanning) return;
          if (!('NDEFReader' in window) || !window.isSecureContext) {
            toast.warning('Web NFC not available on this device — use Android Chrome.');
            return;
          }
          try {
            const ndef = new NDEFReader();
            ndefRef.current = ndef;
            ndef.onreading = (e) => {
              const target = normalizeNfcId(e.serialNumber || '');
              const match = allCampers.find((c) => normalizeNfcId(c.nfc_id) === target);
              if (match) addToQueue(match);
              else toast.warning('Card not found in roster.');
            };
            ndef.onreadingerror = () => toast.warning('Read failed — hold the card flat and try again.');
            await ndef.scan();
            setScanning(true);
          } catch (err) {
            setScanning(false);
            toast.error(err.message || 'Could not start the NFC scanner.');
          }
        };

        // Web NFC's NDEFReader has no formal stop() in the spec — this just
        // stops the UI from reacting to further onreading events and lets the
        // teacher restart cleanly if needed.
        const stopScan = () => setScanning(false);

        const submitSession = async () => {
          if (sessionQueue.length === 0) { toast.error('Queue is empty — scan or add at least one camper first.'); return; }

          // Read the LIVE checkbox states right now, not the config default —
          // this is what makes unchecking Tanya on this screen actually skip
          // it for this specific session's submission.
          const activeItems = sessionItems.filter((i) => i.checked);
          if (activeItems.length === 0) { toast.error('No items are checked for this session — select at least one item to credit above.'); return; }

          setSubmitting(true);
          let ok = 0, fail = 0;
          for (const camper of sessionQueue) {
            const payload = { camper_id: camper.id, entry_date: today() };
            const extra = {};
            activeItems.forEach((item) => {
              if (KNOWN_ENTRY_COLUMNS.has(item.db_key)) payload[item.db_key] = true;
              else extra[item.db_key] = true;
            });
            if (Object.keys(extra).length) payload.entry_data = extra;
            const { error } = await supabase.from('daily_entries').upsert(payload, { onConflict: 'camper_id,entry_date' });
            if (error) fail++; else ok++;
          }

          // Append-only audit row for this session run — deliberately a plain
          // insert (not an upsert keyed on the day) so the club can be run as
          // many times as needed per day; nothing here ever locks it out.
          // camper_count is explicitly coerced to a base-10 integer via
          // parseInt — sessionQueue.length is already a real JS number, but
          // this guards against Postgrest schema-cache mismatches some
          // Supabase projects hit when a column was added after the API's
          // schema was last cached (that specific error is fixed by running
          // `NOTIFY pgrst, 'reload schema';` in the SQL editor, or waiting
          // ~60s for it to auto-refresh — this conversion just ensures the
          // value we send is always unambiguous).
          const campersCredited = parseInt(sessionQueue.length, 10) || 0;
          const { error: eventError } = await supabase.from('events').insert({
            // 'name' is a legacy column some events table setups still have
            // as NOT NULL from before club_name/submission_date existed —
            // sending a fallback string here prevents a "null value violates
            // not-null constraint" error on those schemas. NOTE: this
            // requires the 'events' table to actually have a 'name' column —
            // Supabase/PostgREST rejects unknown keys with a schema-cache
            // error rather than silently ignoring them, so if your table
            // doesn't have this column, run:
            //   ALTER TABLE events ADD COLUMN IF NOT EXISTS name text;
            // (or drop the NOT NULL constraint if 'name' is meant to be optional).
            name: `${CLUB_NAME} Session`,
            club_name: CLUB_NAME,
            submission_date: today(),
            camper_count: campersCredited,
          });

          setSubmitting(false);
          if (eventError) {
            toast.error(`Credited ${ok} camper(s), but failed to log this session: ${eventError.message}`);
          } else {
            toast.success(`${ok} camper(s) credited${fail ? `, ${fail} failed` : ''} ✓`);
          }
          setSessionQueue([]);
          queueIdsRef.current.clear();
        };

        return (
          <div className="mx-auto max-w-xl">
            <ToastStack toasts={toast.toasts} remove={toast.remove} />
            <div className="mb-5 flex items-start justify-between gap-3">
              <div>
                <p className="accent-text text-sm font-extrabold uppercase tracking-[0.2em]">{CLUB_NAME}</p>
                <h1 className="mt-1 text-3xl font-extrabold">Event Attendance Scanner</h1>
                <p className="muted-text mt-1 text-sm font-semibold">
                  Check off what this session actually covered before scanning. Run this as many times a day as you need.
                </p>
              </div>
              <button onClick={onBack} className="glass-panel focus-ring shrink-0 rounded-lg px-3 py-2 text-sm font-bold">
                <ChevronLeft size={16} className="inline -mt-0.5" /> Back
              </button>
            </div>

            {checking && <p className="muted-text text-sm font-semibold">Loading roster…</p>}

            {!checking && (
              <div className="grid gap-4">
                {/* Items to Credit This Session — live, per-session override.
                    Defaults come from the last-configured active set, but the
                    teacher can freely toggle any of these right here, right
                    now, and submitSession() reads THIS state, not the config. */}
                <div className="glass-panel rounded-xl p-5">
                  <h2 className="mb-1 font-extrabold">Items to Credit This Session</h2>
                  <p className="muted-text mb-3 text-xs font-semibold">Uncheck anything the club didn't get to today — this only affects this session.</p>
                  {sessionItems.length === 0 && <p className="muted-text text-sm font-semibold">No learning items configured in App Configuration yet.</p>}
                  <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
                    {sessionItems.map((item) => (
                      <button
                        key={item.db_key}
                        type="button"
                        onClick={() => toggleSessionItem(item.db_key)}
                        className={classNames(
                          'focus-ring flex items-center gap-2 rounded-lg border px-3 py-2 text-left text-sm font-bold transition',
                          item.checked ? 'accent-bg line-border shadow-glow' : 'glass-panel'
                        )}
                      >
                        <span className={classNames('flex h-5 w-5 shrink-0 items-center justify-center rounded border line-border', item.checked && 'app-button')}>
                          {item.checked && <Check size={13} />}
                        </span>
                        <span className="truncate">{item.label}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  onClick={scanning ? stopScan : startScan}
                  className={classNames(
                    'lux-card focus-ring flex w-full items-center justify-center gap-3 rounded-2xl px-5 py-6 text-xl font-extrabold shadow-luxury transition',
                    scanning && 'nfc-listening'
                  )}
                >
                  {scanning ? <RefreshCw className="relative z-10 animate-spin" size={24} /> : <Smartphone className="relative z-10" size={24} />}
                  <span className="relative z-10">{scanning ? 'Scanning — tap cards to add' : 'Start Scan'}</span>
                </button>

                {/* Manual entry — search the roster by name and check a
                    camper into the session without an NFC tap. */}
                <div className="glass-panel rounded-xl p-5">
                  <h2 className="mb-3 font-extrabold">Add a Camper Manually</h2>
                  <label className="glass-panel flex items-center gap-2 rounded-lg px-4 py-3">
                    <ScanLine size={18} className="muted-text shrink-0" />
                    <input
                      className="min-w-0 flex-1 bg-transparent font-semibold outline-none"
                      placeholder="Type camper name…"
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                    />
                    {search && <button onClick={() => setSearch('')}><X size={14} /></button>}
                  </label>
                  {search && searchMatches.length === 0 && <p className="muted-text mt-2 text-sm font-semibold">No matching campers.</p>}
                  {searchMatches.length > 0 && (
                    <div className="mt-2 grid max-h-64 gap-2 overflow-y-auto">
                      {searchMatches.map((c) => (
                        <div key={c.id} className="glass-panel flex items-center justify-between gap-3 rounded-lg px-4 py-2.5">
                          <span className="truncate font-bold">{c.name}</span>
                          <button
                            onClick={() => { addToQueue(c); setSearch(''); }}
                            className="app-button focus-ring inline-flex shrink-0 items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-extrabold"
                          >
                            <UserCheck size={14} /> Check In
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div className="glass-panel rounded-xl p-5">
                  <div className="mb-3 flex items-center justify-between">
                    <h2 className="font-extrabold">Session Queue</h2>
                    <span className="muted-text text-xs font-semibold">{sessionQueue.length} camper{sessionQueue.length === 1 ? '' : 's'}</span>
                  </div>
                  {sessionQueue.length === 0 && <p className="muted-text text-sm font-semibold">No campers scanned yet.</p>}
                  <div className="grid max-h-80 gap-2 overflow-y-auto">
                    {sessionQueue.map((c) => (
                      <div key={c.id} className="glass-panel flex items-center justify-between rounded-lg px-3 py-2">
                        <span className="text-sm font-bold">{c.name}</span>
                        <button onClick={() => removeFromQueue(c.id)} className="focus-ring text-red-500 hover:scale-110" title="Remove from queue">
                          <X size={15} />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                <button
                  onClick={submitSession}
                  disabled={submitting || sessionQueue.length === 0}
                  className="app-button focus-ring flex w-full items-center justify-center gap-2 rounded-xl px-5 py-4 text-lg font-extrabold disabled:cursor-not-allowed disabled:opacity-40"
                >
                  {submitting ? <RefreshCw size={20} className="animate-spin" /> : <BadgeCheck size={20} />}
                  {submitting ? 'Submitting…' : 'Review & Submit Session'}
                </button>
              </div>
            )}
          </div>
        );
      }

      // ── Club Portal (Chitas, etc.) ────────────────────────────────────────
      // Operator scans their card → tap students through one by one →
      // each tap auto-credits the configured items instantly, no UI needed.
      function ClubPortal({ onLogout, club }) {
        const [appConfig, setAppConfig] = useState(DEFAULT_CONFIG);
        const [allCampers, setAllCampers] = useState([]);
        const [lastResult, setLastResult] = useState(null); // {name, success}
        const [nfcActive, setNfcActive] = useState(false);
        const toast = useToast();
        const ndefRef = useRef(null);
        const processingRef = useRef(false);

        useEffect(() => {
          Promise.all([
            supabase.from('mivtza_config').select('config_json').limit(1).maybeSingle(),
            supabase.from(CAMPER_READ_TABLE).select('*'),
          ]).then(([{ data: cfg }, { data: roster }]) => {
            if (cfg?.config_json) try { setAppConfig(JSON.parse(cfg.config_json)); } catch {}
            setAllCampers(roster || []);
          });
        }, []);

        const creditStudent = async (nfcId) => {
          const target = normalizeNfcId(nfcId);
          const camper = allCampers.find((c) => normalizeNfcId(c.nfc_id) === target);
          if (!camper) { setLastResult({ name: `Unknown (${nfcId})`, success: false }); return; }

          // Build the entry payload for just the club's items
          const known = { camper_id: camper.id, entry_date: today() };
          const extra = {};
          const itemsToCredit = club.items || [];
          itemsToCredit.forEach((key) => {
            if (KNOWN_ENTRY_COLUMNS.has(key)) known[key] = true;
            else extra[key] = true;
          });
          if (Object.keys(extra).length) known.entry_data = extra;

          const { error } = await supabase.from('daily_entries').upsert(known, { onConflict: 'camper_id,entry_date' });
          setLastResult({ name: camper.name, success: !error });
          if (error) toast.error(`${camper.name}: ${error.message}`);
        };

        const startNfc = async () => {
          if (!('NDEFReader' in window) || !window.isSecureContext) { toast.warning('NFC not available.'); return; }
          try {
            const ndef = new NDEFReader(); ndefRef.current = ndef;
            ndef.onreading = (e) => {
              if (processingRef.current) return;
              processingRef.current = true;
              setTimeout(() => { processingRef.current = false; }, 2500);
              if (e.serialNumber) creditStudent(e.serialNumber);
            };
            await ndef.scan(); setNfcActive(true);
          } catch (err) { toast.error(err.message); }
        };

        const itemLabels = (club.items || []).map((key) => {
          const all = [...(appConfig.learning_items||[]), ...(appConfig.hanhaga_items||[]), ...(appConfig.teacher_items||[])];
          return all.find((i) => i.db_key === key)?.label || key;
        });

        return (
          <Shell status="Gold" onLogout={onLogout}>
            <ToastStack toasts={toast.toasts} remove={toast.remove} />
            <div className="mx-auto grid min-h-[calc(100vh-7rem)] max-w-lg place-items-center">
              <section className="grid w-full gap-6 text-center">
                <div>
                  <p className="accent-text text-sm font-extrabold uppercase tracking-[0.28em]">{club.name || 'Club Portal'}</p>
                  <h1 className="mt-2 text-3xl font-extrabold">Tap cards to take attendance</h1>
                  <p className="muted-text mt-2 text-sm font-semibold">
                    Credits: {itemLabels.join(', ') || 'No items configured'}
                  </p>
                </div>

                {/* Big status display */}
                {lastResult && (
                  <div className={`lux-card rounded-2xl p-8 shadow-luxury transition-all ${lastResult.success ? '' : 'border-red-400/40'}`}>
                    <p className={`text-4xl font-extrabold shimmer-text ${lastResult.success ? '' : 'text-red-400'}`}>
                      {lastResult.success ? '✓' : '✗'}
                    </p>
                    <p className="mt-2 text-2xl font-extrabold">{lastResult.name}</p>
                    <p className={`mt-1 text-sm font-semibold ${lastResult.success ? 'muted-text' : 'text-red-400'}`}>
                      {lastResult.success ? 'Credited ✓' : 'Card not registered'}
                    </p>
                  </div>
                )}

                {!nfcActive ? (
                  <button onClick={startNfc} className="lux-card focus-ring flex w-full items-center justify-center gap-3 rounded-2xl px-5 py-6 text-xl font-extrabold shadow-luxury">
                    <Smartphone size={28} /> Start NFC Scanner
                  </button>
                ) : (
                  <div className="lux-card nfc-listening flex w-full items-center justify-center gap-3 rounded-2xl px-5 py-6 text-xl font-extrabold shadow-luxury">
                    <RefreshCw className="relative z-10 animate-spin" size={24} />
                    <span className="relative z-10">Ready — tap a card</span>
                  </div>
                )}
              </section>
            </div>
          </Shell>
        );
      }

      // ── Initialization splash ────────────────────────────────────────────
      // Shown while the async Supabase session check is still in flight, so
      // the app never has to render the landing page (gold card + buttons)
      // on the very first paint only to yank it away a moment later once we
      // learn the user is actually a signed-in teacher. Sits on the same
      // body background gradient already defined in the page's CSS, so there
      // is no flash of a mismatched color either.
      function InitSplash() {
        return (
          <div className="grid min-h-screen place-items-center">
            <div className="flex flex-col items-center gap-4">
              <CreditCard size={40} className="shimmer-text" strokeWidth={1.5} />
              <RefreshCw size={18} className="muted-text animate-spin" />
            </div>
          </div>
        );
      }

      function App() {
        const [camper, setCamper] = useState(null);
        const [adminMode, setAdminMode] = useState(false);
        const [teacherInfo, setTeacherInfo] = useState(null);  // null | {name, bunk}
        const [clubCard, setClubCard] = useState(null);         // null | club config object
        const [sessionChecked, setSessionChecked] = useState(false);
        const isAdmin = adminMode || window.location.pathname.endsWith('/admin') || window.location.search.includes('admin');

        // Checks for an active Supabase Auth session (set either by a Google
        // OAuth redirect, or right after an email/password sign-in) and
        // matches the signed-in email against the teacher_profiles allowlist.
        // Returns true if a matching teacher was found, false otherwise —
        // callers use this to show an error if someone authenticates with an
        // email that isn't on the list.
        const checkTeacherSession = async () => {
          const { data: { session } } = await supabase.auth.getSession();
          if (!session?.user?.email) return false;
          const { data: profile } = await supabase
            .from('teacher_profiles')
            .select('name,bunk')
            .ilike('email', session.user.email)
            .maybeSingle();
          if (profile) {
            setTeacherInfo({ name: profile.name, bunk: profile.bunk });
            return true;
          }
          // Signed in but not on the allowlist — bounce them back out so
          // they don't get stuck in limbo.
          await supabase.auth.signOut();
          return false;
        };

        // Run once on load to catch a Google OAuth redirect (or an existing
        // password-login session) completing. The admin route skips this
        // entirely — AdminGate manages its own auth state independently —
        // so admin access is never delayed waiting on a teacher-session check
        // that doesn't apply to it.
        useEffect(() => {
          if (isAdmin) { setSessionChecked(true); return; }
          checkTeacherSession().finally(() => setSessionChecked(true));
        }, []);

        const goAdmin   = () => { sessionStorage.setItem('mivtza_admin_unlocked', '1'); setAdminMode(true); };
        const goClub    = (club) => setClubCard(club);
        const teacherLogout = () => { supabase.auth.signOut(); setTeacherInfo(null); };

        if (isAdmin) return <AdminGate><AdminDashboard /></AdminGate>;

        // Hold everything behind a minimal splash until the session check
        // above resolves. Without this gate, the very first render would
        // fall through to LoginScreen (teacherInfo starts null) — showing
        // the gold card and action buttons — and only snap over to
        // TeacherPortal once the async getSession() call finished a moment
        // later. This guarantees the person only ever sees one screen.
        if (!sessionChecked) return <InitSplash />;

        if (teacherInfo) return <ErrorBoundary><TeacherPortal onLogout={teacherLogout} teacherName={teacherInfo.name} bunk={teacherInfo.bunk} /></ErrorBoundary>;
        if (clubCard)    return <ErrorBoundary><ClubPortal onLogout={() => setClubCard(null)} club={clubCard} /></ErrorBoundary>;
        if (camper) return <ErrorBoundary><CamperDashboard camper={camper} onLogout={() => setCamper(null)} /></ErrorBoundary>;
        return <LoginScreen onCamper={setCamper} onAdmin={goAdmin} onClub={goClub} onTeacherAuthed={checkTeacherSession} />;
      }

      createRoot(document.getElementById('root')).render(<App />);
    </script>

    <script>
      // The auto "text/babel" script-tag scanner only lets us pass bare preset
      // names (no options), and the React preset's default "automatic" JSX
      // runtime tries to import the bare specifier "react/jsx-runtime", which
      // the browser can't resolve without an import map. So we transform
      // manually here, forcing the classic runtime (React.createElement),
      // and inject the result as a real <script type="module">.
      (function bootstrap() {
        const source = document.getElementById('app-source').textContent;
        const { code } = Babel.transform(source, {
          presets: [['react', { runtime: 'classic' }]],
          sourceType: 'unambiguous',
          filename: 'app.jsx',
        });
        const blob = new Blob([code], { type: 'text/javascript' });
        const script = document.createElement('script');
        script.type = 'module';
        script.src = URL.createObjectURL(blob);
        document.body.appendChild(script);
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(
            (reg) => console.log('[Mivtza] SW registered, scope:', reg.scope),
            (err) => console.warn('[Mivtza] SW registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
