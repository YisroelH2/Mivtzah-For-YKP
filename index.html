              <button onClick={buildPreview} className="app-button focus-ring rounded px-5 py-2 font-extrabold">Preview Matches</button>
              {preview && <button onClick={() => { setPreview(null); setRaw(''); }} className="glass-panel focus-ring rounded px-4 py-2 font-bold">Clear</button>}
            </div>

            {preview && (
              <div className="mt-4 grid gap-3">
                <div className="flex gap-4 text-sm font-extrabold">
                  <span className="text-green-500">✓ {preview.matched.length} matched</span>
                  {preview.unmatched.length > 0 && <span className="text-amber-500">⚠ {preview.unmatched.length} unmatched</span>}
                </div>

                {preview.matched.length > 0 && (
                  <div className="glass-panel rounded-lg p-3 max-h-48 overflow-y-auto">
                    <p className="muted-text mb-2 text-xs font-extrabold uppercase">Will assign:</p>
                    {preview.matched.slice(0, 200).map((m, i) => (
                      <div key={i} className="flex justify-between text-xs font-semibold py-0.5">
                        <span>{m.camper.name}</span>
                        <span className="accent-text">{m.group}</span>
                      </div>
                    ))}
                  </div>
                )}

                {preview.unmatched.length > 0 && (
                  <div className="rounded-lg border border-amber-400/40 bg-amber-500/10 p-3 max-h-40 overflow-y-auto">
                    <p className="mb-2 text-xs font-extrabold uppercase text-amber-600">Not found in roster (check spelling or register first):</p>
                    {preview.unmatched.map((u, i) => (
                      <div key={i} className="flex justify-between text-xs font-semibold py-0.5 text-amber-700">
                        <span>{u.fullName}</span>
                        <span>{u.group}</span>
                      </div>
                    ))}
                  </div>
                )}

                {preview.matched.length > 0 && (
                  <button onClick={apply} disabled={applying} className="app-button focus-ring inline-flex items-center justify-center gap-2 rounded px-5 py-3 font-extrabold disabled:opacity-60">
                    {applying ? <RefreshCw size={18} className="animate-spin" /> : <Save size={18} />}
                    Apply {preview.matched.length} {mode === 'bunks' ? 'Bunk' : 'Class'} Assignments
                  </button>
                )}
              </div>
            )}
          </div>
        );
      }

      function AdminDashboard() {
        const [tab, setTab] = useState('dashboard'); // 'dashboard' | 'setup'
        const toast = useToast();
        const [campers, setCampers] = useState([]);
        const [appConfig, setAppConfig] = useState(DEFAULT_CONFIG);
        const [configId, setConfigId] = useState(null);
        const [configAdminCards, setConfigAdminCards] = useState('');
        const [periodStart, setPeriodStart] = useState('');
        const [periodEnd, setPeriodEnd] = useState('');
        const [loading, setLoading] = useState(true);
        const [rosterSearch, setRosterSearch] = useState('');
        const [accessSearch, setAccessSearch] = useState('');
        const [historyCamper, setHistoryCamper] = useState(null);

        // Registration state
        const [newCamper, setNewCamper] = useState({ name: '', nfc_id: '' });
        const [regNfcListening, setRegNfcListening] = useState(false);
        const regNdefRef = useRef(null);

        // Inline edit state
        const [editRow, setEditRow] = useState(null);

        // Roster NFC scan search
        const [rosterNfcListening, setRosterNfcListening] = useState(false);
        const rosterNdefRef = useRef(null);

        // New config rule
        const notify = (text, type = 'info') => type === 'error' ? toast.error(text) : toast.success(text);

        const load = async () => {
          setLoading(true);
          const [{ data: roster }, { data: configRow }] = await Promise.all([
            supabase.from(CAMPER_READ_TABLE).select('*').order('name'),
            supabase.from('mivtza_config').select('id,config_json,admin_cards,week_start_date,week_end_date').limit(1).maybeSingle(),
          ]);
          setCampers(roster || []);
          if (configRow) {
            setConfigId(configRow.id || null);
            setConfigAdminCards(configRow.admin_cards || '');
            if (configRow.week_start_date) setPeriodStart(configRow.week_start_date);
            if (configRow.week_end_date) setPeriodEnd(configRow.week_end_date);
            if (configRow.config_json) {
              try { setAppConfig(JSON.parse(configRow.config_json)); } catch {}
            }
          }
          setLoading(false);
        };

        useEffect(() => { load(); }, []);

        // Shared search predicate for the roster — matches name, NFC ID, bunk, or class.
        const rosterMatches = (c) => {
          if (!rosterSearch) return true;
          const q = rosterSearch.toLowerCase();
          return (
            c.name?.toLowerCase().includes(q) ||
            normalizeNfcId(c.nfc_id).includes(normalizeNfcId(rosterSearch)) ||
            c.bunk?.toLowerCase().includes(q) ||
            c.class?.toLowerCase().includes(q)
          );
        };

        const vip = campers.filter((c) => Number(c.weekly_points) >= Number(appConfig.vip_event_threshold ?? 700));
        const standard = campers.filter((c) => Number(c.weekly_points) >= Number(appConfig.standard_event_threshold ?? 400) && Number(c.weekly_points) < Number(appConfig.vip_event_threshold ?? 700));
        const notEligible = campers.filter((c) => Number(c.weekly_points) < Number(appConfig.standard_event_threshold ?? 400));

        // ── NFC scan for registration ───────────────────────────────────────
        const startRegNfcScan = async () => {
          if (!('NDEFReader' in window) || !window.isSecureContext) {
            notify('Web NFC not available here — type the card ID manually.', 'error');
            return;
          }
          try {
            const ndef = new NDEFReader();
            regNdefRef.current = ndef;
            ndef.onreading = (event) => {
              const serial = event.serialNumber;
              setRegNfcListening(false);
              if (serial) {
                setNewCamper((prev) => ({ ...prev, nfc_id: serial }));
                notify(`Card scanned: ${serial}`);
              } else {
                notify('Card read but no serial number returned.', 'error');
              }
            };
            await ndef.scan();
            setRegNfcListening(true);
            notify('Tap the card to the back of the device…');
          } catch (err) {
            setRegNfcListening(false);
            notify(err.message || 'NFC scan failed.', 'error');
          }
        };

        // ── Register ────────────────────────────────────────────────────────
        const registerCamper = async () => {
          if (!newCamper.name.trim()) { notify('Please enter a camper name.', 'error'); return; }
          if (!newCamper.nfc_id.trim()) { notify('Please enter or scan a card ID.', 'error'); return; }
          const payload = {
            name: newCamper.name.trim(),
            nfc_id: newCamper.nfc_id.trim(),
          };
          try {
            const { error } = await supabase.from(CAMPER_WRITE_TABLE).insert(payload);
            if (error) {
              notify(`Register failed: ${error.message}`, 'error');
            } else {
              setNewCamper({ name: '', nfc_id: '' });
              notify('Camper registered ✓');
              load();
            }
          } catch (networkErr) {
            const isNetworkFail = networkErr instanceof TypeError && networkErr.message.includes('fetch');
            notify(
              isNetworkFail
                ? 'Network error — could not reach Supabase. Check: (1) internet connection, (2) the Supabase URL in Backend Settings is correct and starts with https://, (3) the anon key is correct.'
                : `Unexpected error: ${networkErr.message}`,
              'error'
            );
          }
        };

        // ── Delete ──────────────────────────────────────────────────────────
        const deleteCamper = async (camper) => {
          if (!window.confirm(`Delete "${camper.name}"? This cannot be undone.`)) return;
          const { error } = await supabase.from(CAMPER_WRITE_TABLE).delete().eq('id', camper.id);
          if (error) {
            notify(`Delete failed: ${error.message}`, 'error');
          } else {
            notify(`${camper.name} deleted.`);
            load();
          }
        };

        // ── Inline edit save ────────────────────────────────────────────────
        const saveEdit = async () => {
          if (!editRow) return;
          const { data, error } = await supabase
            .from(CAMPER_WRITE_TABLE)
            .update({ name: editRow.name, nfc_id: editRow.nfc_id, bunk: editRow.bunk || null, class: editRow.class || null })
            .eq('id', editRow.id)
            .select();
          if (error) toast.error(`Save failed: ${error.message}`);
          else if (!data || data.length === 0) toast.error(`Update was silently blocked — Row Level Security on "${CAMPER_WRITE_TABLE}" doesn't allow writes. Run the RLS fix SQL in Supabase.`);
          else { setEditRow(null); toast.success('Camper updated ✓'); load(); }
        };

        // ── Save app config to mivtza_config.config_json ────────────────────
        const saveConfig = async (cfg, wStart, wEnd) => {
          const payload = {
            config_json: JSON.stringify(cfg),
            ...(configAdminCards ? { admin_cards: configAdminCards } : {}),
            ...(wStart ? { week_start_date: wStart } : {}),
            ...(wEnd   ? { week_end_date:   wEnd   } : {}),
          };
          const { error } = configId
            ? await supabase.from('mivtza_config').update(payload).eq('id', configId)
            : await supabase.from('mivtza_config').upsert(payload);
          if (error) toast.error(`Save failed: ${error.message}`);
          else {
            toast.success('Config saved ✓');
            setAppConfig(cfg);
            if (wStart) setPeriodStart(wStart);
            if (wEnd) setPeriodEnd(wEnd);
            load();
          }
        };

        const startRosterNfcScan = async () => {
          if (!('NDEFReader' in window) || !window.isSecureContext) {
            toast.warning('Web NFC not available — type in the search box instead.'); return;
          }
          try {
            const ndef = new NDEFReader();
            rosterNdefRef.current = ndef;
            ndef.onreading = (event) => {
              const serial = event.serialNumber;
              setRosterNfcListening(false);
              if (serial) setRosterSearch(serial);
            };
            await ndef.scan();
            setRosterNfcListening(true);
          } catch (err) {
            setRosterNfcListening(false);
            toast.error(`NFC error: ${err.message}`);
          }
        };

        return (
          <Shell admin status="Platinum">
            <ToastStack toasts={toast.toasts} remove={toast.remove} />
            <div className="mx-auto grid max-w-7xl gap-5 pb-24">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h1 className="text-3xl font-extrabold">{tab === 'dashboard' ? 'Camper Dashboard' : 'Setup & Configuration'}</h1>
                  <p className="muted-text font-semibold">{tab === 'dashboard' ? 'Roster, event eligibility, and daily corrections.' : 'Cards, accounts, imports, and app-wide rules.'}</p>
                </div>
                <IconButton icon={RefreshCw} label="Refresh data" onClick={load} className={loading ? 'animate-spin' : ''} />
              </div>

              {tab === 'dashboard' && (<>

              {/* ── Roster ── */}
              <section className="glass-panel overflow-hidden rounded-lg shadow-luxury">
                <div className="flex flex-wrap items-center gap-3 border-b line-border p-4">
                  <Users className="accent-text shrink-0" />
                  <h2 className="text-xl font-extrabold">Camper Roster</h2>
                  <label className="ml-auto flex items-center gap-2 glass-panel rounded px-3 py-2 min-w-[200px]">
                    <ScanLine size={16} className="muted-text shrink-0" />
                    <input
                      className="bg-transparent text-sm font-semibold outline-none w-full placeholder:font-medium"
                      placeholder="Search name, card ID, bunk, or class…"
                      value={rosterSearch}
                      onChange={(e) => setRosterSearch(e.target.value)}
                    />
                    {rosterSearch && <button onClick={() => setRosterSearch('')}><X size={14} /></button>}
                  </label>
                  <button
                    onClick={startRosterNfcScan}
                    disabled={rosterNfcListening}
                    className="lux-card focus-ring inline-flex items-center gap-2 rounded px-3 py-2 text-sm font-extrabold disabled:opacity-70"
                    title="Scan card to find camper"
                  >
                    {rosterNfcListening ? <RefreshCw size={14} className="animate-spin" /> : <Smartphone size={14} />}
                    {rosterNfcListening ? 'Scanning…' : 'Scan to Find'}
                  </button>
                  <span className="muted-text text-xs font-semibold">
                    {campers.filter(rosterMatches).length} / {campers.length}
                  </span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full min-w-[900px] text-left text-sm">
                    <thead className="accent-bg">
                      <tr>
                        {['Name', 'NFC ID', 'Bunk', 'Class', 'Card Status', 'Weekly Pts', 'Lifetime Pts', 'Event Status', ''].map((head) => (
                          <th key={head} className="px-4 py-3 font-extrabold">{head}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {campers.filter(rosterMatches).map((camper) => {
                        const isEditing = editRow?.id === camper.id;
                        return (
                          <tr key={camper.id} className="border-t line-border">
                            <td className="px-4 py-2">
                              {isEditing
                                ? <input className="w-full rounded border line-border bg-transparent px-2 py-1 font-bold" value={editRow.name} onChange={(e) => setEditRow({ ...editRow, name: e.target.value })} />
                                : <span className="font-bold">{camper.name}</span>}
                            </td>
                            <td className="px-4 py-2">
                              {isEditing
                                ? <input className="w-full rounded border line-border bg-transparent px-2 py-1 font-mono text-xs" value={editRow.nfc_id} onChange={(e) => setEditRow({ ...editRow, nfc_id: e.target.value })} />
                                : <span className="font-mono text-xs">{camper.nfc_id}</span>}
                            </td>
                            <td className="px-4 py-2">
                              {isEditing
                                ? <input className="w-28 rounded border line-border bg-transparent px-2 py-1 text-xs font-semibold" placeholder="Bunk" value={editRow.bunk||''} onChange={(e) => setEditRow({ ...editRow, bunk: e.target.value })} />
                                : <span className="text-xs font-semibold">{camper.bunk || '—'}</span>}
                            </td>
                            <td className="px-4 py-2">
                              {isEditing
                                ? <input className="w-28 rounded border line-border bg-transparent px-2 py-1 text-xs font-semibold" placeholder="Class" value={editRow.class||''} onChange={(e) => setEditRow({ ...editRow, class: e.target.value })} />
                                : <span className="text-xs font-semibold">{camper.class || '—'}</span>}
                            </td>
                            <td className="px-4 py-2">
                              {displayValue(camper.card_status)}
                            </td>
                            <td className="px-4 py-2">{displayValue(camper.weekly_points)}</td>
                            <td className="px-4 py-2">{displayValue(camper.total_points)}</td>
                            <td className="px-4 py-2">{displayValue(camper.weekly_event_status)}</td>
                            <td className="px-4 py-2">
                              <div className="flex items-center gap-1">
                                {isEditing ? (
                                  <>
                                    <button onClick={saveEdit} className="focus-ring inline-flex h-8 w-8 items-center justify-center rounded border line-border hover:scale-105" title="Save"><Save size={15} /></button>
                                    <button onClick={() => setEditRow(null)} className="focus-ring inline-flex h-8 w-8 items-center justify-center rounded border line-border hover:scale-105" title="Cancel"><X size={15} /></button>
                                  </>
                                ) : (
                                  <>
                                    <button onClick={() => setEditRow({ ...camper })} className="focus-ring inline-flex h-8 w-8 items-center justify-center rounded border line-border hover:scale-105" title="Edit"><PencilLine size={15} /></button>
                                    <button onClick={() => deleteCamper(camper)} className="focus-ring inline-flex h-8 w-8 items-center justify-center rounded border border-red-400/40 text-red-500 hover:scale-105" title="Delete"><Trash2 size={15} /></button>
                                  </>
                                )}
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </section>

              {/* ── Global student search for the three access columns ── */}
              <section className="glass-panel rounded-lg p-4">
                <label className="flex items-center gap-3 rounded-lg px-2 py-1">
                  <ScanLine size={18} className="accent-text shrink-0" />
                  <input
                    className="w-full bg-transparent text-base font-semibold outline-none placeholder:font-medium"
                    placeholder="Search students across VIP, Standard, and Not Eligible…"
                    value={accessSearch}
                    onChange={(e) => setAccessSearch(e.target.value)}
                  />
                  {accessSearch && <button onClick={() => setAccessSearch('')} className="shrink-0"><X size={16} /></button>}
                </label>
              </section>

              <section className="grid gap-4 lg:grid-cols-3">
                <AccessList title="VIP Event Access" icon={Sparkles} campers={vip.filter((c) => !accessSearch || c.name?.toLowerCase().includes(accessSearch.toLowerCase()))} onSelect={setHistoryCamper} />
                <AccessList title="Standard Event Access" icon={BadgeCheck} campers={standard.filter((c) => !accessSearch || c.name?.toLowerCase().includes(accessSearch.toLowerCase()))} onSelect={setHistoryCamper} />
                <AccessList title="Not Eligible" icon={X} campers={notEligible.filter((c) => !accessSearch || c.name?.toLowerCase().includes(accessSearch.toLowerCase()))} onSelect={setHistoryCamper} />
              </section>

              {historyCamper && (
                <CamperHistoryModal
                  camper={historyCamper}
                  appConfig={appConfig}
                  periodStart={periodStart}
                  periodEnd={periodEnd}
                  toast={toast}
                  onClose={() => setHistoryCamper(null)}
                  onAdjusted={(updatedCamper) => {
                    // Instant feedback in the modal + roster, no page reload —
                    // then quietly re-sync everything else from the source of truth.
                    setHistoryCamper(updatedCamper);
                    setCampers((prev) => prev.map((c) => c.id === updatedCamper.id ? { ...c, ...updatedCamper } : c));
                    load();
                  }}
                />
              )}

              {/* ── Register Camper ── */}
              <section className="glass-panel rounded-lg p-5">
                <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><Plus className="accent-text" /> Register Camper</h2>
                <div className="grid gap-3 sm:grid-cols-2">
                  <TextInput icon={Users} placeholder="Camper name" value={newCamper.name} onChange={(e) => setNewCamper({ ...newCamper, name: e.target.value })} />
                  <div className="flex flex-wrap gap-2">
                    <label className="glass-panel flex min-w-0 flex-1 items-center gap-3 rounded px-3 py-2">
                      <ScanLine size={18} className="muted-text shrink-0" />
                      <input
                        className="focus-ring min-w-0 flex-1 bg-transparent py-2 text-sm font-semibold outline-none placeholder:font-medium font-mono"
                        placeholder="Card ID (scan or type)"
                        value={newCamper.nfc_id}
                        onChange={(e) => setNewCamper({ ...newCamper, nfc_id: e.target.value })}
                      />
                    </label>
                    <button
                      onClick={startRegNfcScan}
                      disabled={regNfcListening}
                      className="lux-card focus-ring flex items-center gap-2 rounded px-4 py-2 text-sm font-extrabold disabled:opacity-70"
                      title="Tap card to scan NFC"
                    >
                      {regNfcListening ? <RefreshCw size={16} className="animate-spin" /> : <Smartphone size={16} />}
                      {regNfcListening ? 'Listening…' : 'Tap Card'}
                    </button>
                  </div>
                </div>
                <button className="app-button focus-ring mt-3 rounded px-5 py-3 font-extrabold" onClick={registerCamper}>Register Camper</button>
              </section>

              </>)}

              {tab === 'setup' && (<>

              {/* ── Cards & Accounts ── */}
              <section className="grid gap-5 lg:grid-cols-3">
                <AdminCardsPanel />
                <TeacherAccountsPanel />
                <div className="glass-panel rounded-lg p-5">
                  <h2 className="mb-4 flex items-center gap-2 text-xl font-extrabold"><Settings className="accent-text" /> Admin Passcode</h2>
                  <PasscodePanel />
                </div>
              </section>

              {/* ── Club Portals ── */}
              <ClubCardsPanel learningItems={appConfig.learning_items || []} />

              {/* ── Bulk Import ── */}
              <BulkImportPanel campers={campers} onDone={load} />

              {/* ── Structured App Configuration ── */}
              <section className="glass-panel rounded-lg p-5">
                <h2 className="mb-1 flex items-center gap-2 text-xl font-extrabold"><Gauge className="accent-text" /> App Configuration</h2>
                <p className="muted-text mb-5 text-xs font-semibold">All settings save to Supabase and sync to every device instantly. Labels, points, and items are fully customizable.</p>
                <ConfigEditor config={appConfig} periodStart={periodStart} periodEnd={periodEnd} onSave={saveConfig} />
              </section>

              </>)}

            </div>

            {/* ── Bottom tab nav ── */}
            <div className="fixed bottom-0 inset-x-0 z-40 border-t line-border bg-[var(--bg-2)]/90 backdrop-blur-lg">
              <div className="mx-auto flex max-w-md items-center justify-around px-4 py-2">
                <button
                  onClick={() => setTab('dashboard')}
                  className={classNames('focus-ring flex flex-1 flex-col items-center gap-1 rounded-xl py-2 transition', tab === 'dashboard' ? 'accent-text' : 'muted-text')}
                >
                  <Users size={22} strokeWidth={tab === 'dashboard' ? 2.5 : 2} />
                  <span className="text-xs font-extrabold">Dashboard</span>
                </button>
                <button
                  onClick={() => setTab('setup')}
                  className={classNames('focus-ring flex flex-1 flex-col items-center gap-1 rounded-xl py-2 transition', tab === 'setup' ? 'accent-text' : 'muted-text')}
                >
                  <Settings size={22} strokeWidth={tab === 'setup' ? 2.5 : 2} />
                  <span className="text-xs font-extrabold">Setup</span>
                </button>
              </div>
            </div>
          </Shell>
        );
      }

      // ── Structured Config Editor ────────────────────────────────────────────
      function ConfigEditor({ config, periodStart, periodEnd, onSave }) {
        const [draft, setDraft] = useState(() => JSON.parse(JSON.stringify(config)));
        const [wStart, setWStart] = useState(periodStart || '');
        const [wEnd, setWEnd] = useState(periodEnd || '');

        useEffect(() => {
          setDraft(JSON.parse(JSON.stringify(config)));
          setWStart(periodStart || '');
          setWEnd(periodEnd || '');
        }, [config, periodStart, periodEnd]);

        const updateLearning = (idx, field, value) => {
          const next = [...draft.learning_items];
          next[idx] = { ...next[idx], [field]: field === 'points' ? Number(value) : value };
          setDraft({ ...draft, learning_items: next });
        };
        const addLearning = () => setDraft({ ...draft, learning_items: [...(draft.learning_items||[]), { db_key: `learn_custom_${Date.now()}`, label: 'New Item', points: 10 }] });
        const removeLearning = (idx) => setDraft({ ...draft, learning_items: draft.learning_items.filter((_,i) => i!==idx) });

        const updateHanhaga = (idx, field, value) => {
          const next = [...draft.hanhaga_items];
          next[idx] = { ...next[idx], [field]: value };
          setDraft({ ...draft, hanhaga_items: next });
        };
        const addHanhaga = () => setDraft({ ...draft, hanhaga_items: [...(draft.hanhaga_items||[]), { db_key: `hanhaga_custom_${Date.now()}`, label: 'New Hanhaga' }] });
        const removeHanhaga = (idx) => setDraft({ ...draft, hanhaga_items: draft.hanhaga_items.filter((_,i) => i!==idx) });

        const updateTeacher = (idx, field, value) => {
          const next = [...(draft.teacher_items||[])];
          next[idx] = { ...next[idx], [field]: field === 'points' ? Number(value) : value };
          setDraft({ ...draft, teacher_items: next });
        };
        const addTeacher = () => setDraft({ ...draft, teacher_items: [...(draft.teacher_items||[]), { db_key: `teacher_custom_${Date.now()}`, label: 'New Teacher Item', points: 0 }] });
        const removeTeacher = (idx) => setDraft({ ...draft, teacher_items: (draft.teacher_items||[]).filter((_,i) => i!==idx) });

        const setNum = (field, value) => setDraft({ ...draft, [field]: Number(value) });

        const learningTotal = (draft.learning_items||[]).reduce((s,i)=>s+Number(i.points||0),0);
        const hanhagaMax = (draft.hanhaga_items||[]).length * Number(draft.hanhaga_bonus_per_item||5);
        const teacherTotal = (draft.teacher_items||[]).reduce((s,i)=>s+Number(i.points||0),0);

        return (
          <div className="grid gap-6">
            {/* ── Learning Items ── */}
            <div>
              <div className="mb-3 flex items-center justify-between">
                <div>
                  <h3 className="font-extrabold">📚 Learning Items</h3>
                  <p className="muted-text text-xs">Total possible: <strong>{learningTotal} pts</strong></p>
                </div>
                <button onClick={addLearning} className="app-button focus-ring inline-flex items-center gap-1 rounded px-3 py-2 text-sm font-extrabold"><Plus size={14}/> Add</button>
              </div>
              <div className="grid gap-2">
                {(draft.learning_items||[]).map((item, idx) => (
                  <div key={item.db_key} className="glass-panel flex items-center gap-3 rounded-lg p-3">
                    <input className="flex-1 bg-transparent font-semibold outline-none text-sm" value={item.label} onChange={(e)=>updateLearning(idx,'label',e.target.value)} placeholder="Label" />
                    <div className="flex items-center gap-1">
                      <input className="w-16 rounded border line-border bg-transparent px-2 py-1 text-center font-extrabold text-sm" type="number" value={item.points} onChange={(e)=>updateLearning(idx,'points',e.target.value)} />
                      <span className="muted-text text-xs">pts</span>
                    </div>
                    <button onClick={()=>removeLearning(idx)} className="text-red-500 shrink-0"><Trash2 size={14}/></button>
                  </div>
                ))}
              </div>
            </div>

            {/* ── Hanhagos ── */}
            <div>
              <div className="mb-3 flex items-center justify-between">
                <div>
                  <h3 className="font-extrabold">✋ Daily Hanhagos</h3>
                  <div className="flex items-center gap-2 mt-1">
                    <span className="muted-text text-xs">Bonus per hanhaga:</span>
                    <input className="w-14 rounded border line-border bg-transparent px-2 py-1 text-center font-extrabold text-sm" type="number" value={draft.hanhaga_bonus_per_item??5} onChange={(e)=>setNum('hanhaga_bonus_per_item',e.target.value)} />
                    <span className="muted-text text-xs">pts · Max bonus: <strong>{hanhagaMax} pts</strong></span>
                  </div>
                </div>
                <button onClick={addHanhaga} className="app-button focus-ring inline-flex items-center gap-1 rounded px-3 py-2 text-sm font-extrabold"><Plus size={14}/> Add</button>
              </div>
              <div className="grid gap-2">
                {(draft.hanhaga_items||[]).map((item, idx) => (
                  <div key={item.db_key} className="glass-panel flex items-center gap-3 rounded-lg p-3">
                    <input className="flex-1 bg-transparent font-semibold outline-none text-sm" value={item.label} onChange={(e)=>updateHanhaga(idx,'label',e.target.value)} placeholder="Label" />
                    <button onClick={()=>removeHanhaga(idx)} className="text-red-500 shrink-0"><Trash2 size={14}/></button>
                  </div>
                ))}
              </div>
            </div>

            {/* ── Teacher Items ── */}
            <div>
              <div className="mb-3 flex items-center justify-between">
                <div>
                  <h3 className="font-extrabold">🎓 Teacher Items</h3>
                  <p className="muted-text text-xs">Items teachers mark for their class · Total: <strong>{teacherTotal} pts</strong></p>
                </div>
                <button onClick={addTeacher} className="app-button focus-ring inline-flex items-center gap-1 rounded px-3 py-2 text-sm font-extrabold"><Plus size={14}/> Add</button>
              </div>
              {(draft.teacher_items||[]).length === 0 && (
                <p className="muted-text text-sm font-semibold glass-panel rounded-lg px-4 py-3">No teacher items yet. Add items here that teachers can mark for students (e.g. "Tested on Maamar").</p>
              )}
              <div className="grid gap-2">
                {(draft.teacher_items||[]).map((item, idx) => (
                  <div key={item.db_key} className="glass-panel flex items-center gap-3 rounded-lg p-3">
                    <input className="flex-1 bg-transparent font-semibold outline-none text-sm" value={item.label} onChange={(e)=>updateTeacher(idx,'label',e.target.value)} placeholder="Label" />
                    <div className="flex items-center gap-1">
                      <input className="w-16 rounded border line-border bg-transparent px-2 py-1 text-center font-extrabold text-sm" type="number" value={item.points||0} onChange={(e)=>updateTeacher(idx,'points',e.target.value)} />
                      <span className="muted-text text-xs">pts</span>
                    </div>
                    <button onClick={()=>removeTeacher(idx)} className="text-red-500 shrink-0"><Trash2 size={14}/></button>
                  </div>
                ))}
              </div>
            </div>

            {/* ── Period / Week Dates ── */}
            <div>
              <h3 className="mb-1 font-extrabold">📅 Competition Period</h3>
              <p className="muted-text mb-3 text-xs font-semibold">Set any start and end date — can be 3 days, 7 days, 2 weeks, whatever you need. Weekly points in the roster show totals within this range.</p>
              <div className="grid gap-3 sm:grid-cols-2">
                <label className="grid gap-1">
                  <span className="muted-text text-xs font-extrabold uppercase tracking-[0.08em]">Period Start Date</span>
                  <input className="focus-ring rounded border line-border bg-transparent px-3 py-2 font-bold" type="date" value={wStart} onChange={(e) => setWStart(e.target.value)} />
                </label>
                <label className="grid gap-1">
                  <span className="muted-text text-xs font-extrabold uppercase tracking-[0.08em]">Period End Date</span>
                  <input className="focus-ring rounded border line-border bg-transparent px-3 py-2 font-bold" type="date" value={wEnd} onChange={(e) => setWEnd(e.target.value)} />
                </label>
              </div>
              {wStart && wEnd && (
                <p className="muted-text mt-2 text-xs font-semibold">
                  {Math.round((new Date(wEnd) - new Date(wStart)) / 86400000) + 1} day period · {wStart} → {wEnd}
                </p>
              )}
              <p className="muted-text mt-2 text-xs font-semibold">⚠ After saving here, also run the SQL in Supabase to update the <code>camper_profiles</code> view so it reads from <code>week_start_date</code> and <code>week_end_date</code> in <code>mivtza_config</code>.</p>
            </div>

            {/* ── Thresholds ── */}
            <div>
              <h3 className="mb-3 font-extrabold">🏆 Thresholds</h3>
              <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                {[
                  { key: 'standard_event_threshold', label: 'Standard Event (pts/period)' },
                  { key: 'vip_event_threshold',      label: 'VIP Event (pts/period)' },
                  { key: 'tier_platinum',             label: 'Platinum Card (lifetime pts)' },
                  { key: 'tier_black',                label: 'Black Card (lifetime pts)' },
                ].map(({ key, label }) => (
                  <label key={key} className="grid gap-1">
                    <span className="muted-text text-xs font-extrabold uppercase tracking-[0.08em]">{label}</span>
                    <input className="focus-ring rounded border line-border bg-transparent px-3 py-2 font-bold text-sm" type="number" value={draft[key]??''} onChange={(e)=>setNum(key,e.target.value)} />
                  </label>
                ))}
              </div>
            </div>

            {/* ── Summary + Save ── */}
            <div className="glass-panel rounded-lg p-4">
              <p className="text-sm font-semibold">
                <span className="font-extrabold">Max daily score:</span> {learningTotal} (learning) + {hanhagaMax} (hanhagos) + {teacherTotal} (teacher) = <span className="shimmer-text font-extrabold">{learningTotal + hanhagaMax + teacherTotal} pts</span>
              </p>
            </div>
            <button className="app-button focus-ring inline-flex items-center gap-2 rounded px-5 py-3 font-extrabold" onClick={() => onSave(draft, wStart, wEnd)}>
              <Save size={18} /> Save All Config
            </button>
          </div>
        );
      }

      function AccessList({ title, icon: Icon, campers, onSelect }) {
        return (
          <div className="glass-panel rounded-lg p-5">
            <h2 className="mb-4 flex items-center gap-2 text-lg font-extrabold"><Icon className="accent-text" /> {title}</h2>
            <div className="grid gap-2">
              {campers.length === 0 && <p className="muted-text text-sm font-semibold">No campers in this group.</p>}
              {campers.map((camper) => (
                <button
                  key={camper.id}
                  onClick={() => onSelect && onSelect(camper)}
                  className="focus-ring flex w-full items-center justify-between rounded border line-border px-3 py-2 text-left transition hover:scale-[1.01] hover:accent-bg"
                >
                  <span className="font-bold">{camper.name}</span>
                  <span className="muted-text text-sm font-semibold">{displayValue(camper.weekly_points)} pts</span>
                </button>
              ))}
            </div>
          </div>
        );
      }

      // ── Camper History Audit Modal ───────────────────────────────────────
      function tierBadgeClass(status) {
        const s = normalizeStatus(status);
        if (s === 'Black') return 'bg-black text-white border border-white/30';
        if (s === 'Platinum') return 'bg-slate-300 text-slate-900 border border-slate-400';
        return 'bg-amber-400 text-amber-950 border border-amber-500'; // Gold
      }

      function CamperHistoryModal({ camper, appConfig, periodStart, periodEnd, toast, onClose, onAdjusted }) {
        const [entries, setEntries] = useState([]);
        const [loading, setLoading] = useState(true);
        const [filter, setFilter] = useState('all'); // 'all' | 'missing'
        const [quickAdjustAmount, setQuickAdjustAmount] = useState('');
        const [adjusting, setAdjusting] = useState(false);
        const [editingItem, setEditingItem] = useState(null); // { date, db_key } | null
        const [editValue, setEditValue] = useState('');
        const [backfillOpenDate, setBackfillOpenDate] = useState(null); // date string | null

        const reloadEntries = () => {
          setLoading(true);
          return supabase.from('daily_entries').select('*').eq('camper_id', camper.id).then(({ data }) => {
            setEntries(data || []);
            setLoading(false);
          });
        };

        useEffect(() => {
          if (!camper) return;
          reloadEntries();
        }, [camper?.id]);

        if (!camper) return null;

        // Re-fetches this one camper's full profile (total_points, weekly_points,
        // card_status) from the camper_profiles view — the view recomputes these
        // automatically from daily_entries, so any delete/edit/backfill just
        // needs this refetch to reflect everywhere: modal header, roster,
        // access-list tier columns. No manual point math needed on our end.
        const refreshCamperTotals = async () => {
          const { data } = await supabase.from(CAMPER_READ_TABLE).select('*').eq('id', camper.id).maybeSingle();
          if (data) onAdjusted && onAdjusted(data);
        };

        // ── Quick Points Adjustment ──────────────────────────────────────────
        const adjustPoints = async (delta) => {
          const pts = Number(quickAdjustAmount);
          if (!pts || pts <= 0) { toast.error('Enter a points amount greater than 0.'); return; }
          setAdjusting(true);
          const nextManual = Number(camper.manual_points_adjustment || 0) + (delta * pts);
          const { error } = await supabase.from(CAMPER_WRITE_TABLE).update({ manual_points_adjustment: nextManual }).eq('id', camper.id);
          setAdjusting(false);
          if (error) { toast.error(`Failed: ${error.message}`); return; }
          toast.success(`${delta > 0 ? '+' : '-'}${pts} pts applied to ${camper.name} ✓`);
          setQuickAdjustAmount('');
          refreshCamperTotals();
        };

        const allItems = [...(appConfig.learning_items||[]), ...(appConfig.hanhaga_items||[]), ...(appConfig.teacher_items||[])];

        const entryByDate = {};
        entries.forEach((row) => { entryByDate[row.entry_date] = row; });

        const rangeStart = periodStart || shiftDate(today(), -13);
        const rangeEnd = periodEnd || today();
        const allDates = enumerateDateRange(rangeStart, rangeEnd).reverse();

        const checkedItemsFor = (row) => {
          if (!row) return [];
          const flat = { ...row, ...(row.entry_data || {}), ...(row.teacher_data || {}) };
          return allItems.filter((item) => !!flat[item.db_key]);
        };

        const visibleDates = filter === 'missing' ? allDates.filter((d) => !entryByDate[d]) : allDates;

        // ── Delete one logged item for one date ─────────────────────────────
        // There's no separate row-per-item in this schema — each date has ONE
        // daily_entries row with a boolean column per item. "Deleting a log"
        // means unchecking that column for this date, then deleting the whole
        // row if that leaves nothing else marked (mirrors the same safe
        // pattern used everywhere else in the app for consistency).
        const deleteLogItem = async (dateStr, item) => {
          if (!window.confirm('Are you sure you want to delete this log entry?')) return;
          const row = entryByDate[dateStr];
          if (!row) return;

          const known = { camper_id: camper.id, entry_date: dateStr };
          const extraEntry = { ...(row.entry_data || {}) };
          const extraTeacher = { ...(row.teacher_data || {}) };

          if (KNOWN_ENTRY_COLUMNS.has(item.db_key)) known[item.db_key] = false;
          else if (item.db_key in extraEntry) extraEntry[item.db_key] = false;
          else if (item.db_key in extraTeacher) extraTeacher[item.db_key] = false;

          const flatCheck = { ...row, ...known, ...extraEntry, ...extraTeacher };
          const stillAnyTrue = allItems.some((i) => !!flatCheck[i.db_key]);

          let error;
          if (!stillAnyTrue) {
            ({ error } = await supabase.from('daily_entries').delete().eq('camper_id', camper.id).eq('entry_date', dateStr));
          } else {
            const payload = { ...known };
            if (Object.keys(extraEntry).length) payload.entry_data = extraEntry;
            if (Object.keys(extraTeacher).length) payload.teacher_data = extraTeacher;
            ({ error } = await supabase.from('daily_entries').upsert(payload, { onConflict: 'camper_id,entry_date' }));
          }
          if (error) { toast.error(error.message); return; }
          toast.success('Log entry deleted ✓');
          reloadEntries();
          refreshCamperTotals();
        };

        // ── Edit an item's point contribution ───────────────────────────────
        // Points-per-item are fixed by the shared app configuration, not
        // stored per log entry — there's no individual "this Chumash was
        // worth 20pts" row to rewrite. So "editing" applies the difference
        // between the new value and the item's normal point value as a
        // manual credit adjustment on the camper (the same field the Quick
        // Points widget above uses), which is the only per-camper point
        // override the schema actually supports. The result is genuinely
        // reflected in their total — just via that shared adjustment field
        // rather than a rewritten per-item number.
        const saveItemPointEdit = async (item) => {
          const newValue = Number(editValue);
          if (isNaN(newValue)) { toast.error('Enter a valid number.'); return; }
          const delta = newValue - Number(item.points || 0);
          if (delta === 0) { setEditingItem(null); return; }
          const nextManual = Number(camper.manual_points_adjustment || 0) + delta;
          const { error } = await supabase.from(CAMPER_WRITE_TABLE).update({ manual_points_adjustment: nextManual }).eq('id', camper.id);
          if (error) { toast.error(error.message); return; }
          toast.success(`Adjusted by ${delta > 0 ? '+' : ''}${delta} pts ✓`);
          setEditingItem(null);
          refreshCamperTotals();
        };

        // ── Backfill a missing day ───────────────────────────────────────────
        const backfillItem = async (dateStr, item) => {
          const row = entryByDate[dateStr];
          const payload = { camper_id: camper.id, entry_date: dateStr };
          if (KNOWN_ENTRY_COLUMNS.has(item.db_key)) payload[item.db_key] = true;
          else payload.entry_data = { ...(row?.entry_data || {}), [item.db_key]: true };

          const { error } = await supabase.from('daily_entries').upsert(payload, { onConflict: 'camper_id,entry_date' });
          if (error) { toast.error(error.message); return; }
          toast.success(`${item.label} backfilled for ${formatDateHuman(dateStr)} ✓`);
          // Deliberately NOT closing the picker here — an admin should be
          // able to click Chumash, then Tanya, then Rambam for the same day
          // without the dropdown vanishing after every single click.
          reloadEntries();
          refreshCamperTotals();
        };

        return (
          <div className="fixed inset-0 z-50 grid place-items-center bg-black/70 backdrop-blur-md p-4">
            <div className="glass-panel flex max-h-[85vh] w-full max-w-lg flex-col rounded-2xl shadow-luxury">
              {/* Header */}
              <div className="flex items-start justify-between gap-3 border-b line-border p-5">
                <div className="min-w-0">
                  <h2 className="truncate text-2xl font-extrabold shimmer-text">{camper.name}</h2>
                  <div className="mt-2 flex flex-wrap items-center gap-2">
                    <span className={`rounded-full px-3 py-1 text-xs font-extrabold uppercase tracking-wide ${tierBadgeClass(camper.card_status)}`}>
                      {normalizeStatus(camper.card_status)}
                    </span>
                    <span className="muted-text text-sm font-semibold">{displayValue(camper.total_points)} total pts</span>
                  </div>
                </div>
                <button onClick={onClose} className="focus-ring glass-panel shrink-0 rounded-lg p-2 hover:scale-105" aria-label="Close">
                  <X size={18} />
                </button>
              </div>

              {/* Quick Points Adjustment */}
              <div className="border-b line-border p-4">
                <p className="muted-text mb-2 text-xs font-extrabold uppercase tracking-widest">Quick Points Adjustment</p>
                <div className="flex items-center gap-2">
                  <input
                    className="focus-ring w-24 rounded border line-border bg-transparent px-3 py-2 text-center font-bold outline-none"
                    type="number"
                    min="0"
                    placeholder="Pts"
                    value={quickAdjustAmount}
                    onChange={(e) => setQuickAdjustAmount(e.target.value)}
                  />
                  <button
                    onClick={() => adjustPoints(1)}
                    disabled={adjusting}
                    className="app-button focus-ring flex flex-1 items-center justify-center gap-1 rounded px-3 py-2 text-sm font-extrabold disabled:opacity-60"
                  >
                    <Plus size={15} /> Add Points
                  </button>
                  <button
                    onClick={() => adjustPoints(-1)}
                    disabled={adjusting}
                    className="focus-ring flex flex-1 items-center justify-center gap-1 rounded border border-red-400/40 bg-red-500/10 px-3 py-2 text-sm font-extrabold text-red-500 disabled:opacity-60"
                  >
                    <X size={15} /> Deduct Points
                  </button>
                </div>
              </div>

              {/* Filter pills */}
              <div className="flex gap-2 border-b line-border p-4">
                <button
                  onClick={() => setFilter('all')}
                  className={classNames('focus-ring rounded-full px-4 py-1.5 text-xs font-extrabold transition', filter === 'all' ? 'app-button' : 'glass-panel')}
                >
                  Show All Logs
                </button>
                <button
                  onClick={() => setFilter('missing')}
                  className={classNames('focus-ring rounded-full px-4 py-1.5 text-xs font-extrabold transition', filter === 'missing' ? 'app-button' : 'glass-panel')}
                >
                  Show Missing Days Only
                </button>
              </div>

              {/* Timeline */}
              <div className="flex-1 overflow-y-auto p-5">
                {loading && <p className="muted-text text-sm font-semibold">Loading history…</p>}
                {!loading && visibleDates.length === 0 && (
                  <p className="muted-text text-sm font-semibold">
                    {filter === 'missing' ? 'No missing days in this range ✓' : 'No dates in range.'}
                  </p>
                )}
                <div className="grid gap-4">
                  {!loading && visibleDates.map((d) => {
                    const row = entryByDate[d];
                    const checked = checkedItemsFor(row);
                    const isBackfillOpen = backfillOpenDate === d;
                    // Only offer items not already checked today — avoids a
                    // confusing "add" option for something already logged.
                    const availableToAdd = allItems.filter((item) => !checked.some((c) => c.db_key === item.db_key));
                    return (
                      <div key={d}>
                        <p className="mb-2 text-xs font-extrabold uppercase tracking-widest opacity-70">{formatDateHuman(d)}</p>

                        {/* Checked items — only rendered when there's at least one */}
                        {checked.length > 0 && (
                          <div className="mb-2 grid gap-1.5">
                            {checked.map((item) => {
                              const isEditing = editingItem?.date === d && editingItem?.db_key === item.db_key;
                              return (
                                <div key={item.db_key} className="glass-panel flex items-center justify-between gap-2 rounded-lg px-3 py-2">
                                  {isEditing ? (
                                    <>
                                      <span className="text-sm font-semibold">{item.label}</span>
                                      <div className="flex items-center gap-1">
                                        <input
                                          autoFocus
                                          type="number"
                                          className="w-16 rounded border line-border bg-transparent px-2 py-1 text-center text-xs font-bold outline-none"
                                          value={editValue}
                                          onChange={(e) => setEditValue(e.target.value)}
                                          onKeyDown={(e) => e.key === 'Enter' && saveItemPointEdit(item)}
                                        />
                                        <button onClick={() => saveItemPointEdit(item)} className="focus-ring rounded p-1 text-green-500 hover:scale-110" title="Save"><Check size={14} /></button>
                                        <button onClick={() => setEditingItem(null)} className="focus-ring rounded p-1 muted-text hover:scale-110" title="Cancel"><X size={14} /></button>
                                      </div>
                                    </>
                                  ) : (
                                    <>
                                      <span className="text-sm font-semibold">{item.label}</span>
                                      <div className="flex items-center gap-2">
                                        {item.points ? <span className="accent-text text-xs font-extrabold">+{item.points}pts</span> : <Check size={14} className="text-green-500" />}
                                        <button
                                          onClick={() => { setEditingItem({ date: d, db_key: item.db_key }); setEditValue(String(item.points ?? 0)); }}
                                          className="focus-ring rounded p-1 muted-text hover:scale-110 hover:accent-text"
                                          title="Edit points"
                                        >
                                          <PencilLine size={13} />
                                        </button>
                                        <button
                                          onClick={() => deleteLogItem(d, item)}
                                          className="focus-ring rounded p-1 text-red-500 hover:scale-110"
                                          title="Delete this log entry"
                                        >
                                          <Trash2 size={13} />
                                        </button>
                                      </div>
                                    </>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}

                        {/* Empty-state banner — only when truly zero items marked */}
                        {checked.length === 0 && (
                          <div className="mb-2 rounded-lg border border-red-400/40 bg-red-500/10 px-3 py-2 text-sm font-bold text-red-500">
                            ⚠ No marks recorded
                          </div>
                        )}

                        {/* Persistent "+ Add Item to Date" — always present,
                            regardless of whether this day already has marks. */}
                        {!isBackfillOpen ? (
                          availableToAdd.length > 0 && (
                            <button
                              onClick={() => setBackfillOpenDate(d)}
                              className="focus-ring inline-flex w-fit items-center gap-1 rounded-lg px-2 py-1 text-xs font-extrabold accent-text hover:underline"
                            >
                              <Plus size={13} /> Add Item to Date
                            </button>
                          )
                        ) : (
                          <div className="glass-panel rounded-lg p-3">
                            <div className="mb-2 flex items-center justify-between">
                              <p className="muted-text text-xs font-extrabold uppercase tracking-widest">Select item to add</p>
                              <button onClick={() => setBackfillOpenDate(null)} className="focus-ring rounded p-0.5"><X size={13} /></button>
                            </div>
                            <div className="flex flex-wrap gap-1.5">
                              {availableToAdd.length === 0 && (
                                <p className="muted-text text-xs font-semibold">All items already logged for this day ✓</p>
                              )}
                              {availableToAdd.map((item) => (
                                <button
                                  key={item.db_key}
                                  onClick={() => backfillItem(d, item)}
                                  className="focus-ring rounded-full border line-border px-3 py-1 text-xs font-bold transition hover:accent-bg"
                                >
                                  {item.label}{item.points ? ` · ${item.points}pts` : ''}
                                </button>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Close footer */}
              <div className="border-t line-border p-4">
                <button onClick={onClose} className="app-button focus-ring w-full rounded-lg px-5 py-3 font-extrabold">Close</button>
              </div>
            </div>
          </div>
        );
      }

      // ── Teacher Cards Panel (admin section) ──────────────────────────────
      // Helper — handle both old string format and new object format
      // ── Teacher Allowlist Panel — read-only view ────────────────────────
      // Accounts are managed directly in Supabase (Table Editor → teacher_profiles).
      // Add a row with: email, name, bunk. That's the entire "sign up" flow —
      // no in-app account creation needed since Google handles authentication.
      function TeacherAccountsPanel() {
        const [teachers, setTeachers] = useState([]);
        const [loading, setLoading] = useState(true);
        const toast = useToast();

        // Bulk import state
        const [showBulk, setShowBulk] = useState(false);
        const [bulkRaw, setBulkRaw] = useState('');
        const [defaultPassword, setDefaultPassword] = useState('');
        const [importing, setImporting] = useState(false);
        const [importProgress, setImportProgress] = useState(null); // {done, total}

        const load = () => {
          setLoading(true);
          supabase.from('teacher_profiles').select('email,name,bunk').order('name').then(({ data }) => {
            setTeachers(data || []);
            setLoading(false);
          });
        };
        useEffect(load, []);

        const removeTeacher = async (t) => {
          if (!window.confirm(`Remove ${t.name}'s access?`)) return;
          const { error } = await supabase.from('teacher_profiles').delete().eq('email', t.email);
          if (error) toast.error(`Failed: ${error.message}`);
          else { toast.success('Removed ✓'); load(); }
        };

        // Save an edited bunk inline (no separate save button — saves on blur)
        const updateBunk = async (email, bunk) => {
          const { error } = await supabase.from('teacher_profiles').update({ bunk: bunk || null }).eq('email', email);
          if (error) toast.error(`Failed to save bunk: ${error.message}`);
        };

        // Parse pasted rows: "Name<TAB>email" per line, or "Name,email".
        // Skips the header row automatically if it says "name"/"email".
        const parseRows = () => {
          const lines = bulkRaw.replace(/\r/g, '').split('\n').map((l) => l.trim()).filter(Boolean);
          const rows = [];
          for (const line of lines) {
            const parts = line.includes('\t') ? line.split('\t') : line.split(',');
            if (parts.length < 2) continue;
            const name = parts[0].trim();
            const email = parts[1].trim().toLowerCase();
            if (!name || !email || !email.includes('@')) continue;
            if (name.toLowerCase() === 'name' && email.toLowerCase() === 'email') continue; // header row
            rows.push({ name, email });
          }
          return rows;
        };

        const bulkImport = async () => {
          const rows = parseRows();
          if (rows.length === 0) { toast.error('Nothing parsed — paste Name and Email columns (from the sheet, tab-separated).'); return; }
          if (!defaultPassword || defaultPassword.length < 6) { toast.error('Set a default password (min 6 characters) for all new accounts.'); return; }

          setImporting(true);
          setImportProgress({ done: 0, total: rows.length });
          let created = 0, alreadyHadAccount = 0, failed = 0;

          for (let i = 0; i < rows.length; i++) {
            const { name, email } = rows[i];
            try {
              // Try creating a real Supabase Auth account with the default password.
              const { error: signUpError } = await supabase.auth.signUp({ email, password: defaultPassword });
              // Always sign back out immediately so the admin's browser session
              // isn't left authenticated as whichever teacher we just created.
              await supabase.auth.signOut();

              if (signUpError && !signUpError.message.toLowerCase().includes('already registered')) {
                failed++;
              } else if (signUpError) {
                alreadyHadAccount++;
              } else {
                created++;
              }

              // Either way, make sure they're on the allowlist (upsert by email).
              await supabase.from('teacher_profiles').upsert({ email, name }, { onConflict: 'email' });
            } catch {
              failed++;
            }
            setImportProgress({ done: i + 1, total: rows.length });
          }

          setImporting(false);
          setImportProgress(null);
          toast.success(`${created} new account(s), ${alreadyHadAccount} already existed, ${failed} failed ✓`);
          setBulkRaw('');
          setShowBulk(false);
          load();
        };

        return (
          <div className="glass-panel rounded-lg p-5">
            <ToastStack toasts={toast.toasts} remove={toast.remove} />
            <div className="mb-1 flex items-center justify-between">
              <h2 className="flex items-center gap-2 text-xl font-extrabold"><Users className="accent-text" /> Teacher / Counselor Access</h2>
              <button onClick={() => setShowBulk((v) => !v)} className="app-button focus-ring inline-flex items-center gap-1 rounded px-3 py-1.5 text-xs font-extrabold">
                <Plus size={13} /> Bulk Add
              </button>
            </div>
            <p className="muted-text mb-4 text-xs font-semibold">
              They can sign in with <strong>Google</strong> using the email below (no password needed) — or with <strong>email + the default password</strong> you set here. Add a bunk so their portal only shows their students.
            </p>

            {showBulk && (
              <div className="glass-panel mb-4 rounded-lg p-4 grid gap-3">
                <p className="text-xs font-semibold">Paste Name + Email rows from your sheet (tab or comma separated, one per line):</p>
                <textarea
                  className="glass-panel focus-ring w-full rounded-lg p-3 text-xs font-mono outline-none"
                  rows={6}
                  placeholder={"ostro\tostroschneur101@gmail.com\nBarber\tdovidbarber1234@gmail.com\n…"}
                  value={bulkRaw}
                  onChange={(e) => setBulkRaw(e.target.value)}
                />
                <TextInput icon={Lock} type="text" placeholder="Default password for all new accounts (min 6 chars)" value={defaultPassword} onChange={(e) => setDefaultPassword(e.target.value)} />
                <button onClick={bulkImport} disabled={importing} className="app-button focus-ring inline-flex items-center justify-center gap-2 rounded px-5 py-3 font-extrabold disabled:opacity-70">
                  {importing ? <RefreshCw size={16} className="animate-spin" /> : <Save size={16} />}
                  {importing && importProgress ? `Creating ${importProgress.done}/${importProgress.total}…` : 'Create All Accounts'}
                </button>
              </div>
            )}

            <div className="grid gap-2">
              {loading && <p className="muted-text text-sm font-semibold">Loading…</p>}
              {!loading && teachers.length === 0 && <p className="muted-text text-sm font-semibold">No teachers added yet.</p>}
              {teachers.map((t) => (
                <div key={t.email} className="glass-panel flex items-center gap-3 rounded-lg p-3">
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-sm truncate">{t.name}</p>
                    <p className="muted-text text-xs font-semibold truncate">{t.email}</p>
                  </div>
                  <input
                    className="w-32 rounded border line-border bg-transparent px-2 py-1.5 text-xs font-semibold outline-none"
                    placeholder="Bunk (all if blank)"
                    defaultValue={t.bunk || ''}
                    onBlur={(e) => updateBunk(t.email, e.target.value)}
                  />
                  <button onClick={() => removeTeacher(t)} title="Remove access" className="focus-ring inline-flex h-8 w-8 shrink-0 items-center justify-center rounded border border-red-400/40 text-red-500 hover:scale-105"><Trash2 size={14} /></button>
                </div>
              ))}
            </div>
          </div>
        );
      }




      // ── Teacher Portal ────────────────────────────────────────────────────
      // Staff have unlimited back-marking here by design: unlike
      // CamperDashboard, the date arrows/picker below are never clamped to
      // `allowed_back_marking_days` (no min/max, no isBlocked/isLocked check
      // at all) — that limit is intentionally camper-only. Only an
      // authenticated teacher_profiles session ever reaches this component.
      function TeacherPortal({ onLogout, teacherName, bunk }) {
        const [appConfig, setAppConfig] = useState(DEFAULT_CONFIG);
        const [allCampers, setAllCampers] = useState([]);
        const [search, setSearch] = useState('');
        const [selected, setSelected] = useState(null);
        const [date, setDate] = useState(() => shiftDate(today(), -1)); // defaults to yesterday
        const [entry, setEntry] = useState({});
        const [loadingEntry, setLoadingEntry] = useState(false);
        const [nfcListening, setNfcListening] = useState(false);
        const [submitted, setSubmitted] = useState(false);
        const [showClubScanner, setShowClubScanner] = useState(false);
        const [clubScannerClub, setClubScannerClub] = useState(null); // null = picker step, object = active session
        const toast = useToast();
        const ndefRef = useRef(null);
        const nfcProcessingRef = useRef(false); // debounce multiple reads

        // The teacher_profiles.bunk column holds different things depending on
        // role: for a counselor it's a Kevutza/bunk string (e.g. "Kevutza Zayin
        // (Bunkhouse #12)") which matches campers.bunk; for a learning teacher
        // it's their Rabbi name (e.g. "Rabbi Jackobson") which matches
        // campers.class instead. Since both roles share one 'bunk' field, we
        // check it against EITHER camper column — exact match only (no
        // substring/parentheses logic), case-insensitive and whitespace-trimmed.
        const exactMatch = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
        const campers = bunk
          ? allCampers.filter((c) => exactMatch(c.bunk, bunk) || exactMatch(c.class, bunk))
          : allCampers;

        useEffect(() => {
          Promise.all([
            supabase.from('mivtza_config').select('config_json').limit(1).maybeSingle(),
            supabase.from(CAMPER_READ_TABLE).select('*').order('name'),
          ]).then(([{ data: cfg }, { data: roster }]) => {
            if (cfg?.config_json) try { setAppConfig(JSON.parse(cfg.config_json)); } catch {}
            setAllCampers(roster || []);
          });
        }, []);

        // Fetches whatever is already marked for this camper on the current
        // date and pre-fills the checkboxes, so the teacher sees the true,
        // current state instead of a blank form every time.
        const loadEntryFor = async (camperId, forDate) => {
          setLoadingEntry(true);
          const { entry: filled } = await fetchDailyEntry(camperId, forDate, appConfig);
          setEntry(filled);
          setLoadingEntry(false);
        };

        const selectCamper = (c) => {
          setSelected(c);
          setSubmitted(false);
          loadEntryFor(c.id, date);
        };

        // If the teacher changes the date while a camper is already selected
        // (e.g. backfilling yesterday), re-sync the checkboxes for that date.
        useEffect(() => {
          if (selected) loadEntryFor(selected.id, date);
        }, [date]);

        const startNfc = async () => {
          if (!('NDEFReader' in window) || !window.isSecureContext) { toast.warning('NFC not available.'); return; }
          try {
            const ndef = new NDEFReader(); ndefRef.current = ndef;
            ndef.onreading = (e) => {
              // Debounce: NFC hardware often fires onreading 3-5× per tap
              if (nfcProcessingRef.current) return;
              nfcProcessingRef.current = true;
              setTimeout(() => { nfcProcessingRef.current = false; }, 2500);
              setNfcListening(false);
              const target = normalizeNfcId(e.serialNumber || '');
              const match = campers.find((c) => normalizeNfcId(c.nfc_id) === target);
              if (match) selectCamper(match);
              else toast.warning('Card not in your class roster.');
            };
            await ndef.scan(); setNfcListening(true);
          } catch { setNfcListening(false); }
        };

        // keepEditing=false ("Save & Next Student"): save then close the
        // overlay and return to the search list, as before.
        // keepEditing=true ("Save & Keep Editing"): save but leave the same
        // camper's overlay open so staff can flip the date picker and log
        // another day for the exact same kid without searching them up again.
        const submit = async (keepEditing = false) => {
          if (!selected) return;
          const allConfigItems = [...(appConfig.learning_items||[]), ...(appConfig.hanhaga_items||[]), ...(appConfig.teacher_items||[])];
          const { error } = await saveDailyEntry({
            camperId: selected.id,
            date,
            itemsToUpdate: [...(appConfig.learning_items||[]), ...(appConfig.teacher_items||[])], // teachers mark learning + teacher items, not hanhagos
            entryState: entry,
            extraJsonField: 'teacher_data',
            allConfigItems,
          });
          if (error) { toast.error(error.message); return; }
          setSubmitted(true);
          toast.success(`${selected.name} — saved ✓`);
          if (keepEditing) {
            setTimeout(() => setSubmitted(false), 1000);
          } else {
            setTimeout(() => { setSelected(null); setSearch(''); setSubmitted(false); }, 1500);
          }
        };

        const filteredCampers = search
          ? campers.filter((c) => c.name?.toLowerCase().includes(search.toLowerCase()))
          : [];

        return (
          <Shell status="Platinum" onLogout={onLogout}>
            <ToastStack toasts={toast.toasts} remove={toast.remove} />
            {showClubScanner ? (
              clubScannerClub ? (
                <ClubSessionPortal club={clubScannerClub} onBack={() => setClubScannerClub(null)} />
              ) : (
                <ClubPicker onBack={() => setShowClubScanner(false)} onSelect={setClubScannerClub} />
              )
            ) : (
            <div className="mx-auto max-w-2xl">
              <div className="mb-5 flex items-start justify-between gap-3">
                <div>
                  <p className="accent-text text-sm font-extrabold uppercase tracking-[0.2em]">Teacher / Counselor Portal</p>
                  <h1 className="mt-1 text-3xl font-extrabold">Mark Student Progress</h1>
                  {(teacherName || bunk) && (
                    <p className="muted-text mt-1 text-sm font-semibold">
                      {teacherName && <span>{teacherName}</span>}
                      {bunk && <span className="ml-2 accent-text font-extrabold">· {bunk}</span>}
                      {bunk && <span className="muted-text"> ({campers.length} students)</span>}
                    </p>
                  )}
                </div>
                <button
                  onClick={() => { setClubScannerClub(null); setShowClubScanner(true); }}
                  className="lux-card focus-ring shrink-0 inline-flex items-center gap-2 rounded-lg px-4 py-2.5 text-sm font-extrabold shadow-luxury"
                >
                  <Smartphone size={16} /> Club Scanner
                </button>
              </div>

              {!selected ? (
                <div className="glass-panel rounded-xl p-6 shadow-luxury">
                  <h2 className="mb-4 text-lg font-extrabold">Find a Student</h2>
                  <div className="flex flex-wrap gap-2 mb-4">
                    <label className="glass-panel flex min-w-0 flex-1 items-center gap-2 rounded-lg px-4 py-3">
                      <ScanLine size={18} className="muted-text shrink-0" />
                      <input autoFocus className="min-w-0 flex-1 bg-transparent font-semibold outline-none" placeholder="Type name…" value={search} onChange={(e) => setSearch(e.target.value)} />
                      {search && <button onClick={() => setSearch('')}><X size={14} /></button>}
                    </label>
                    <button onClick={startNfc} disabled={nfcListening} className="lux-card focus-ring inline-flex shrink-0 items-center gap-2 rounded-lg px-4 py-3 font-extrabold disabled:opacity-70">
                      {nfcListening ? <RefreshCw size={16} className="animate-spin" /> : <Smartphone size={16} />}
                      {nfcListening ? 'Tap card…' : 'Scan Card'}
                    </button>
                  </div>
                  {search && filteredCampers.length === 0 && <p className="muted-text text-sm font-semibold">No students found.</p>}
                  <div className="grid gap-2 max-h-80 overflow-y-auto">
                    {filteredCampers.map((c) => (
                      <button key={c.id} onClick={() => selectCamper(c)} className="glass-panel focus-ring flex items-center justify-between rounded-lg px-4 py-3 text-left hover:scale-[1.01]">
                        <span className="font-bold">{c.name}</span>
                        <span className="muted-text text-sm">{displayValue(c.weekly_points)} pts this week</span>
                      </button>
                    ))}
                  </div>
                </div>
              ) : (
                <div className="grid gap-4">
                  <div className="lux-card rounded-xl p-5 shadow-luxury">
                    <div className="flex items-center justify-between">
                      <div>
                        <p className="text-xs font-extrabold uppercase tracking-widest opacity-70">Marking for</p>
                        <p className="mt-1 text-2xl font-extrabold shimmer-text">{selected.name}</p>
                      </div>
                      <button onClick={() => setSelected(null)} className="glass-panel focus-ring rounded-lg px-3 py-2 text-sm font-bold shrink-0"><X size={16} /></button>
                    </div>

                    {/* Date navigator — arrows shift ±1 day, which re-triggers
                        the loadEntryFor effect below to re-fetch and re-fill
                        checkboxes for the newly selected date. */}
                    <div className="mt-4 flex items-center justify-center gap-2 border-t line-border pt-4">
                      <button
                        onClick={() => setDate((d) => shiftDate(d, -1))}
                        disabled={loadingEntry}
                        className="focus-ring flex h-9 w-9 shrink-0 items-center justify-center rounded-full glass-panel transition hover:scale-105 disabled:opacity-50"
                        aria-label="Previous day"
                      >
                        <ChevronLeft size={18} />
                      </button>

                      <div className="flex min-w-[200px] items-center justify-center gap-2 text-center">
                        <span className="text-sm font-extrabold">{formatDateHuman(date)}</span>
                        {loadingEntry && <RefreshCw size={12} className="muted-text animate-spin shrink-0" />}
                      </div>

                      <button
                        onClick={() => setDate((d) => shiftDate(d, 1))}
                        disabled={loadingEntry}
                        className="focus-ring flex h-9 w-9 shrink-0 items-center justify-center rounded-full glass-panel transition hover:scale-105 disabled:opacity-50"
                        aria-label="Next day"
                      >
                        <ChevronRight size={18} />
                      </button>

                      {/* Hidden native date picker — jump across weeks/months
                          without needing to tap the arrow dozens of times. */}
                      <label
                        className="focus-ring relative flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-full glass-panel transition hover:scale-105"
                        title="Jump to a specific date"
                      >
                        <CalendarDays size={15} />
                        <input
                          type="date"
                          value={date}
                          onChange={(e) => setDate(e.target.value)}
                          className="absolute inset-0 cursor-pointer opacity-0"
                        />
                      </label>
                    </div>
                  </div>

                  {/* Learning items */}
                  {(appConfig.learning_items||[]).length > 0 && (
                    <div className="glass-panel rounded-xl p-5">
                      <h3 className="mb-3 flex items-center gap-2 font-extrabold"><Sparkles className="accent-text" size={18}/> Learning</h3>
                      <div className="grid gap-3 sm:grid-cols-2">
                        {(appConfig.learning_items||[]).map((item) => (
