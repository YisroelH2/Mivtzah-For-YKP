<!doctype html>
<html lang="en" data-theme="Gold">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>American Express Mivtza</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"]
          },
          boxShadow: {
            luxury: "0 28px 90px rgba(0,0,0,.22)",
            glow: "0 0 36px rgba(112,190,255,.22)"
          }
        }
      }
    };
  </script>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");

    :root {
      --bg: #f8f3e7;
      --bg-2: #fffdf8;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-solid: #ffffff;
      --text: #282520;
      --muted: #756e63;
      --line: rgba(121, 96, 46, 0.2);
      --accent: #c89c3b;
      --accent-2: #f1d38b;
      --accent-soft: rgba(200, 156, 59, 0.16);
      --card-gradient: linear-gradient(135deg, #fff7df 0%, #e6bf5f 46%, #fff3c6 100%);
      --luxury-border: linear-gradient(135deg, rgba(246,215,136,.9), rgba(164,117,24,.68), rgba(255,244,204,.92));
    }

    [data-theme="Platinum"] {
      --bg: #eef2f6;
      --bg-2: #ffffff;
      --panel: rgba(255, 255, 255, 0.72);
      --panel-solid: #fbfdff;
      --text: #17202a;
      --muted: #607080;
      --line: rgba(90, 111, 132, 0.22);
      --accent: #6f8498;
      --accent-2: #94d9ff;
      --accent-soft: rgba(101, 190, 255, 0.16);
      --card-gradient: linear-gradient(135deg, #f8fbff 0%, #bdc7d1 28%, #ffffff 48%, #8797a7 100%);
      --luxury-border: linear-gradient(135deg, rgba(255,255,255,.95), rgba(101,190,255,.66), rgba(113,126,140,.72));
    }

    [data-theme="Black"] {
      --bg: #050506;
      --bg-2: #111214;
      --panel: rgba(15, 16, 18, 0.84);
      --panel-solid: #0d0e10;
      --text: #f6f3ea;
      --muted: #aaa69c;
      --line: rgba(255, 255, 255, 0.14);
      --accent: #d7d1c4;
      --accent-2: #ffffff;
      --accent-soft: rgba(255, 255, 255, 0.1);
      --card-gradient: linear-gradient(135deg, #050506 0%, #191b1f 42%, #050506 100%);
      --luxury-border: linear-gradient(120deg, #ffffff, #45484f, #f7f2df, #18191d, #ffffff);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, var(--accent-soft), transparent 30rem),
        linear-gradient(140deg, var(--bg), var(--bg-2));
      transition: background 450ms ease, color 450ms ease;
    }

    .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .lux-card {
      position: relative;
      background: var(--card-gradient);
      border: 1px solid transparent;
      color: var(--text);
    }

    .lux-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: var(--luxury-border);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    [data-theme="Black"] .lux-card::before {
      background-size: 280% 280%;
      animation: cardBorder 5s linear infinite;
    }

    @keyframes cardBorder {
      0% { background-position: 0% 50%; }
      100% { background-position: 280% 50%; }
    }

    .muted { color: var(--muted); }
    .accent { color: var(--accent); }
    .accent-bg { background: var(--accent-soft); }
    .line-border { border-color: var(--line); }

    .btn {
      background: var(--text);
      color: var(--bg-2);
      border-radius: .5rem;
      font-weight: 800;
      transition: transform 150ms ease, opacity 150ms ease;
    }

    [data-theme="Black"] .btn {
      background: #f6f3ea;
      color: #050506;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: .5; transform: none; }

    input, select {
      color: var(--text);
    }

    option {
      color: #111827;
      background: #ffffff;
    }

    .focusable:focus {
      outline: 3px solid color-mix(in srgb, var(--accent-2), transparent 50%);
      outline-offset: 3px;
    }

    .tile-checked {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 0 28px rgba(112,190,255,.12);
    }

    .hidden-scan-input {
      opacity: .02;
      position: absolute;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    const learningKeys = [
      "learn_maamar",
      "learn_chumash",
      "learn_tanya",
      "learn_rambam",
      "learn_hayom_yom"
    ];

    const hanhagaKeys = [
      "hanhaga_negel_vasser",
      "hanhaga_mikvah",
      "hanhaga_brochos",
      "hanhaga_tehillim",
      "hanhaga_bentching",
      "hanhaga_bendel"
    ];

    const fieldLabels = {
      learn_maamar: "Maamar",
      learn_chumash: "Chumash",
      learn_tanya: "Tanya",
      learn_rambam: "Rambam",
      learn_hayom_yom: "Hayom Yom",
      hanhaga_negel_vasser: "Negel Vasser",
      hanhaga_mikvah: "Mikvah",
      hanhaga_brochos: "Brochos & Krias Shema",
      hanhaga_tehillim: "Tehillim",
      hanhaga_bentching: "Bentching",
      hanhaga_bendel: "Bendel"
    };

    const state = {
      supabase: null,
      camper: null,
      config: {},
      roster: [],
      rules: {},
      entry: blankEntry(),
      correction: {
        camper_id: "",
        entry_date: today(),
        manual_points_adjustment: 0,
        ...blankEntry()
      },
      message: "",
      scanBuffer: "",
      scanTimer: null
    };

    const app = document.getElementById("app");

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function blankEntry() {
      return Object.fromEntries([...learningKeys, ...hanhagaKeys].map(key => [key, false]));
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeStatus(status) {
      const value = String(status || "Gold").trim().toLowerCase();
      if (value === "black") return "Black";
      if (value === "platinum") return "Platinum";
      return "Gold";
    }

    function setTheme(status) {
      document.documentElement.dataset.theme = normalizeStatus(status);
    }

    function getStoredBackend() {
      return {
        url: localStorage.getItem("mivtza_supabase_url") || "",
        anon: localStorage.getItem("mivtza_supabase_anon") || "",
        adminCode: localStorage.getItem("mivtza_admin_code") || ""
      };
    }

    function saveBackendFromForm(prefix) {
      const url = document.getElementById(`${prefix}-url`).value.trim();
      const anon = document.getElementById(`${prefix}-anon`).value.trim();
      const adminCode = document.getElementById(`${prefix}-admin-code`).value.trim();

      localStorage.setItem("mivtza_supabase_url", url);
      localStorage.setItem("mivtza_supabase_anon", anon);
      localStorage.setItem("mivtza_admin_code", adminCode);

      initSupabase();
      state.message = "Backend connection saved on this device.";
      render();
    }

    function initSupabase() {
      const backend = getStoredBackend();
      if (backend.url && backend.anon && window.supabase) {
        state.supabase = window.supabase.createClient(backend.url, backend.anon);
      } else {
        state.supabase = null;
      }
    }

    function isAdminRoute() {
      return location.hash === "#admin" ||
        location.search.includes("admin=1") ||
        location.pathname.toLowerCase().endsWith("/admin");
    }

    function icon(name, size = 18, extra = "") {
      return `<i data-lucide="${name}" class="${extra}" style="width:${size}px;height:${size}px"></i>`;
    }

    function refreshIcons() {
      if (window.lucide) window.lucide.createIcons();
    }

    function shell(content, options = {}) {
      const admin = Boolean(options.admin);
      const status = options.status || "Gold";
      setTheme(status);

      app.innerHTML = `
        <main class="min-h-screen px-4 py-5 sm:px-6 lg:px-8">
          <header class="mx-auto flex max-w-7xl items-center justify-between pb-5">
            <div class="flex items-center gap-3">
              <div class="lux-card flex h-11 w-16 items-center justify-center rounded-lg shadow-glow">
                ${icon("credit-card", 24)}
              </div>
              <div>
                <p class="text-sm font-black uppercase tracking-[0.16em]">American Express Mivtza</p>
                <p class="muted text-xs font-bold">Learn. Do. Earn. Grow.</p>
              </div>
            </div>

            <div class="flex items-center gap-2">
              ${
                admin
                  ? `<button class="glass focusable rounded px-4 py-2 text-sm font-bold" onclick="goCheckIn()">Check-In</button>`
                  : `<button class="glass focusable rounded px-4 py-2 text-sm font-bold" onclick="goAdmin()">Admin</button>`
              }
              ${
                options.logout
                  ? `<button class="glass focusable flex h-11 w-11 items-center justify-center rounded border line-border" title="Log out" onclick="logoutCamper()">${icon("log-out", 19)}</button>`
                  : ""
              }
            </div>
          </header>

          ${content}
        </main>
      `;

      refreshIcons();
    }

    function setupPanel(prefix = "setup", embedded = false) {
      const backend = getStoredBackend();
      return `
        <div class="${embedded ? "" : "mx-auto grid max-w-3xl gap-4"}">
          <section class="${embedded ? "" : "glass rounded-lg p-5 shadow-luxury"}">
            ${
              embedded
                ? ""
                : `
                  <div class="mb-4 flex items-center gap-3">
                    ${icon("settings", 22, "accent")}
                    <div>
                      <h2 class="text-lg font-black">Backend Connection</h2>
                      <p class="muted text-sm">Add the Supabase project URL and anon key for this device.</p>
                    </div>
                  </div>
                `
            }

            <div class="grid gap-3">
              ${inputRow(`${prefix}-url`, "Supabase URL", backend.url, "gauge")}
              ${inputRow(`${prefix}-anon`, "Supabase anon key", backend.anon, "key-round")}
              ${inputRow(`${prefix}-admin-code`, "Optional admin passcode", backend.adminCode, "lock", "password")}
              <button class="btn focusable mt-2 inline-flex items-center justify-center gap-2 px-5 py-3" onclick="saveBackendFromForm('${prefix}')">
                ${icon("save", 18)} Save Connection
              </button>
            </div>
          </section>
        </div>
      `;
    }

    function inputRow(id, placeholder, value = "", iconName = "circle", type = "text") {
      return `
        <label class="glass flex items-center gap-3 rounded px-3 py-2">
          ${icon(iconName, 18, "muted shrink-0")}
          <input
            id="${id}"
            type="${type}"
            value="${escapeHtml(value)}"
            placeholder="${escapeHtml(placeholder)}"
            class="focusable min-w-0 flex-1 bg-transparent py-2 text-sm font-bold outline-none placeholder:font-medium"
          />
        </label>
      `;
    }

    function goAdmin() {
      location.hash = "#admin";
      render();
    }

    function goCheckIn() {
      history.replaceState(null, "", location.pathname);
      state.camper = null;
      state.entry = blankEntry();
      state.message = "";
      render();
    }

    function logoutCamper() {
      state.camper = null;
      state.entry = blankEntry();
      state.message = "";
      setTheme("Gold");
      render();
    }

    function render() {
      if (isAdminRoute()) {
        renderAdminGate();
      } else if (state.camper) {
        renderCamperDashboard();
      } else {
        renderLogin();
      }
    }

    function renderLogin(error = "") {
      setTheme("Gold");

      shell(`
        <div class="mx-auto grid min-h-[calc(100vh-7rem)] max-w-5xl place-items-center">
          <section class="grid w-full gap-6 text-center">
            <div>
              <p class="accent text-sm font-black uppercase tracking-[0.28em]">American Express Mivtza</p>
              <h1 class="mt-2 text-4xl font-black sm:text-6xl">Learn. Do. Earn. Grow.</h1>
            </div>

            <div class="glass mx-auto grid h-56 w-full max-w-xl place-items-center rounded-lg border-dashed shadow-luxury">
              <div class="lux-card flex h-32 w-52 flex-col items-center justify-center gap-3 rounded-lg">
                ${icon("sparkles", 34)}
                <span class="text-xs font-black uppercase tracking-[0.2em]">Graphic Logo</span>
              </div>
            </div>

            <div class="mx-auto w-full max-w-xl">
              <input id="hiddenScanInput" class="hidden-scan-input" autocomplete="off" />

              <label class="glass flex items-center gap-3 rounded-lg px-5 py-4 shadow-glow">
                ${icon("scan-line", 22, "accent")}
                <input
                  id="scanInput"
                  placeholder="Scan NFC card"
                  autocomplete="off"
                  class="focusable flex-1 bg-transparent text-center text-lg font-black outline-none"
                  onkeydown="handleScanInputKey(event)"
                />
                ${icon("chevron-right", 22)}
              </label>

              ${
                error
                  ? `<p class="mt-3 rounded border border-red-400/40 bg-red-500/10 px-4 py-3 text-sm font-bold text-red-600">${escapeHtml(error)}</p>`
                  : ""
              }

              ${
                !state.supabase
                  ? `<div class="mt-5">${setupPanel("login")}</div>`
                  : `<p class="muted mt-3 text-sm font-bold">Reader is listening. Scan a card to begin.</p>`
              }
            </div>
          </section>
        </div>
      `);

      const input = document.getElementById("scanInput");
      if (input) {
        input.focus();
        setTimeout(() => input.focus(), 100);
      }
    }

    function handleScanInputKey(event) {
      if (event.key === "Enter") {
        const value = event.currentTarget.value.trim();
        event.currentTarget.value = "";
        if (value) fetchCamperByNfc(value);
      }
    }

    document.addEventListener("keydown", event => {
      if (isAdminRoute() || state.camper) return;

      const active = document.activeElement;
      const isTypingField = active && ["INPUT", "TEXTAREA", "SELECT"].includes(active.tagName);

      if (isTypingField && active.id !== "hiddenScanInput" && active.id !== "scanInput") return;

      if (event.key === "Enter") {
        const scanned = state.scanBuffer.trim();
        state.scanBuffer = "";
        if (scanned) fetchCamperByNfc(scanned);
        return;
      }

      if (event.key.length === 1) {
        state.scanBuffer += event.key;
        clearTimeout(state.scanTimer);
        state.scanTimer = setTimeout(() => state.scanBuffer = "", 600);
      }
    });

    async function fetchCamperByNfc(nfcId) {
      if (!state.supabase) {
        renderLogin("Supabase connection is not configured on this device.");
        return;
      }

      renderLogin("Fetching camper profile...");

      const { data, error } = await state.supabase
        .from("camper_profiles")
        .select("*")
        .eq("nfc_id", nfcId.trim())
        .maybeSingle();

      if (error) {
        renderLogin(error.message);
        return;
      }

      if (!data) {
        renderLogin("No camper found for that card.");
        return;
      }

      state.camper = data;
      state.entry = blankEntry();
      await loadConfigForScoring();
      renderCamperDashboard();
    }

    async function loadConfigForScoring() {
      if (!state.supabase) return;
      const { data } = await state.supabase
        .from("mivtza_config")
        .select("*")
        .limit(1)
        .maybeSingle();

      state.config = data || {};
    }

    function getWeight(config, field) {
      const candidates = [
        field,
        `${field}_points`,
        field.replace("learn_", "points_"),
        field.replace("hanhaga_", "points_")
      ];

      for (const candidate of candidates) {
        const value = Number(config?.[candidate]);
        if (Number.isFinite(value) && value > 0) return value;
      }

      return learningKeys.includes(field) ? 10 : 0;
    }

    function calculateScore(entry, config) {
      const learningTotal = learningKeys.reduce((sum, key) => {
        return sum + (entry[key] ? getWeight(config, key) : 0);
      }, 0);

      const hanhagaCount = hanhagaKeys.filter(key => entry[key]).length;
      return Math.round(learningTotal * (1 + hanhagaCount * 0.05));
    }

    function statCard(label, value, iconName) {
      return `
        <div class="glass rounded-lg p-4">
          <div class="muted mb-2 flex items-center gap-2">
            ${icon(iconName, 16)}
            <span class="text-xs font-black uppercase tracking-[0.12em]">${escapeHtml(label)}</span>
          </div>
          <p class="text-2xl font-black">${escapeHtml(value ?? 0)}</p>
        </div>
      `;
    }

    function checkboxTile(field, source = "entry") {
      const checked = state[source][field];

      return `
        <button
          type="button"
          class="focusable flex min-h-16 items-center gap-3 rounded-lg border p-4 text-left font-black transition ${checked ? "tile-checked" : "glass"}"
          onclick="toggleField('${source}', '${field}')"
        >
          <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded border line-border ${checked ? "btn" : ""}">
            ${checked ? icon("check", 17) : ""}
          </span>
          ${escapeHtml(fieldLabels[field])}
        </button>
      `;
    }

    function toggleField(source, field) {
      state[source][field] = !state[source][field];
      if (source === "entry") renderCamperDashboard();
      if (source === "correction") renderAdmin();
    }

    function renderCamperDashboard() {
      const camper = state.camper;
      const status = normalizeStatus(camper.card_status);
      const score = calculateScore(state.entry, state.config);

      shell(`
        <div class="mx-auto grid max-w-7xl gap-5">
          <section class="lux-card rounded-lg p-5 shadow-luxury">
            <div class="grid gap-4 lg:grid-cols-[1.4fr_.8fr_.8fr_.8fr]">
              <div>
                <p class="text-xs font-black uppercase tracking-[0.18em] opacity-70">Cardmember</p>
                <h1 class="mt-2 text-4xl font-black">${escapeHtml(camper.name)}</h1>
              </div>
              ${statCard("Tier", status, "wallet-cards")}
              ${statCard("Lifetime", camper.total_points, "award")}
              ${statCard("This Week", camper.weekly_points, "calendar-days")}
            </div>
          </section>

          <div class="grid gap-5 lg:grid-cols-[1fr_20rem]">
            <section class="grid gap-5">
              <div class="glass rounded-lg p-5">
                <h2 class="mb-4 flex items-center gap-2 text-xl font-black">
                  ${icon("sparkles", 22, "accent")} Learning Points
                </h2>
                <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
                  ${learningKeys.map(key => checkboxTile(key)).join("")}
                </div>
              </div>

              <div class="glass rounded-lg p-5">
                <h2 class="mb-4 flex items-center gap-2 text-xl font-black">
                  ${icon("shield-check", 22, "accent")} Daily Hanhagos
                </h2>
                <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
                  ${hanhagaKeys.map(key => checkboxTile(key)).join("")}
                </div>
              </div>
            </section>

            <aside class="glass sticky top-5 h-fit rounded-lg p-5 shadow-luxury">
              <p class="muted text-xs font-black uppercase tracking-[0.16em]">Estimated Daily Score</p>
              <p class="mt-3 text-6xl font-black">${score}</p>
              <p class="muted mt-3 text-sm font-bold">Learning total multiplied by 1.00 plus 0.05 for each selected Hanhaga.</p>
              <button class="btn focusable mt-5 flex w-full items-center justify-center gap-2 px-5 py-4 text-lg" onclick="submitDailyEntry()">
                ${icon("badge-check", 22)} Submit
              </button>
            </aside>
          </div>
        </div>
      `, { status, logout: true });
    }

    async function submitDailyEntry() {
      if (!state.supabase || !state.camper) return;

      const payload = {
        camper_id: state.camper.id,
        entry_date: today(),
        ...state.entry
      };

      const { error } = await state.supabase
        .from("daily_entries")
        .insert(payload);

      if (error) {
        alert(error.message);
        return;
      }

      showApprovedModal();

      setTimeout(() => {
        state.camper = null;
        state.entry = blankEntry();
        setTheme("Gold");
        render();
      }, 2000);
    }

    function showApprovedModal() {
      const modal = document.createElement("div");
      modal.className = "fixed inset-0 z-50 grid place-items-center bg-black/45 p-6";
      modal.innerHTML = `
        <div class="lux-card max-w-md rounded-lg p-8 text-center shadow-luxury">
          ${icon("badge-check", 52)}
          <h2 class="mt-4 text-3xl font-black">Transaction Approved</h2>
          <p class="mt-2 text-lg font-black">Points Credited</p>
        </div>
      `;
      document.body.appendChild(modal);
      refreshIcons();
      setTimeout(() => modal.remove(), 1900);
    }

    function renderAdminGate() {
      const backend = getStoredBackend();
      setTheme("Platinum");

      if (!backend.adminCode || sessionStorage.getItem("mivtza_admin_unlocked") === "1") {
        renderAdmin();
        return;
      }

      shell(`
        <div class="mx-auto grid min-h-[60vh] max-w-md place-items-center">
          <section class="glass w-full rounded-lg p-5 shadow-luxury">
            ${icon("lock", 28, "accent mb-3")}
            <h1 class="text-2xl font-black">Admin Access</h1>
            <div class="mt-5">${inputRow("admin-passcode", "Passcode", "", "key-round", "password")}</div>
            <button class="btn focusable mt-4 w-full px-5 py-3" onclick="unlockAdmin()">Unlock</button>
          </section>
        </div>
      `, { admin: true, status: "Platinum" });
    }

    function unlockAdmin() {
      const backend = getStoredBackend();
      const value = document.getElementById("admin-passcode").value;

      if (value === backend.adminCode) {
        sessionStorage.setItem("mivtza_admin_unlocked", "1");
        renderAdmin();
      } else {
        alert("Incorrect passcode.");
      }
    }

    async function loadAdminData() {
      if (!state.supabase) return;

      const [{ data: roster, error: rosterError }, { data: rules, error: rulesError }] = await Promise.all([
        state.supabase.from("camper_profiles").select("*").order("name"),
        state.supabase.from("mivtza_config").select("*").limit(1).maybeSingle()
      ]);

      if (rosterError) state.message = rosterError.message;
      if (rulesError) state.message = rulesError.message;

      state.roster = roster || [];
      state.rules = rules || {};
    }

    async function renderAdmin() {
      setTheme("Platinum");

      if (!state.supabase) {
        shell(`
          <div class="mx-auto grid max-w-3xl gap-5">
            ${setupPanel("admin-setup")}
          </div>
        `, { admin: true, status: "Platinum" });
        return;
      }

      await loadAdminData();

      const vipThreshold = Number(state.rules.vip_event_threshold ?? 700);
      const standardThreshold = Number(state.rules.standard_event_threshold ?? 400);

      const vip = state.roster.filter(camper => Number(camper.weekly_points) >= vipThreshold);
      const standard = state.roster.filter(camper => {
        const points = Number(camper.weekly_points);
        return points >= standardThreshold && points < vipThreshold;
      });
      const notEligible = state.roster.filter(camper => Number(camper.weekly_points) < standardThreshold);

      shell(`
        <div class="mx-auto grid max-w-7xl gap-5">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h1 class="text-3xl font-black">Private Admin Control Center</h1>
              <p class="muted font-bold">Roster, event access, adjustments, and config rules.</p>
            </div>
            <button class="glass focusable flex h-11 w-11 items-center justify-center rounded border line-border" title="Refresh" onclick="renderAdmin()">
              ${icon("refresh-cw", 19)}
            </button>
          </div>

          ${
            state.message
              ? `<div class="glass flex items-center justify-between rounded-lg p-4 font-bold">
                   <span>${escapeHtml(state.message)}</span>
                   <button onclick="state.message=''; renderAdmin()">${icon("x", 18)}</button>
                 </div>`
              : ""
          }

          ${rosterSection()}
          <section class="grid gap-4 lg:grid-cols-3">
            ${accessList("VIP Event Access", "sparkles", vip)}
            ${accessList("Standard Event Access", "badge-check", standard)}
            ${accessList("Not Eligible", "x", notEligible)}
          </section>

          <section class="grid gap-5 lg:grid-cols-2">
            ${registerCamperSection()}
            <div class="glass rounded-lg p-5">
              <h2 class="mb-4 flex items-center gap-2 text-xl font-black">
                ${icon("settings", 22, "accent")} Backend Settings
              </h2>
              ${setupPanel("admin-backend", true)}
            </div>
          </section>

          ${adjustmentsSection()}
          ${configRulesSection()}
        </div>
      `, { admin: true, status: "Platinum" });
    }

    function rosterSection() {
      return `
        <section class="glass overflow-hidden rounded-lg shadow-luxury">
          <div class="flex items-center gap-2 border-b line-border p-4">
            ${icon("users", 22, "accent")}
            <h2 class="text-xl font-black">Camper Roster</h2>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full min-w-[850px] text-left text-sm">
              <thead class="accent-bg">
                <tr>
                  ${["Name", "NFC ID", "Card Status", "Weekly Points", "Lifetime Points", "Weekly Event Status"].map(head => `
                    <th class="px-4 py-3 font-black">${head}</th>
                  `).join("")}
                </tr>
              </thead>
              <tbody>
                ${state.roster.map(camper => `
                  <tr class="border-t line-border">
                    <td class="px-4 py-3 font-black">${escapeHtml(camper.name)}</td>
                    <td class="px-4 py-3">${escapeHtml(camper.nfc_id)}</td>
                    <td class="px-4 py-3">${escapeHtml(camper.card_status)}</td>
                    <td class="px-4 py-3">${escapeHtml(camper.weekly_points)}</td>
                    <td class="px-4 py-3">${escapeHtml(camper.total_points)}</td>
                    <td class="px-4 py-3">${escapeHtml(camper.weekly_event_status)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function accessList(title, iconName, campers) {
      return `
        <div class="glass rounded-lg p-5">
          <h2 class="mb-4 flex items-center gap-2 text-lg font-black">
            ${icon(iconName, 21, "accent")} ${escapeHtml(title)}
          </h2>
          <div class="grid gap-2">
            ${
              campers.length
                ? campers.map(camper => `
                    <div class="flex items-center justify-between rounded border line-border px-3 py-2">
                      <span class="font-black">${escapeHtml(camper.name)}</span>
                      <span class="muted text-sm font-bold">${escapeHtml(camper.weekly_points)} pts</span>
                    </div>
                  `).join("")
                : `<p class="muted text-sm font-bold">No campers in this group.</p>`
            }
          </div>
        </div>
      `;
    }

    function registerCamperSection() {
      return `
        <div class="glass rounded-lg p-5">
          <h2 class="mb-4 flex items-center gap-2 text-xl font-black">
            ${icon("plus", 22, "accent")} Register Camper
          </h2>
          <div class="grid gap-3">
            ${inputRow("new-camper-name", "Camper name", "", "users")}
            ${inputRow("new-camper-nfc", "Scan NFC card ID", "", "scan-line")}
            <button class="btn focusable px-5 py-3" onclick="registerCamper()">Register</button>
          </div>
        </div>
      `;
    }

    async function registerCamper() {
      const name = document.getElementById("new-camper-name").value.trim();
      const nfc_id = document.getElementById("new-camper-nfc").value.trim();

      if (!name || !nfc_id) {
        alert("Name and NFC ID are required.");
        return;
      }

      const { error } = await state.supabase
        .from("campers")
        .insert({ name, nfc_id });

      state.message = error ? error.message : "Camper registered.";
      renderAdmin();
    }

    function adjustmentsSection() {
      return `
        <section class="glass rounded-lg p-5">
          <h2 class="mb-4 flex items-center gap-2 text-xl font-black">
            ${icon("pencil-line", 22, "accent")} Adjustments
          </h2>

          <div class="grid gap-4 lg:grid-cols-[1fr_12rem_10rem]">
            <select id="correction-camper" class="focusable rounded border line-border bg-transparent px-3 py-3 font-bold" onchange="state.correction.camper_id=this.value">
              <option value="">Select camper</option>
              ${state.roster.map(camper => `
                <option value="${escapeHtml(camper.id)}" ${String(state.correction.camper_id) === String(camper.id) ? "selected" : ""}>
                  ${escapeHtml(camper.name)}
                </option>
              `).join("")}
            </select>

            <input
              id="correction-date"
              class="focusable rounded border line-border bg-transparent px-3 py-3 font-bold"
              type="date"
              value="${escapeHtml(state.correction.entry_date)}"
              onchange="state.correction.entry_date=this.value"
            />

            <input
              id="manual-points"
              class="focusable rounded border line-border bg-transparent px-3 py-3 font-bold"
              type="number"
              placeholder="Manual pts"
              value="${escapeHtml(state.correction.manual_points_adjustment)}"
              onchange="state.correction.manual_points_adjustment=this.value"
            />
          </div>

          <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
            ${[...learningKeys, ...hanhagaKeys].map(key => checkboxTile(key, "correction")).join("")}
          </div>

          <button class="btn focusable mt-4 inline-flex items-center gap-2 px-5 py-3" onclick="saveCorrection()">
            ${icon("save", 18)} Save Correction
          </button>
        </section>
      `;
    }

    async function saveCorrection() {
      const camperId = state.correction.camper_id;
      if (!camperId) {
        alert("Select a camper first.");
        return;
      }

      const entryPayload = {
        camper_id: camperId,
        entry_date: state.correction.entry_date
      };

      [...learningKeys, ...hanhagaKeys].forEach(key => {
        entryPayload[key] = Boolean(state.correction[key]);
      });

      const { error: entryError } = await state.supabase
        .from("daily_entries")
        .upsert(entryPayload, { onConflict: "camper_id,entry_date" });

      const { error: camperError } = await state.supabase
        .from("campers")
        .update({ manual_points_adjustment: Number(state.correction.manual_points_adjustment || 0) })
        .eq("id", camperId);

      state.message = entryError?.message || camperError?.message || "Correction saved.";
      renderAdmin();
    }

    function configRulesSection() {
      const entries = Object.entries(state.rules);

      return `
        <section class="glass rounded-lg p-5">
          <h2 class="mb-4 flex items-center gap-2 text-xl font-black">
            ${icon("gauge", 22, "accent")} Config Rules
          </h2>

          ${
            entries.length
              ? `
                <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                  ${entries.map(([key, value]) => `
                    <label class="grid gap-1">
                      <span class="muted text-xs font-black uppercase tracking-[0.1em]">${escapeHtml(key)}</span>
                      <input
                        class="focusable rounded border line-border bg-transparent px-3 py-3 font-bold"
                        value="${escapeHtml(value ?? "")}"
                        onchange="state.rules['${escapeHtml(key)}']=this.value"
                      />
                    </label>
                  `).join("")}
                </div>
              `
              : `
                <p class="muted font-bold">No config row found yet. Add fields in Supabase or insert the first row there.</p>
              `
          }

          <button class="btn focusable mt-4 inline-flex items-center gap-2 px-5 py-3" onclick="saveRules()">
            ${icon("save", 18)} Save Rules
          </button>
        </section>
      `;
    }

    async function saveRules() {
      const payload = { ...state.rules };

      let result;
      if (payload.id) {
        result = await state.supabase
          .from("mivtza_config")
          .update(payload)
          .eq("id", payload.id);
      } else {
        result = await state.supabase
          .from("mivtza_config")
          .upsert(payload);
      }

      state.message = result.error ? result.error.message : "System rules saved.";
      renderAdmin();
    }

    window.addEventListener("hashchange", render);

    initSupabase();
    render();
  </script>
</body>
</html>
